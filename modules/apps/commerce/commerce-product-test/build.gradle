copyLibs {
	enabled = true
}

dependencies {
	compileOnly group: "com.github.ignaciotcrespo", name: "frutilla", version: "0.7.1"

	testIntegrationImplementation group: "com.liferay", name: "com.liferay.arquillian.extension.junit.bridge", version: "1.0.19"
	testIntegrationImplementation group: "com.liferay.portal", name: "com.liferay.portal.kernel", version: "default"
	testIntegrationImplementation project(":apps:commerce:commerce-product-api")
	testIntegrationImplementation project(":apps:commerce:commerce-product-test-util")
	testIntegrationImplementation project(":apps:commerce:commerce-product-type-simple")
	testIntegrationImplementation project(":apps:portal-search:portal-search-api")
	testIntegrationImplementation project(":apps:portal-search:portal-search-test-util")
	testIntegrationImplementation project(":core:petra:petra-string")
	testIntegrationImplementation project(":apps:commerce:commerce-test-util")
}

if (!System.getenv("JENKINS_HOME")) {
	apply plugin: "com.liferay.poshi.runner.resources.defaults"

	poshiRunnerResources {
		baseName "commerce"

		dirs = ["src/testFunctional"]
	}
}