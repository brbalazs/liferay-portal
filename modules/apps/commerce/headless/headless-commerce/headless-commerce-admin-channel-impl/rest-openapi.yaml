openapi: 3.0.0
info:
  description: Liferay Commerce Admin Channel API
  license:
        name: "Apache 2.0"
        url: "http://www.apache.org/licenses/LICENSE-2.0.html"
  title: Liferay Commerce Admin Channel API
  version: v1.0
servers:
  - url: https://virtserver.swaggerhub.com/liferayinc/commerce-admin-channel-api/v1.0
    description: SwaggerHub API Auto Mocking
paths:
  /channels:
    get:
      tags: ["Channel"]
      description: Retrieves channels.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
            application/xml:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
        401:
          description: Authentication information is missing or invalid
          content:
            application/json:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: The specified resource was not found
          content:
            application/json:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
        500:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: ["Channel"]
      summary: Creates  a Channel.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Channel"
          application/xml:
            schema:
              $ref: "#/components/schemas/Channel"
        required: true
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
            application/xml:
              schema:
                $ref: "#/components/schemas/Channel"
        400:
          description: Invalid input
        401:
          description: Authentication information is missing or invalid
          content:
            application/json:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: The specified resource was not found
          content:
            application/json:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
        500:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
  /channels/{channelId}:
    get:
      tags: ["Channel"]
      description: Retrive information of the given Channel.
      parameters:
        - name: channelId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
            description: Channel Id
            format: int64
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
            application/xml:
              schema:
                $ref: "#/components/schemas/Channel"
        401:
          description: Authentication information is missing or invalid
          content:
            application/json:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: The specified resource was not found
          content:
            application/json:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
        500:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: ["Channel"]
      summary: Updates a Channel.
      parameters:
        - name: channelId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
            description: Channel Id
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Channel"
          application/xml:
            schema:
              $ref: "#/components/schemas/Channel"
        required: true
      responses:
        200:
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
            application/xml:
              schema:
                $ref: "#/components/schemas/Channel"
        400:
          description: Invalid input
        401:
          description: Authentication information is missing or invalid
          content:
            application/json:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: The specified resource was not found
          content:
            application/json:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
        500:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: ["Channel"]
      summary: Deletes a Channel by ID.
      parameters:
        - name: channelId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
            description: Channel Id
            format: int64
      responses:
        204:
          description: No content
        401:
          description: Authentication information is missing or invalid
          content:
            application/json:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: ["Channel"]
      summary: Updates a Channel.
      parameters:
        - name: channelId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
            description: Channel Id
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Channel"
          application/xml:
            schema:
              $ref: "#/components/schemas/Channel"
        required: true
      responses:
        200:
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
            application/xml:
              schema:
                $ref: "#/components/schemas/Channel"
        400:
          description: Invalid input
        401:
          description: Authentication information is missing or invalid
          content:
            application/json:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: The specified resource was not found
          content:
            application/json:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
        500:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Channel:
      required:
        - currency
        - name
        - type
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        currency:
          type: string
        type:
          type: string
    Error:
      required:
        - errorCode
        - errorDescription
        - message
        - status
      type: object
      properties:
        message:
          type: string
          readOnly: true
          example: No CommerceCurrency exists with the key {groupId=41811, code=US
            Dollar}
        errorDescription:
          type: string
          readOnly: true
          example: Unable to find currency. Currency code should be expressed with
            3-letter ISO 4217 format.
        status:
          type: integer
          description: HTTP Status code
          readOnly: true
          example: 404
        errorCode:
          type: integer
          description: Internal error code mapping
          readOnly: true
          example: 996
  parameters:
    channelId:
      name: channelId
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: integer
        description: Channel Id
        format: int64
