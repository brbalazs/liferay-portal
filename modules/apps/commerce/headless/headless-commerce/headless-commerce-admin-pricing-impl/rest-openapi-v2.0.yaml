components:
  schemas:
    Discount:
      required:
        - limitationType
        - target
        - title
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
          example: 30130
        accountGroups:
          type: array
          items:
            $ref: "#/components/schemas/DiscountAccountGroup"
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/DiscountAccount"
        active:
          type: boolean
          example: true
        categories:
          type: array
          items:
            $ref: "#/components/schemas/DiscountCategory"
        channels:
          type: array
          items:
            $ref: "#/components/schemas/DiscountChannel"
        couponCode:
          type: string
          example: "SAVE20"
        displayDate:
          type: string
          format: date
          example: "2017-07-21"
        customFields:
          type: object
          additionalProperties: true
        expirationDate:
          type: string
          format: date
          example: "2017-08-21"
        externalReferenceCode:
          type: string
          example: "AB-34098-789-N"
        level:
          type: string
          example: L1
        limitationTimes:
          type: integer
          format: int32
          minimum: 0
          example: 0
        limitationType:
          type: string
          example: "unlimited"
        maximumDiscountAmount:
          type: number
          format: bigdecimal
          minimum: 0
          example: 25
        neverExpire:
          type: boolean
          example: true
        numberOfUse:
          type: integer
          format: int32
          minimum: 0
          example: 5
        percentageLevel1:
          type: number
          format: bigdecimal
          minimum: 0
          example: 20
        percentageLevel2:
          type: number
          format: bigdecimal
          minimum: 0
          example: 0
        percentageLevel3:
          type: number
          format: bigdecimal
          minimum: 0
          example: 0
        percentageLevel4:
          type: number
          format: bigdecimal
          minimum: 0
          example: 0
        productGroups:
          type: array
          items:
            $ref: "#/components/schemas/DiscountProductGroup"
        products:
          type: array
          items:
            $ref: "#/components/schemas/DiscountProduct"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/DiscountRule"
        rulesConjuntion:
          type: boolean
          example: true
        target:
          type: string
          example: "subtotal"
        title:
          type: string
          example: "20% Off"
        useCouponCode:
          type: boolean
          example: true
        usePercentage:
          type: boolean
          example: true
    DiscountAccount:
      type: object
      properties:
        accountExternalReferenceCode:
          type: string
          example: "PAB-34098-789-N"
        accountId:
          type: integer
          format: int64
          minimum: 0
          example: 30130
        accountName:
          type: string
        discountExternalReferenceCode:
          type: string
          example: "DAB-34098-789-N"
        discountId:
          type: integer
          format: int64
          minimum: 0
          example: 30324
        id:
          type: integer
          format: int64
          readOnly: true
          minimum: 0
          example: 30643
    DiscountAccountGroup:
      type: object
      properties:
        accountGroupExternalReferenceCode:
          type: string
          example: "PAB-34098-789-N"
        accountGroupId:
          type: integer
          format: int64
          minimum: 0
          example: 30130
        accountGroupName:
          type: string
        discountExternalReferenceCode:
          type: string
          example: "DAB-34098-789-N"
        discountId:
          type: integer
          format: int64
          minimum: 0
          example: 30324
        id:
          type: integer
          format: int64
          readOnly: true
          minimum: 0
          example: 30643
    DiscountCategory:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          minimum: 0
          example: 30643
        categoryExternalReferenceCode:
          type: string
          example: "PAB-34098-789-N"
        categoryId:
          type: integer
          format: int64
          minimum: 0
          example: 30130
        categoryName:
          type: string
        discountExternalReferenceCode:
          type: string
          example: "DAB-34098-789-N"
        discountId:
          type: integer
          format: int64
          minimum: 0
          example: 30324
    DiscountChannel:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          minimum: 0
          example: 30643
        channelExternalReferenceCode:
          type: string
          example: "PAB-34098-789-N"
        channelId:
          type: integer
          format: int64
          minimum: 0
          example: 30130
        channelName:
          type: string
        discountExternalReferenceCode:
          type: string
          example: "DAB-34098-789-N"
        discountId:
          type: integer
          format: int64
          minimum: 0
          example: 30324
    DiscountProduct:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          minimum: 0
          example: 30643
        discountExternalReferenceCode:
          type: string
          example: "DAB-34098-789-N"
        discountId:
          type: integer
          format: int64
          minimum: 0
          example: 30324
        productExternalReferenceCode:
          type: string
          example: "PAB-34098-789-N"
        productId:
          type: integer
          format: int64
          minimum: 0
          example: 30130
        productName:
          type: string
    DiscountProductGroup:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          minimum: 0
          example: 30643
        productGroupExternalReferenceCode:
          type: string
          example: "PAB-34098-789-N"
        productGroupId:
          type: integer
          format: int64
          minimum: 0
          example: 30130
        productGroupName:
          type: string
        discountExternalReferenceCode:
          type: string
          example: "DAB-34098-789-N"
        discountId:
          type: integer
          format: int64
          minimum: 0
          example: 30324
    DiscountRule:
      required:
        - type
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          minimum: 0
          example: 30643
        discountId:
          type: integer
          format: int64
          readOnly: true
          minimum: 0
          example: 30324
        name:
          type: string
        type:
          type: string
          example: "cart-total"
        typeSettings:
          type: string
          example: "22.50"
    Error:
      required:
      - errorCode
      - errorDescription
      - message
      - status
      type: object
      properties:
        message:
