components:
    parameters:
        cartId:
            in: path
            explode: false
            name: cartId
            required: true
            schema:
                description:
                    Cart Id
                format: int64
                minimum: 0
                type: integer
            style: simple
        cartItemId:
            in: path
            explode: false
            name: cartItemId
            required: true
            schema:
                description:
                    Cart Item Id
                format: int64
                minimum: 0
                type: integer
            style: simple
        channelId:
            in: path
            explode: false
            name: channelId
            required: true
            schema:
                description:
                    Channel Id
                format: int64
                minimum: 0
                type: integer
            style: simple
        noteId:
            in: path
            explode: false
            name: noteId
            required: true
            schema:
                description:
                    Note Id
                format: int64
                minimum: 0
                type: integer
            style: simple
    schemas:
        BillingAddress:
            properties:
                city:
                    type: string
                country:
                    type: string
                countryISOCode:
                    type: string
                description:
                    type: string
                id:
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
                latitude:
                    format: double
                    type: number
                longitude:
                    format: double
                    type: number
                name:
                    type: string
                phoneNumber:
                    type: string
                region:
                    type: string
                regionISOCode:
                    type: string
                street1:
                    type: string
                street2:
                    type: string
                street3:
                    type: string
                vatNumber:
                    type: string
                zip:
                    type: string
            required:
                - city
                - countryISOCode
                - name
                - street1
            type: object
        Cart:
            properties:
                account:
                    type: string
                accountId:
                    format: int64
                    readOnly: true
                    type: integer
                author:
                    type: string
                billingAddress:
                    $ref: "#/components/schemas/BillingAddress"
                cartItems:
                    items:
                        $ref: "#/components/schemas/CartItem"
                    type: array
                couponCode:
                    type: string
                createDate:
                    example: 2017-07-21
                    format: date
                    type: string
                customFields:
                    additionalProperties: true
                    type: object
                id:
                    format: int64
                    readOnly: true
                    type: integer
                lastPriceUpdateDate:
                    format: date
                    type: string
                modifiedDate:
                    format: date
                    type: string
                notes:
                    items:
                        $ref: "#/components/schemas/Note"
                    type: array
                paymentMethod:
                    type: string
                paymentMethodLabel:
                    type: string
                paymentStatus:
                    format: int32
                    minimum: 0
                    type: integer
                paymentStatusLabel:
                    type: string
                printedNote:
                    type: string
                purchaseOrderNumber:
                    type: string
                shippingAddress:
                    $ref: "#/components/schemas/ShippingAddress"
                shippingMethod:
                    type: string
                shippingOption:
                    type: string
                status:
                    type: string
                summary:
                    $ref: "#/components/schemas/Summary"
            type: object
        CartItem:
            properties:
                customFields:
                    additionalProperties: true
                    type: object
                id:
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                name:
                    type: string
                options:
                    type: string
                price:
                    $ref: "#/components/schemas/Price"
                productId:
                    format: int64
                    type: integer
                quantity:
                    example: 30080
                    format: int32
                    minimum: 0
                    type: integer
                sku:
                    type: string
                skuId:
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                subscription:
                    example: true
                    type: boolean
            type: object
        CartItemPost:
            properties:
                customFields:
                    additionalProperties: true
                    type: object
                id:
                    format: int64
                    type: integer
                options:
                    type: string
                quantity:
                    format: int32
                    type: integer
                skuId:
                    format: int64
                    type: integer
            type: object
        CartPost:
            properties:
                accountId:
                    format: int64
                    readOnly: true
                    type: integer
                billingAddress:
                    $ref: "#/components/schemas/BillingAddress"
                billingAddressId:
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
                cartItemPosts:
                    items:
                        $ref: "#/components/schemas/CartItemPost"
                    type: array
                customFields:
                    additionalProperties: true
                    type: object
                paymentMethod:
                    type: string
                shippingAddress:
                    $ref: "#/components/schemas/ShippingAddress"
                shippingAddressId:
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
                shippingMethod:
                    type: string
                shippingOption:
                    type: string
            type: object
        CouponCode:
            properties:
                code:
                    type: string
            type: object
        Error:
            properties:
                errorCode:
                    description:
                        Internal error code mapping
                    example: 996
                    readOnly: true
                    type: integer
                errorDescription:
                    example: Unable to find currency. Currency code should be expressed with
                        3-letter ISO 4217 format.
                    readOnly: true
                    type: string
                message:
                    example: No CommerceCurrency exists with the key {groupId=41811, code=US
                        Dollar}
                    readOnly: true
                    type: string
                status:
                    description:
                        HTTP Status code
                    example: 404
                    readOnly: true
                    type: integer
            required:
                - errorCode
                - errorDescription
                - message
                - status
            type: object
        Note:
            properties:
                author:
                    type: string
                content:
                    type: string
                id:
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                orderId:
                    example: 30128
                    format: int64
                    minimum: 0
                    type: integer
                restricted:
                    example: true
                    type: boolean
            type: object
        PaymentMethod:
            properties:
                description:
                    type: string
                key:
                    type: string
                name:
                    type: string
            type: object
        Price:
            properties:
                currency:
                    type: string
                discount:
                    format: double
                    type: number
                discountFormatted:
                    type: string
                discountPercentage:
                    type: string
                discountPercentageLevel1:
                    format: double
                    type: number
                discountPercentageLevel2:
                    format: double
                    type: number
                discountPercentageLevel3:
                    format: double
                    type: number
                discountPercentageLevel4:
                    format: double
                    type: number
                finalPrice:
                    format: double
                    type: number
                finalPriceFormatted:
                    type: string
                price:
                    format: double
                    type: number
                priceFormatted:
                    type: string
                promoPrice:
                    format: double
                    type: number
                promoPriceFormatted:
                    type: string
            type: object
        ShippingAddress:
            properties:
                city:
                    type: string
                country:
                    type: string
                countryISOCode:
                    type: string
                description:
                    type: string
                id:
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
                latitude:
                    format: double
                    type: number
                longitude:
                    format: double
                    type: number
                name:
                    type: string
                phoneNumber:
                    type: string
                region:
                    type: string
                regionISOCode:
                    type: string
                street1:
                    type: string
                street2:
                    type: string
                street3:
                    type: string
                zip:
                    type: string
            required:
                - city
                - countryISOCode
                - name
                - street1
            type: object
        ShippingMethod:
            properties:
                description:
                    type: string
                id:
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
                name:
                    type: string
                shippingOptions:
                    items:
                        $ref: "#/components/schemas/ShippingOption"
                    type: array
            type: object
        ShippingOption:
            properties:
                amount:
                    format: double
                    type: number
                amountFormatted:
                    type: string
                label:
                    type: string
                name:
                    type: string
            type: object
        Summary:
            properties:
                currency:
                    type: string
                itemsQuantity:
                    type: integer
                shippingDiscountPercentages:
                    items:
                        type: string
                    type: array
                shippingDiscountValue:
                    format: double
                    type: number
                shippingDiscountValueFormatted:
                    type: string
                shippingValue:
                    format: double
                    type: number
                shippingValueFormatted:
                    type: string
                subtotal:
                    format: double
                    type: number
                subtotalDiscountPercentages:
                    items:
                        type: string
                    type: array
                subtotalDiscountValue:
                    format: double
                    type: number
                subtotalDiscountValueFormatted:
                    type: string
                subtotalFormatted:
                    type: string
                taxValue:
                    format: double
                    type: number
                taxValueFormatted:
                    type: string
                total:
                    format: double
                    type: number
                totalDiscountPercentages:
                    items:
                        type: string
                    type: array
                totalDiscountValue:
                    format: double
                    type: number
                totalDiscountValueFormatted:
                    type: string
                totalFormatted:
                    type: string
            type: object
