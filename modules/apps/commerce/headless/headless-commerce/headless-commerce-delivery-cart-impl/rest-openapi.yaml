components:
    parameters:
        cartId:
            in: path
            explode: false
            name: cartId
            required: true
            schema:
                description:
                    Cart Id
                example: 30130
                format: int64
                minimum: 0
                type: integer
            style: simple
        cartItemId:
            in: path
            explode: false
            name: cartItemId
            required: true
            schema:
                description:
                    Cart Item Id
                example: 30130
                format: int64
                minimum: 0
                type: integer
            style: simple
        channelId:
            in: path
            explode: false
            name: channelId
            required: true
            schema:
                description:
                    Channel Id
                example: 30130
                format: int64
                minimum: 0
                type: integer
            style: simple
    schemas:
        Cart:
            properties:
                account:
                    type: string
                accountId:
                    format: int64
                    readOnly: true
                    type: integer
                author:
                    type: string
                cartItems:
                    items:
                        $ref: "#/components/schemas/CartItem"
                    type: array
                createDate:
                    example: 2017-07-21
                    format: date
                    type: string
                id:
                    format: int64
                    readOnly: true
                    type: integer
                status:
                    type: string
                summary:
                    $ref: "#/components/schemas/Summary"
            type: object
        CartItem:
            properties:
                id:
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                name:
                    type: string
                price:
                    $ref : "#/components/schemas/Price"
                quantity:
                    example: 30080
                    format: int32
                    minimum: 0
                    type: integer
            type: object
        Error:
            properties:
                errorCode:
                    description:
                        Internal error code mapping
                    example: 996
                    readOnly: true
                    type: integer
                errorDescription:
                    example: Unable to find currency. Currency code should be expressed with
                        3-letter ISO 4217 format.
                    readOnly: true
                    type: string
                message:
                    example: No CommerceCurrency exists with the key {groupId=41811, code=US
                        Dollar}
                    readOnly: true
                    type: string
                status:
                    description:
                        HTTP Status code
                    example: 404
                    readOnly: true
                    type: integer
            required:
                - errorCode
                - errorDescription
                - message
                - status
            type: object
        Order:
            properties:
                accountId:
                    format: int64
                    readOnly: true
                    type: integer
                orderItems:
                    items:
                        $ref: "#/components/schemas/OrderItem"
                    type: array
            type: object
        OrderItem:
            properties:
                id:
                    format: int64
                    type: integer
                options:
                    type: string
                productId:
                    format: int64
                    type: integer
                quantity:
                    format: int32
                    type: integer
            type: object
        Price:
            properties:
                currency:
                    type: string
                discount:
                    format: double
                    type: number
                discountFormatted:
                    type: string
                finalPrice:
                    format: double
                    type: number
                finalPriceFormatted:
                    type: string
                price:
                    format: double
                    type: number
                priceFormatted:
                    type: string
                promoPrice:
                    format: double
                    type: number
                promoPriceFormatted:
                    type: string
            type: object
        Summary:
            properties:
                itemsQuantity:
                    type: integer
                shippingDiscountValue:
                    type: string
                shippingValue:
                    type: string
                subtotal:
                    type: string
                subtotalDiscountValue:
                    type: string
                taxValue:
                    type: string
                total:
                    type: string
                totalDiscountValue:
                    type: string
            type: object
