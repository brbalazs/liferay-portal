components:
    parameters:
        cartId:
            in: path
            explode: false
            name: cartId
            required: true
            schema:
                description:
                    Cart Id
                format: int64
                minimum: 0
                type: integer
            style: simple
        cartItemId:
            in: path
            explode: false
            name: cartItemId
            required: true
            schema:
                description:
                    Cart Item Id
                format: int64
                minimum: 0
                type: integer
            style: simple
        channelId:
            in: path
            explode: false
            name: channelId
            required: true
            schema:
                description:
                    Channel Id
                format: int64
                minimum: 0
                type: integer
            style: simple
        noteId:
            in: path
            explode: false
            name: noteId
            required: true
            schema:
                description:
                    Note Id
                format: int64
                minimum: 0
                type: integer
            style: simple
    schemas:
        BillingAddress:
            properties:
                city:
                    type: string
                countryISOCode:
                    type: string
                description:
                    type: string
                id:
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
                latitude:
                    format: double
                    type: number
                longitude:
                    format: double
                    type: number
                name:
                    type: string
                phoneNumber:
                    type: string
                regionISOCode:
                    type: string
                street1:
                    type: string
                street2:
                    type: string
                street3:
                    type: string
                vatNumber:
                    type: string
                zip:
                    type: string
            required:
                - city
                - countryISOCode
                - name
                - street1
            type: object
        Cart:
            properties:
                account:
                    type: string
                accountId:
                    format: int64
                    readOnly: true
                    type: integer
                author:
                    type: string
                billingAddress:
                    $ref: "#/components/schemas/BillingAddress"
                cartItems:
                    items:
                        $ref: "#/components/schemas/CartItem"
                    type: array
                createDate:
                    example: 2017-07-21
                    format: date
                    type: string
                id:
                    format: int64
                    readOnly: true
                    type: integer
                notes:
                    items:
                        $ref: "#/components/schemas/Note"
                    type: array
                paymentMethod:
                    example: paypal
                    type: string
                paymentStatus:
                    example: 0
                    format: int32
                    minimum: 0
                    type: integer
                printedNote:
                    example: Order printed note
                    type: string
                shippingAddress:
                    $ref: "#/components/schemas/ShippingAddress"
                status:
                    type: string
                summary:
                    $ref: "#/components/schemas/Summary"
            type: object
        CartItem:
            properties:
                id:
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                name:
                    type: string
                price:
                    $ref: "#/components/schemas/Price"
                quantity:
                    example: 30080
                    format: int32
                    minimum: 0
                    type: integer
            type: object
        Error:
            properties:
                errorCode:
                    description:
                        Internal error code mapping
                    example: 996
                    readOnly: true
                    type: integer
                errorDescription:
                    example: Unable to find currency. Currency code should be expressed with
                        3-letter ISO 4217 format.
                    readOnly: true
                    type: string
                message:
                    example: No CommerceCurrency exists with the key {groupId=41811, code=US
                        Dollar}
                    readOnly: true
                    type: string
                status:
                    description:
                        HTTP Status code
                    example: 404
                    readOnly: true
                    type: integer
            required:
                - errorCode
                - errorDescription
                - message
                - status
            type: object
        Note:
            properties:
                author:
                    type: string
                content:
                    type: string
                id:
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                orderId:
                    example: 30128
                    format: int64
                    minimum: 0
                    type: integer
                restricted:
                    example: true
                    type: boolean
            type: object
        Order:
            properties:
                accountId:
                    format: int64
                    readOnly: true
                    type: integer
                billingAddress:
                    $ref: "#/components/schemas/BillingAddress"
                billingAddressId:
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
                orderItems:
                    items:
                        $ref: "#/components/schemas/OrderItem"
                    type: array
                shippingAddress:
                    $ref: "#/components/schemas/ShippingAddress"
                shippingAddressId:
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
            type: object
        OrderItem:
            properties:
                billingAddress:
                    $ref: "#/components/schemas/BillingAddress"
                billingAddressId:
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
                id:
                    format: int64
                    type: integer
                options:
                    type: string
                productId:
                    format: int64
                    type: integer
                quantity:
                    format: int32
                    type: integer
                shippingAddress:
                    $ref: "#/components/schemas/ShippingAddress"
                shippingAddressId:
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
            type: object
        Price:
            properties:
                currency:
                    type: string
                discount:
                    format: double
                    type: number
                discountFormatted:
                    type: string
                discountPercentage:
                    type: string
                discountPercentageLevel1:
                    example: 20
                    format: bigdecimal
                    minimum: 0
                    type: number
                discountPercentageLevel2:
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                discountPercentageLevel3:
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                discountPercentageLevel4:
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                finalPrice:
                    format: double
                    type: number
                finalPriceFormatted:
                    type: string
                price:
                    format: double
                    type: number
                priceFormatted:
                    type: string
                promoPrice:
                    format: double
                    type: number
                promoPriceFormatted:
                    type: string
            type: object
        ShippingAddress:
            properties:
                city:
                    type: string
                countryISOCode:
                    type: string
                description:
                    type: string
                id:
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
                latitude:
                    format: double
                    type: number
                longitude:
                    format: double
                    type: number
                name:
                    type: string
                phoneNumber:
                    type: string
                regionISOCode:
                    type: string
                street1:
                    type: string
                street2:
                    type: string
                street3:
                    type: string
                zip:
                    type: string
            required:
                - city
                - countryISOCode
                - name
                - street1
            type: object
        Summary:
            properties:
                itemsQuantity:
                    type: integer
                shippingDiscountPercentageLevel1:
                    example: 20
                    format: bigdecimal
                    minimum: 0
                    type: number
                shippingDiscountPercentageLevel2:
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                shippingDiscountPercentageLevel3:
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                shippingDiscountPercentageLevel4:
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                shippingDiscountValue:
                    type: string
                shippingValue:
                    type: string
                subtotal:
                    type: string
                subtotalDiscountPercentageLevel1:
                    example: 20
                    format: bigdecimal
                    minimum: 0
                    type: number
                subtotalDiscountPercentageLevel2:
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                subtotalDiscountPercentageLevel3:
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                subtotalDiscountPercentageLevel4:
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                subtotalDiscountValue:
                    type: string
                taxValue:
                    type: string
                total:
                    type: string
                totalDiscountPercentageLevel1:
                    example: 20
                    format: bigdecimal
                    minimum: 0
                    type: number
                totalDiscountPercentageLevel2:
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                totalDiscountPercentageLevel3:
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                totalDiscountPercentageLevel4:
                    example: 0
                    format: bigdecimal
                    minimum: 0
                    type: number
                totalDiscountValue:
                    type: string
            type: object
