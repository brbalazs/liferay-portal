paths:
  /channels/{channelId}/products:
    get:
      operationId: getChannelProductsPage
      tags:
        - Product
      description: Retrieves products from selected channel.
      parameters:
        - name: channelId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            minimum: 0
            type: integer
            description: Channel Id
            format: int64
            example: 30130
        - name: filter
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        200:
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
            application/xml:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        401:
          description: Authentication information is missing or invalid
          content:
            application/json:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: The specified resource was not found
          content:
            application/json:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
        500:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
