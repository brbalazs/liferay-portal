components:
  schemas:
    Attachment:
      required:
        - sku
      type: object
      properties:
        attachment:
          type: string
          description: Base64 encoded file
        displayDate:
          type: string
          format: date
          example: 2017-07-21
        expirationDate:
          type: string
          format: date
          example: 2017-08-21
        title:
          type: string
        options:
          type: object
          additionalProperties:
            type: string
          example:
            optionKey: optionValueKey
            color: yellow
            size: xs
        priority:
          type: number
          format: double
          example: 1.2
        src:
          type: string
          description: URL of the location
        type:
          type: integer
          format: int32
          readOnly: true
        neverExpire:
          type: boolean
          example: true
        id:
          minimum: 0
          type: integer
          format: int64
          readOnly: true
          example: 30130
    Availability:
      type: object
      properties:
        label:
          type: string
          example: Available
        stockQuantity:
          type: integer
          format: int32
    Category:
      type: object
      properties:
        name:
          type: string
          description: Category Name
        vocabulary:
          type: string
          readOnly: true
          example: Default Vocabulary
        siteId:
          type: integer
          format: int64
        id:
          minimum: 0
          type: integer
          format: int64
          example: 30130
    Price:
      type: object
      properties:
        currency:
          type: string
        discount:
          type: string
        discountPercentage:
          type: string
        discountPercentages:
          type: array
          items:
            type: string
        finalPrice:
          type: string
        price:
          type: number
          format: double
        priceFormatted:
          type: string
        promoPrice:
          type: number
          format: double
        promoPriceFormatted:
          type: string
        tierPrice:
          type: number
          format: double
        tierPriceFormatted:
          type: string
    Product:
      type: object
      properties:
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        createDate:
          type: string
          format: date
        description:
          type: string
        expando:
          type: object
          additionalProperties: true
        friendlyUrl:
          type: string
        id:
          minimum: 0
          type: integer
          format: int64
          readOnly: true
          example: 30130
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        metaDescription:
          type: string
        metaKeyword:
          type: string
        metaTitle:
          type: string
        modifiedDate:
          type: string
          format: date
        multipleOrderQuantity:
          type: integer
          format: int32
        name:
          type: string
        productOptions:
          type: array
          items:
            $ref: "#/components/schemas/ProductOption"
        productId:
          type: integer
          format: int64
          readOnly: true
        productSpecifications:
          type: array
          items:
            $ref: "#/components/schemas/ProductSpecification"
        productType:
          type: string
          example: simple
        relatedProducts:
          type: array
          items:
            $ref: "#/components/schemas/RelatedProduct"
        shortDescription:
          type: string
        skus:
          type: array
          items:
            $ref: "#/components/schemas/Sku"
        tags:
          type: array
          example:
            - tag1
            - tag2
            - tag3
          items:
            type: string
        slug:
          type: string
        urlImage:
          type: string
    ProductOption:
      type: object
      properties:
        name:
          type: string
        key:
          type: string
          example: color
        description:
          type: string
        fieldType:
          type: string
          example: select
          enum:
            - select
            - radio
            - date
            - checkbox
            - checkbox_multiple
            - numeric
        priority:
          type: number
          format: double
          example: 1.2
        productOptionValues:
          type: array
          items:
            $ref: "#/components/schemas/ProductOptionValue"
        catalogId:
          type: integer
          format: int64
        id:
          minimum: 0
          type: integer
          format: int64
          readOnly: true
          example: 30130
        optionId:
          minimum: 0
          type: integer
          format: int64
          example: 30080
    ProductOptionValue:
      type: object
      properties:
        name:
          type: string
        key:
          type: string
          example: black
        priority:
          type: number
          format: double
          example: 1.2
        id:
          minimum: 0
          type: integer
          format: int64
          readOnly: true
          example: 30130
    ProductSpecification:
      type: object
      properties:
        id:
          minimum: 0
          type: integer
          format: int64
          example: 31130
        optionCategoryId:
          minimum: 0
          type: integer
          format: int64
          example: 30129
        productId:
          minimum: 0
          type: integer
          format: int64
          example: 30129
        specificationId:
          minimum: 0
          type: integer
          format: int64
          example: 30129
        specificationKey:
          type: string
          example: specification-key
        value:
          type: string
        priority:
          minimum: 0
          type: number
          format: double
          example: 1.2
    Sku:
      type: object
      properties:
        allowedOrderQuantities:
          type: array
          example:
            - 10
            - 20
            - 30
            - 40
          items:
            type: string
        availability:
          $ref: "#/components/schemas/Availability"
        depth:
          minimum: 0
          type: number
          format: double
          example: 1.1
        displayDate:
          type: string
          format: date
          example: 2017-07-21
        expirationDate:
          type: string
          format: date
          example: 2017-08-21
        gtin:
          type: string
          example: "12341234"
        height:
          minimum: 0
          type: number
          format: double
          example: 20.2
        id:
          minimum: 0
          type: integer
          format: int64
          readOnly: true
          example: 30130
        manufacturerPartNumber:
          type: string
          example: "12341234"
        maxOrderQuantity:
          type: integer
          format: int32
        minOrderQuantity:
          type: integer
          format: int32
        neverExpire:
          type: boolean
          example: true
        options:
          type: object
          additionalProperties:
            type: string
          example:
            optionKey: optionValueKey
            color: yellow
            size: xs
        published:
          type: boolean
          example: true
        purchasable:
          type: boolean
          example: true
        price:
          $ref: "#/components/schemas/Price"
        sku:
          type: string
        weight:
          minimum: 0
          type: number
          format: double
          example: 1.1
        width:
          minimum: 0
          type: number
          format: double
          example: 20.2
    RelatedProduct:
      type: object
      properties:
        id:
          minimum: 0
          type: integer
          format: int64
          readOnly: true
          example: 30130
        priority:
          type: number
          format: double
          example: 1.2
        productId:
          minimum: 0
          type: integer
          format: int64
          example: 30129
        type:
          type: string
          example: cross-sell
    Error:
      required:
        - errorCode
        - errorDescription
        - message
        - status
      type: object
      properties:
        message:
          type: string
          readOnly: true
          example: No CommerceCurrency exists with the key {groupId=41811, code=US
            Dollar}
        errorDescription:
          type: string
          readOnly: true
          example: Unable to find currency. Currency code should be expressed with
            3-letter ISO 4217 format.
        status:
          type: integer
          description: HTTP Status code
          readOnly: true
          example: 404
        errorCode:
          type: integer
          description: Internal error code mapping
          readOnly: true
          example: 996
  parameters:
    channelId:
      name: channelId
      in: path
      required: true
      style: simple
      explode: false
      schema:
        minimum: 0
        type: integer
        description: Channel Id
        format: int64
        example: 30130
    productId:
      name: productId
      in: path
      required: true
      style: simple
      explode: false
      schema:
        minimum: 0
        type: integer
        description: Product Id
        format: int64
        example: 30130
