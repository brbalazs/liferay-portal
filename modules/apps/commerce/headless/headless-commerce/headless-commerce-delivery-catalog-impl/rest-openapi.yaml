components:
    parameters:
        channelId:
            in: path
            explode: false
            name: channelId
            required: true
            schema:
                description:
                    Channel Id
                example: 30130
                format: int64
                minimum: 0
                type: integer
            style: simple
        productId:
            in: path
            explode: false
            name: productId
            required: true
            schema:
                description:
                    Product Id
                example: 30130
                format: int64
                minimum: 0
                type: integer
            style: simple
    schemas:
        Availability:
            properties:
                availabilityLabel:
                    example: Available
                    type: string
                availabilityNumber:
                    format: int32
                    type: integer
            type: object
        Category:
            properties:
                id:
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                name:
                    description:
                        Category Name
                    type: string
                siteId:
                    format: int64
                    type: integer
                vocabulary:
                    example: Default Vocabulary
                    readOnly: true
                    type: string
            type: object
        Error:
            properties:
                errorCode:
                    description:
                        Internal error code mapping
                    example: 996
                    readOnly: true
                    type: integer
                errorDescription:
                    example: Unable to find currency. Currency code should be expressed with
                        3-letter ISO 4217 format.
                    readOnly: true
                    type: string
                message:
                    example: No CommerceCurrency exists with the key {groupId=41811, code=US
                        Dollar}
                    readOnly: true
                    type: string
                status:
                    description:
                        HTTP Status code
                    example: 404
                    readOnly: true
                    type: integer
            required:
                - errorCode
                - errorDescription
                - message
                - status
            type: object
        Price:
            properties:
                discount:
                    type: string
                discountPercentage:
                    type: string
                discountPercentages:
                    items:
                        type: string
                    type: array
                finalPrice:
                    type: string
                price:
                    format: double
                    type: number
                priceFormatted:
                    type: string
                promoPrice:
                    format: double
                    type: number
                promoPriceFormatted:
                    type: string
                tierPrice:
                    format: double
                    type: number
                tierPriceFormatted:
                    type: string
            type: object
        Product:
            properties:
                categories:
                    items:
                        $ref: "#/components/schemas/Category"
                    type: array
                createDate:
                    format: date
                    type: string
                description:
                    type: string
                expando:
                    additionalProperties: true
                    type: object
                friendlyUrl:
                    type: string
                id:
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                metaDescription:
                    type: string
                metaKeyword:
                    type: string
                metaTitle:
                    type: string
                modifiedDate:
                    format: date
                    type: string
                multipleOrderQuantity:
                    format: int32
                    type: integer
                name:
                    type: string
                productId:
                    format: int64
                    readOnly: true
                    type: integer
                productType:
                    example: simple
                    type: string
                relatedProducts:
                    items:
                        $ref: "#/components/schemas/RelatedProduct"
                    type: array
                shortDescription:
                    type: string
                skus:
                    items:
                        $ref: "#/components/schemas/Sku"
                    type: array
                slug:
                    type: string
                tags:
                    example:
                        - tag1
                        - tag2
                        - tag3
                    items:
                        type: string
                    type: array
                urlImage:
                    type: string
            type: object
        RelatedProduct:
            properties:
                id:
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                priority:
                    example: 1.2
                    format: double
                    type: number
                productId:
                    example: 30129
                    format: int64
                    minimum: 0
                    type: integer
                type:
                    example: "cross-sell"
                    type: string
            type: object
        Sku:
            properties:
                allowedOrderQuantities:
                    example:
                        - 10
                        - 20
                        - 30
                        - 40
                    items:
                        type: string
                    type: array
                availability:
                    $ref: "#/components/schemas/Availability"
                depth:
                    example: 1.1
                    format: double
                    minimum: 0
                    type: number
                displayDate:
                    example: 2017-07-21
                    format: date
                    type: string
                expirationDate:
                    example: 2017-08-21
                    format: date
                    type: string
                gtin:
                    example: "12341234"
                    type: string
                height:
                    example: 20.2
                    format: double
                    minimum: 0
                    type: number
                manufacturerPartNumber:
                    example: "12341234"
                    type: string
                maxOrderQuantity:
                    format: int32
                    type: integer
                minOrderQuantity:
                    format: int32
                    type: integer
                neverExpire:
                    example: true
                    type: boolean
                options:
                    additionalProperties:
                        type: string
                    example:
                        color: yellow
                        optionKey: optionValueKey
                        size: xs
                    type: object
                price:
                    $ref: "#/components/schemas/Price"
                published:
                    example: true
                    type: boolean
                purchasable:
                    example: true
                    type: boolean
                sku:
                    type: string
                weight:
                    example: 1.1
                    format: double
                    minimum: 0
                    type: number
                width:
                    example: 20.2
                    format: double
                    minimum: 0
                    type: number
            type: object
info:
    description:
        Headless Delivery Commerce Catalog API
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Headless Delivery
    version: v1.0
openapi: 3.0.1
paths:
    /products/{id}:
        get:
            description:
                Retrieves products from selected channel.
            operationId: getProduct
            parameters:
                - in: path
                  explode: false
                  name: id
                  required: true
                  schema:
                      description:
                          Product Id
                      example: 30130
                      format: int64
                      minimum: 0
                      type: integer
                  style: simple
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Product"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Product"
                401:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Authentication information is missing or invalid
                404:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        The specified resource was not found
                500:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Unexpected error
            tags: ["Product"]
    /products/{productId}/categories:
        get:
            description:
                Gets a list of Category related to a Product.
            operationId: getProductCategoriesPage
            parameters:
                - in: path
                  explode: false
                  name: productId
                  required: true
                  schema:
                      description:
                          Product Id
                      example: 30130
                      format: int64
                      minimum: 0
                      type: integer
                  style: simple
                - in: query
                  name: page
                  required: false
                  schema:
                      type: integer
                - in: query
                  name: pageSize
                  required: false
                  schema:
                      type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/Category"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/Category"
                                type: array
                    description:
                        Successful operation
                401:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Authentication information is missing or invalid
                404:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        The specified resource was not found
                500:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Unexpected error
            tags:
                - Category
    /products/{productId}/relatedProducts:
        get:
            description:
                Gets a list of Related Products of a Product.
            operationId: getProductRelatedProductsPage
            parameters:
                - in: path
                  explode: false
                  name: productId
                  required: true
                  schema:
                      description:
                          Product Id
                      example: 30130
                      format: int64
                      minimum: 0
                      type: integer
                  style: simple
                - in: query
                  explode: true
                  name: type
                  required: false
                  schema:
                      type: string
                  style: form
                - in: query
                  name: page
                  required: false
                  schema:
                      type: integer
                - in: query
                  name: pageSize
                  required: false
                  schema:
                      type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/RelatedProduct"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/RelatedProduct"
                                type: array
                    description:
                        Successful operation
                401:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Authentication information is missing or invalid
                404:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        The specified resource was not found
                500:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Unexpected error
            tags: ["RelatedProduct"]
    /relatedProducts/{id}:
        get:
            description:
                Gets a Related Product by ID.
            operationId: getRelatedProduct
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      description:
                          The resource Id
                      example: 30130
                      format: int64
                      minimum: 0
                      type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RelatedProduct"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/RelatedProduct"
                    description:
                        Successful operation
                400:
                    description:
                        Invalid input
                401:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Authentication information is missing or invalid
                404:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        The specified resource was not found
                500:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Unexpected error
            tags:
                - RelatedProduct
    /stores/{channelId}/products/{id}/skus:
        get:
            description:
                Retrieves products from selected channel.
            operationId: getStoreChannelProductIdSkusPage
            parameters:
                - in: path
                  explode: false
                  name: channelId
                  required: true
                  schema:
                      description:
                          Channel Id
                      example: 30130
                      format: int64
                      minimum: 0
                      type: integer
                  style: simple
                - in: path
                  explode: false
                  name: id
                  required: true
                  schema:
                      description:
                          Product Id
                      example: 30130
                      format: int64
                      minimum: 0
                      type: integer
                  style: simple
                - in: query
                  name: page
                  required: false
                  schema:
                      type: integer
                - in: query
                  name: pageSize
                  required: false
                  schema:
                      type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/Sku"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/Sku"
                                type: array
                401:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Authentication information is missing or invalid
                404:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        The specified resource was not found
                500:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Unexpected error
            tags: ["Sku"]
    /stores/{channelId}/products:
        get:
            description:
                Retrieves products from selected channel.
            operationId: getStoreChannelProductsPage
            parameters:
                - in: path
                  explode: false
                  name: channelId
                  required: true
                  schema:
                      description:
                          Channel Id
                      example: 30130
                      format: int64
                      minimum: 0
                      type: integer
                  style: simple
                - in: query
                  name: filter
                  required: false
                  schema:
                      type: string
                - in: query
                  name: page
                  required: false
                  schema:
                      type: integer
                - in: query
                  name: pageSize
                  required: false
                  schema:
                      type: integer
                - in: query
                  name: sort
                  required: false
                  schema:
                      type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/Product"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/Product"
                                type: array
                401:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Authentication information is missing or invalid
                404:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        The specified resource was not found
                500:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Unexpected error
            tags: ["Product"]
servers:
    - url: /