cache-expiration-time-description=حدد الوقت بالدقائق، حيث يتم مسح ذاكرة التخزين المؤقت SPA. استخدم قيمة صفرية إذا كان يجب ألا تنتهي صلاحية ذاكرة التخزين المؤقت أبداً أثناء التنقل في SPA. استخدم قيمة سالبة إذا كان يجب تعطيل ذاكرة التخزين المؤقت.
cache-expiration-time-name=Cache 過期時間
disable-in-internet-explorer=تعطيل SPA في Internet Explorer
disable-in-internet-explorer-11=تعطيل SPA في Internet Explorer 11
disable-in-internet-explorer-11-description=بسبب وجود مشكلة في محرك تحويل Trident (الذي يستخدمه IE11), عند استخدام SPA للتنقل في الصفحة، سيتم دائمًا تطبيق استعلامات الوسائط عند تحديد استعلامات بأدنى عرض فقط أو استعلامات بأقصى عرض فقط، حتى لو كان عرض الصفحة لا يطابق تلك الاستعلامات. وهذا يؤثر أيضًا على إطارات iframes الخاصة بالجهات الخارجية على الصفحة. قم بتعطيل SPA للتغلب على هذه المشكلة.
disable-in-internet-explorer-description=من أجل حل المشكلة في محرك تحويل Trident (الذي يستخدمه IE11) ومحرك تحويل MSHTML (الذي يستخدمه Edge)، فإن التحويل الصحيح للصفحة مع SPA يتطلب حاليًا إعادة تنزيل جميع ملفات CSS على جميع تنقلات الصفحات لجميع متصفحات Internet Explorer، والتي يمكن أن تتسبب في مزيد من البطء في تحميل الصفحات عند تمكين SPA بخلاف الحال مع تعطيل SPA. قم بتعطيل SPA للتغلب على هذه المشكلة.
it-looks-like-this-is-taking-longer-than-expected=看起來這需要比預期更長的時間。
navigation-exception-selectors-description=定義 SPA 應該忽略的 CSS 選擇器。
navigation-exception-selectors-name=導航例外選擇器
oops=عذرًا!
request-timeout-description=حدد الوقت بالمللي ثانية الذي تنتهي مهلة طلب SPA. استخدم قيمة صفرية إذا كان يجب ألا ينتهي المهلة أبداً.
request-timeout-name=請求逾時時間
spa-configuration-description=بخصوص التغييرات التي تم إجراؤها هنا، ستتم إعادة تحميل صفحة المستعرض بعد الحفظ.
spa-configuration-name=前端 SPA 架構
the-spa-navigation-request-received-an-invalid-http-status-code=SPA 導航請求收到無效 HTTP 狀態碼。
the-spa-request-timed-out=SPA 請求逾時。
there-was-an-unexpected-error-in-the-spa-request=SPA 請求中發生非預期的錯誤。
user-notification-timeout-description=以毫秒為單位定義向使用者顯示通知的時長，表明請求比預期的長。如果不顯示通知，請使用零值。
user-notification-timeout-name=使用者通知逾時