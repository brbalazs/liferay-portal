cache-expiration-time-description=Definieren Sie die Zeit, in Minuten, in der der SPA-Cache geleert wird. Nutzen Sie einen Wert von 0, wenn der Cache bei SPA-Navigation nie geleert werden soll. Nutzen Sie einen negativen Wert, wenn der Cache deaktiviert werden soll.
cache-expiration-time-name=Cache 過期時間
disable-in-internet-explorer=SPA in Internet Explorer deaktivieren
disable-in-internet-explorer-11=SPA in Internet Explorer 11 deaktivieren
disable-in-internet-explorer-11-description=Wenn SPA für Seitennavigation verwendet wird, werden Medienabfragen aufgrund eines Bugs im Trident-Renderingmodul (verwendet von IE11) immer angewendet, wenn nur "min-width"-Abfragen oder nur "max-width"-Abfragen angegeben sind, selbst wenn die Seitenbreite nicht mit diesen Abfragen übereinstimmt. Das wirkt sich auch auf IFrames von Drittanbietern auf der Seite aus. Deaktivieren Sie SPA, um dieses Problem zu umgehen.
disable-in-internet-explorer-description=Um Fehler im Trident-Renderingmodul (verwendet von IE11) und im MSHTML-Renderingmodul (verwendet von Edge) zu umgehen, müssen zum ordnungsgemäßen Rendern der Seite mit SPA momentan alle CSS-Dateien auf allen Seitennavigationen für alle Internet Explorer-Browser neu heruntergeladen werden, weswegen Seiten eventuell langsamer geladen werden, wenn SPA aktiviert ist. Deaktivieren Sie SPA, um dieses Problem zu umgehen.
it-looks-like-this-is-taking-longer-than-expected=看起來這需要比預期更長的時間。
navigation-exception-selectors-description=定義 SPA 應該忽略的 CSS 選擇器。
navigation-exception-selectors-name=導航例外選擇器
oops=Hoppla
request-timeout-description=Definieren Sie die Zeit, in Millisekunden, für die Zeitüberschreitung bei SPA-Anfragen. Nutzen Sie einen Wert von 0, wenn es bei Anfragen keine Zeitüberschreitung geben soll.
request-timeout-name=請求逾時時間
spa-configuration-description=Damit hier durchgeführte Änderungen wirksam werden, müssen Sie die Browser-Seite nach dem Speichern neu laden.
spa-configuration-name=前端 SPA 架構
the-spa-navigation-request-received-an-invalid-http-status-code=SPA 導航請求收到無效 HTTP 狀態碼。
the-spa-request-timed-out=SPA 請求逾時。
there-was-an-unexpected-error-in-the-spa-request=SPA 請求中發生非預期的錯誤。
user-notification-timeout-description=以毫秒為單位定義向使用者顯示通知的時長，表明請求比預期的長。如果不顯示通知，請使用零值。
user-notification-timeout-name=使用者通知逾時