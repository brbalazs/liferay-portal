cache-expiration-time-description=Définissez à quel moment, en minutes, le cache SPA doit être vidé. Utilisez une valeur de zéro si le cache ne doit jamais expirer pendant une navigation SPA. Utilisez une valeur négative si le cache doit être désactivé.
cache-expiration-time-name=Cache 過期時間
disable-in-internet-explorer=Désactiver SPA dans Internet Explorer
disable-in-internet-explorer-11=Désactiver SPA dans Internet Explorer 11
disable-in-internet-explorer-11-description=En raison d'un bogue dans le moteur de rendu Trident (utilisé par IE11), lorsque SPA est utilisé pour la navigation d'une page, les requêtes multimédia sont toujours appliquées lorsque seules celles min-width ou max-width sont spécifiées, même si la largeur de la page ne correspond pas à ces requêtes. Cela affecte également les iframes tiers sur la page. Désactivez SPA pour résoudre ce problème.
disable-in-internet-explorer-description=Pour contourner un bogue dans le moteur de rendu Trident (utilisé par IE11) et le moteur de rendu MSHTML (utilisé par Edge), le rendu correct de la page avec SPA nécessite de télécharger à nouveau tous les fichiers CSS dans toutes les navigations de page pour tous les navigateurs Internet Explorer, ce qui peut ralentir le chargement des pages quand SPA est activé. Désactivez SPA pour résoudre ce problème.
it-looks-like-this-is-taking-longer-than-expected=看起來這需要比預期更長的時間。
navigation-exception-selectors-description=定義 SPA 應該忽略的 CSS 選擇器。
navigation-exception-selectors-name=導航例外選擇器
oops=Oups
request-timeout-description=Définissez le délai d'attente, en millisecondes, avant expiration de la requête SPA. Utilisez une valeur de zéro si la requête ne doit jamais expirer.
request-timeout-name=請求逾時時間
spa-configuration-description=Vous devez recharger la page du navigateur après enregistrement pour que les modifications soient prises en compte.
spa-configuration-name=前端 SPA 架構
the-spa-navigation-request-received-an-invalid-http-status-code=SPA 導航請求收到無效 HTTP 狀態碼。
the-spa-request-timed-out=SPA 請求逾時。
there-was-an-unexpected-error-in-the-spa-request=SPA 請求中發生非預期的錯誤。
user-notification-timeout-description=以毫秒為單位定義向使用者顯示通知的時長，表明請求比預期的長。如果不顯示通知，請使用零值。
user-notification-timeout-name=使用者通知逾時