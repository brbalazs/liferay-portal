cache-expiration-time-description=Meghatározza az időt percben, amely után az SPA gyorsítótár kiürül. Használjon nulla értéket, ha azt kívánja, hogy a gyorsítótár soha ne járjon le az SPA-navigálás során. Használjon negatív értéket, ha ki kívánja kapcsolni a gyorsítótár használatát.
cache-expiration-time-name=Cache 過期時間
disable-in-internet-explorer=SPA kikapcsolása Internet Explorerben
disable-in-internet-explorer-11=SPA kikapcsolása Internet Explorer 11-ben
disable-in-internet-explorer-11-description=Az IE11 által használt Trident megjelenítőmotor hibája miatt ha az oldalakon történő navigációhoz SPA-t használ, mindig média-lekérdezéseket alkalmazunk, ha csak min-szélességű vagy csak max-szélességű lekérdezések vannak megadva, akkor is, ha az oldal nem felel meg a lekérdezésnek. Ez az oldalon lévő iframe-ekre is vonatkozik. A probléma megkerüléséhez kapcsolja ki az SPA-t.
disable-in-internet-explorer-description=Az used by IE11 által használt Trident megjelenítőmotor és az Edge által használt MSHTML megjelenítőmotor hibájának megkerüléséhez az SPA-t tartalmazó oldal megfelelő megjelenítéséhez újra le kell tölteni a CSS fájlokat minden Internet Explorer böngésző oldalnavigációjához, ami azzal jár, hogy bekapcsolt SPA esetén az oldalak lassabban töltődnek be, mint kikapcsolt SPA mellett. A probléma megkerüléséhez kapcsolja ki az SPA-t.
it-looks-like-this-is-taking-longer-than-expected=看起來這需要比預期更長的時間。
navigation-exception-selectors-description=定義 SPA 應該忽略的 CSS 選擇器。
navigation-exception-selectors-name=導航例外選擇器
oops=Hopp
request-timeout-description=Meghatározza az időt ezredmásodpercben, amely után az SPA kérelem időtúllépést jelez. Használjon nulla értéket, ha a kérelem soha ne lépje túl az időt.
request-timeout-name=請求逾時時間
spa-configuration-description=Mentés után újra be kell tölteni a böngészőoldalt, hogy a változások érvénybe lépjenek.
spa-configuration-name=前端 SPA 架構
the-spa-navigation-request-received-an-invalid-http-status-code=SPA 導航請求收到無效 HTTP 狀態碼。
the-spa-request-timed-out=SPA 請求逾時。
there-was-an-unexpected-error-in-the-spa-request=SPA 請求中發生非預期的錯誤。
user-notification-timeout-description=以毫秒為單位定義向使用者顯示通知的時長，表明請求比預期的長。如果不顯示通知，請使用零值。
user-notification-timeout-name=使用者通知逾時