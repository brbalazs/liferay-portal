cache-expiration-time-description=SPAのキャッシュが消去されるまでの時間を分で定義します。0を設定すると、キャッシュが無期限に設定されます。マイナス値を設定すると、キャッシュが無効になります。
cache-expiration-time-name=Cache 過期時間
disable-in-internet-explorer=Internet ExplorerでSPAを無効にする
disable-in-internet-explorer-11=Internet Explorer 11でSPAを無効にする
disable-in-internet-explorer-11-description=Tridentレンダリングエンジン（IE11が使用）のバグにより、SPAがページナビゲーションに使用される際、min-widthまたはmax-widthクエリのみが指定されている場合は、ページがこれらのクエリに一致しない場合でも常にメディアクエリが適用されます。これは、ページ上のサードパーティのiframeにも影響します。この問題を回避するには、SPAを無効化してください。
disable-in-internet-explorer-description=Tridentレンダリングエンジン（IE11が使用）とMSHTMLレンダリングエンジン（Edgeが使用）のバグを回避するため、現時点でSPAを使用してページを適切にレンダリングするには、すべてのInternet ExplorerブラウザのすべてのページナビゲーションのすべてのCSSファイルを再ダウンロードする必要があります。 この問題を回避するには、SPAを無効化してください。
it-looks-like-this-is-taking-longer-than-expected=看起來這需要比預期更長的時間。
navigation-exception-selectors-description=定義 SPA 應該忽略的 CSS 選擇器。
navigation-exception-selectors-name=導航例外選擇器
oops=処理に時間がかかっております
request-timeout-description=SPAのタイムアウト (ミリ秒単位) を定義します。0が設定されている場合はタイムアウトしません。
request-timeout-name=請求逾時時間
spa-configuration-description=変更が有効になりました。保存後にブラウザをリロードしてください。
spa-configuration-name=前端 SPA 架構
the-spa-navigation-request-received-an-invalid-http-status-code=SPA 導航請求收到無效 HTTP 狀態碼。
the-spa-request-timed-out=SPA 請求逾時。
there-was-an-unexpected-error-in-the-spa-request=SPA 請求中發生非預期的錯誤。
user-notification-timeout-description=以毫秒為單位定義向使用者顯示通知的時長，表明請求比預期的長。如果不顯示通知，請使用零值。
user-notification-timeout-name=使用者通知逾時