user-notification-timeout-description=요청이 예상보다 오래 걸리고 있음을 알리는 알림이 사용자에게 표시되는 시간을 밀리초 단위로 정의합니다. 알림을 표시하지 않으면 0값을 사용합니다. (Automatic Translation)
