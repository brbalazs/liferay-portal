disable-in-internet-explorer=Internet Explorer 에서 SPA 비활성화
disable-in-internet-explorer-11=Internet Explorer 11에서 SPA 비활성화
disable-in-internet-explorer-11-description=Trident 렌더링 엔진(IE11에서 사용)의 버그로 인해 페이지 탐색에 SPA를 사용할 때 최소 너비 또는 최대 너비 쿼리만 지정한 경우 페이지 너비가 지정되지 않은 경우에도 항상 미디어 쿼리가 적용됩니다. 해당 쿼리와 일치합니다. 이는 페이지의 타사 iframe에도 영향을 미칩니다. 이 문제를 해결하려면 SPA를 비활성화하십시오.
disable-in-internet-explorer-description=Trident 렌더링 엔진(IE11에서 사용) 및 MSHTML 렌더링 엔진(Edge에서 사용)의 버그를 해결하려면 현재 SPA를 사용하여 페이지를 올바르게 렌더링하려면 모든 Internet Explorer 브라우저의 모든 페이지 탐색에서 모든 CSS 파일을 다시 다운로드해야 합니다. 이로 인해 SPA가 비활성화된 경우보다 SPA가 활성화된 경우 페이지가 더 느리게 로드될 수 있습니다. 이 문제를 해결하려면 SPA를 비활성화하십시오.
it-looks-like-this-is-taking-longer-than-expected=생각보다 시간이 오래 걸리는 것 같아요.
navigation-exception-selectors-description=SPA가 무시해야 하는 CSS 선택자를 정의합니다.
navigation-exception-selectors-name=내비게이션 예외 선택자
oops=이런 (Automatic Translation)
request-timeout-description=SPA 요청 시간이 단축되는 시간을 밀리초 단위로 정의합니다. 요청이 시간 중지되지 않아야 하는 경우 0 값을 사용합니다. (Automatic Translation)
