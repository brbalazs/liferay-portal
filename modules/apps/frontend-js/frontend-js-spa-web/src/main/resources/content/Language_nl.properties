cache-expiration-time-description=Geeft de tijd in minuten op waarin de SPA-cache wordt leeggemaakt. Gebruik nul als waarde als de cache nooit moet verlopen tijdens SPA-navigatie. Gebruik een negatieve waarde als de cache moet worden uitgeschakeld.
cache-expiration-time-name=Cache 過期時間
disable-in-internet-explorer=SPA uitschakelen in Internet Explorer
disable-in-internet-explorer-11=SPA uitschakelen in Internet Explorer 11
disable-in-internet-explorer-11-description=Door een bug in de Trident-weergavemotor (gebruikt door IE11), zullen mediaquery's bij gebruik van SPA voor paginanavigatie altijd worden toegepast indien query's met min-breedte of max-breedte worden opgegeven, zelfs als de paginabreedte niet overeenstemt met deze query's. Dit geldt ook voor iframes van derden op de pagina. Schakel SPA uit om dit probleem te vermijden.
disable-in-internet-explorer-description=Door een bug in de Trident-weergavemotor (gebruikt door IE11) en de MSHTML-weergavemotor (gebruikt door Edge), moeten momenteel voor een correcte paginaweergave met SPA alle CSS-bestanden voor alle paginanavigaties in alle Internet Explorer-browsers opnieuw worden gedownload. Dit kan ervoor zorgen dat pagina's langzamer laden met SP ingeschakeld dan met SPA uitgeschakeld. Schakel SPA uit om het probleem te vermijden.
it-looks-like-this-is-taking-longer-than-expected=看起來這需要比預期更長的時間。
navigation-exception-selectors-description=定義 SPA 應該忽略的 CSS 選擇器。
navigation-exception-selectors-name=導航例外選擇器
oops=Oeps
request-timeout-description=Geef de tijd in milliseconden op voor een time-out van het SPA-verzoek. Gebruik nul als waarde als er nooit een time-out moet zijn voor het verzoek.
request-timeout-name=請求逾時時間
spa-configuration-description=Om hier gemaakte wijzigingen toe te passen, moet u de browserpagina opnieuw laden na opslag.
spa-configuration-name=前端 SPA 架構
the-spa-navigation-request-received-an-invalid-http-status-code=SPA 導航請求收到無效 HTTP 狀態碼。
the-spa-request-timed-out=SPA 請求逾時。
there-was-an-unexpected-error-in-the-spa-request=SPA 請求中發生非預期的錯誤。
user-notification-timeout-description=以毫秒為單位定義向使用者顯示通知的時長，表明請求比預期的長。如果不顯示通知，請使用零值。
user-notification-timeout-name=使用者通知逾時