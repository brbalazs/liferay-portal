cache-expiration-time-description=Definir o tempo, em minutos, onde o cache do SPA é limpo. Use um valor igual a zero se o cache não deve expirar durante a navegação SPA. Use um valor negativo se o chave deve ser desabilitado.
cache-expiration-time-name=Cache 過期時間
disable-in-internet-explorer=Desativar SPA no Internet Explorer
disable-in-internet-explorer-11=Desativar SPA no Internet Explorer 11
disable-in-internet-explorer-11-description=Devido a um erro no motor de redirecionamento Trident (usado por IE11), quando o SPA é usado para a navegação de página, as consultas de mídia sempre serão aplicadas quando apenas as consultas min-width ou max-width forem especificadas, mesmo se a width da página não combinar com estas consultas. Isto afeta os iframes de terceiros na página. Desative o SPA para contornar este problema.
disable-in-internet-explorer-description=Para contornar um erro no motor de renderização Trident (usado pelo IE11) e motor de renderização MSHTML (usado pelo Edge), que para renderizar de forma adequada a página com SPA atualmente precisa realizar o download de todos os arquivos CSS em todas as páginas de navegação para todos os navegadores Internet Explorer, o que pode fazer com que as páginas sejam carregadas de forma mais lenta com o SPA ativado do que com o SPA desativado.
it-looks-like-this-is-taking-longer-than-expected=看起來這需要比預期更長的時間。
navigation-exception-selectors-description=定義 SPA 應該忽略的 CSS 選擇器。
navigation-exception-selectors-name=導航例外選擇器
oops=Oops
request-timeout-description=Definir o tempo, em minutos, onde uma solicitação do SPA expira. Use um valor igual a zero se a solicitação não deve expirar nunca.
request-timeout-name=請求逾時時間
spa-configuration-description=Para que as alterações realizadas aqui tenham efeito, você deve recarregar a página do navegador depois de salvar.
spa-configuration-name=前端 SPA 架構
the-spa-navigation-request-received-an-invalid-http-status-code=SPA 導航請求收到無效 HTTP 狀態碼。
the-spa-request-timed-out=SPA 請求逾時。
there-was-an-unexpected-error-in-the-spa-request=SPA 請求中發生非預期的錯誤。
user-notification-timeout-description=以毫秒為單位定義向使用者顯示通知的時長，表明請求比預期的長。如果不顯示通知，請使用零值。
user-notification-timeout-name=使用者通知逾時