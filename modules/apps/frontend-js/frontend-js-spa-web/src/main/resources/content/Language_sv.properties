cache-expiration-time-description=Definiera tiden, i minuter, för rensning av SPA-cache. Använd ett nollvärde om cache aldrig ska sluta gälla under SPA-navigering. Använd ett negativt värde om cache ska inaktiveras.
cache-expiration-time-name=Cache 過期時間
disable-in-internet-explorer=Inaktivera SPA i Internet Explorer
disable-in-internet-explorer-11=Inaktivera SPA i Internet Explorer 11
disable-in-internet-explorer-11-description=På grund av ett fel i Trident-renderingsmaskinen (används av IE11) kommer mediefrågor, när SPA används för sidnavigering, alltid att användas när endast frågor gällande minsta bredd eller maximal bredd anges, även om sidbredden inte matchar dessa frågor. Detta påverkar även IFrame från tredje part på sidan. Inaktivera SPA för att kringgå detta problem.
disable-in-internet-explorer-description=För att kringgå ett problem i Trident-renderingsmaskinen (används av IE11) och MSHTML-renderingsmaskinen (används av Edge), måste alla CSS-filer laddas ned igen på alla sidnavigeringar för alla Internet Explorer-webbläsare för att korrekt rendera sidan med SPA. Detta kan leda till att sidor laddas långsammare med SPA aktiverat än med SPA inaktiverat. Inaktivera SPA för att kringgå problemet.
it-looks-like-this-is-taking-longer-than-expected=看起來這需要比預期更長的時間。
navigation-exception-selectors-description=定義 SPA 應該忽略的 CSS 選擇器。
navigation-exception-selectors-name=導航例外選擇器
oops=Hoppsan
request-timeout-description=Ange tid i millisekunder som en SPA-begäran har tidsgräns. Använd ett nollvärde om begäran inte ska ha en tidsgräns.
request-timeout-name=請求逾時時間
spa-configuration-description=För att ändringarna ska träda i kraft måste du läsa in webbläsarsidan på nytt efter att du sparar.
spa-configuration-name=前端 SPA 架構
the-spa-navigation-request-received-an-invalid-http-status-code=SPA 導航請求收到無效 HTTP 狀態碼。
the-spa-request-timed-out=SPA 請求逾時。
there-was-an-unexpected-error-in-the-spa-request=SPA 請求中發生非預期的錯誤。
user-notification-timeout-description=以毫秒為單位定義向使用者顯示通知的時長，表明請求比預期的長。如果不顯示通知，請使用零值。
user-notification-timeout-name=使用者通知逾時