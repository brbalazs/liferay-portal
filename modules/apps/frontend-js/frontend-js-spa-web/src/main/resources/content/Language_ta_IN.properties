cache-expiration-time-description=Define the time, in minutes, in which the SPA cache is cleared. Use a zero value if the cache should never expire during SPA navigation. Use a negative value if cache should be disabled.
cache-expiration-time-name=Cache 過期時間
disable-in-internet-explorer=Disable SPA in Internet Explorer
disable-in-internet-explorer-11=Disable SPA in Internet Explorer 11
disable-in-internet-explorer-11-description=Due to a bug in the Trident rendering engine (used by IE11), when SPA is used for page navigation, media queries will always be applied when only min-width or only max-width queries are specified, even if the page width does not match those queries. This also affects third-party iframes on the page. Disable SPA to work around this issue.
disable-in-internet-explorer-description=In order to work around a bug in the Trident rendering engine (used by IE11) and MSHTML rendering engine (used by Edge), properly rendering the page with SPA currently requires re-downloading all CSS files on all page navigations for all Internet Explorer browsers, which can cause pages to load more slowly with SPA enabled than with SPA disabled. Disable SPA to work around this issue.
it-looks-like-this-is-taking-longer-than-expected=看起來這需要比預期更長的時間。
navigation-exception-selectors-description=定義 SPA 應該忽略的 CSS 選擇器。
navigation-exception-selectors-name=導航例外選擇器
oops=அச்சச்சோ
request-timeout-description=SPA கோரிக்கை நேரத்திற்கான கால அளவை மில்லி செகண்டில் வரையறுக்கவும். எதுவும் வேண்டாமென்றால் 0 எனக் குறிப்பிடவும்.
request-timeout-name=請求逾時時間
spa-configuration-description=மாறியிருக்கிறதா இல்லையா என்று தெளிவாக தெரிந்து கொள்ளவேண்டுமென்றால், இந்த ப்ரவுசர் பக்கத்தை ஒருமுறை ரீலோடு செய்து விடுங்கள்.
spa-configuration-name=前端 SPA 架構
the-spa-navigation-request-received-an-invalid-http-status-code=SPA 導航請求收到無效 HTTP 狀態碼。
the-spa-request-timed-out=SPA 請求逾時。
there-was-an-unexpected-error-in-the-spa-request=SPA 請求中發生非預期的錯誤。
user-notification-timeout-description=以毫秒為單位定義向使用者顯示通知的時長，表明請求比預期的長。如果不顯示通知，請使用零值。
user-notification-timeout-name=使用者通知逾時