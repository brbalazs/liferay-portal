oauth2-allow-authorization-code-grant-description=அன்செலக்ட் செய்தால், ​​ ரிமோட் கிளையன்ட்ஸ்கள் புதிய டோக்கன்களைக் கோர முடியாது, ஏற்கனவே இருக்கும் மற்றும் புதிய கிளையன்ட்ஸ்களுக்கு உடனடியாகப் பொருந்தும்.
