additional-configurations=Допълнителни конфигурации (Automatic Translation)
additional-configurations-help=Въведете потребителски настройки за вграден Elasticsearch, във формат YML (elasticsearch.yml). (Automatic Translation)
additional-index-configurations=Допълнителни конфигурации на индекса (Automatic Translation)
additional-index-configurations-help=Въведете потребителски настройки за индекса liferay, във формат JSON или YML (Elasticsearch Създаване индекс API). (Automatic Translation)
additional-type-mappings=Съпоставяния на допълнителен тип (Automatic Translation)
additional-type-mappings-help=Задайте персонализирани картографи за LiferayDocumentType, във формат JSON (Elasticsearch Put Mapping API). Тази стойност трябва да бъде зададена само с нови съпоставяния на полета. Ако зададете тази стойност с припокриващи се съпоставяния за полета по подразбиране, създаването на индекса е неуспешно. За да заместите изцяло съпоставянията по подразбиране, използвайте "заменитипа на тип". (Automatic Translation)
bootstrap-mlockall=Театрал Моккал (Automatic Translation)
bootstrap-mlockall-help=Ако това е отметнато, адресното пространство на процеса е заключено в RAM, като се предотвратява размяната на паметта на еластичния адрес. (Automatic Translation)
certificate-format=Формат на сертификата (Automatic Translation)
certificate-format-help=Задайте формата на сертификата (PEM или PKCS#12). (Automatic Translation)
client-transport-ignore-cluster-name=Клиент транспорт игнориране на името на клъстера (Automatic Translation)
client-transport-ignore-cluster-name-help=Ако е включена проверката на името на клъстера на свързани възли се игнорира. (Automatic Translation)
client-transport-nodes-sampler-interval=Пробоотборник на възли за транспорт на клиент (Automatic Translation)
client-transport-nodes-sampler-interval-help=Задайте интервала (в секунди), в който клиентски възел извадки/ping възли свързани възли. Ако е изключен, се използва client.transport.nodes_sampler_interval по подразбиране. (Automatic Translation)
client-transport-ping-timeout=Време на изчакване за транспортиране на клиент (Automatic Translation)
client-transport-ping-timeout-help=Въведете времето (в секунди) клиентския възел чака пинг отговор от възел. Ако е изключен, се използва client.transport.ping_timeout по подразбиране. (Automatic Translation)
client-transport-sniff=Клиентски транспорт сниф (Automatic Translation)
client-transport-sniff-help=Ако това е включена, клъстер смъркане е разрешено динамично откриване на наличните възли в клъстера. (Automatic Translation)
cluster-name=Име на клъстер (Automatic Translation)
cluster-name-help=Въведете името на клъстера, за да се присъедините. Името трябва да съответства на отдалечен клъстер, когато режим на работа е отдалечен. (Automatic Translation)
discovery-zen-ping-unicast-hosts-port=Едноадресни хостове пристанище Zen Discovery (Automatic Translation)
discovery-zen-ping-unicast-hosts-port-help=Предоставете диапазон от портове, които да използвате при изграждането на value value.discovery.zen.ping.unicast.hosts. Множество възли Elasticsearch на редица портове могат да действат като клюки рутери на един и същ компютър. (Automatic Translation)
elasticsearch7-configuration-name=Еластична тесена (Automatic Translation)
http-cors-allow-origin=Http CORS разреши произход (Automatic Translation)
http-cors-allow-origin-help=Въведете произхода, за да разрешите, когато е разрешена HTTP CORS. (Automatic Translation)
http-cors-configurations=Http CORS конфигурации (Automatic Translation)
http-cors-configurations-help=Предоставяне на потребителски настройки за HTTP CORS, в YML формат (elasticsearch.yml). (Automatic Translation)
http-cors-enabled=Http CORS поддръжка (Automatic Translation)
http-cors-enabled-help=Ако това е отметнато, споделянето на ресурси от различни произход е разрешено, което определя дали браузър с друг произход може да направи заявки към Еластично търсене. Ако е забранено, уеб инструменти като еластични главата на търсене може да не може да се свърже. (Automatic Translation)
http-enabled=Http поддръжка (Automatic Translation)
http-enabled-help=Тази настройка е отхвърлена и ще бъде премахната в бъдеща версия. Ако е включена тази отметка, HTTP слой е активиран. Ако не е отметнато, HTTP слой е забранен на възли, които не са предназначени да обслужват заявките за почивка директно. (Automatic Translation)
index-name-prefix=Префикс на име на индекс (Automatic Translation)
index-name-prefix-help=Задайте префикса за името на индекса за търсене. Тази стойност не трябва да се променя при нормални условия. Ако промените тази стойност, трябва също да преиндексирате портала и след това ръчно да изтриете стария индекс с помощта на конзолата за управление на Elasticsearch. (Automatic Translation)
log-exceptions-only=Регистрационни само изключения (Automatic Translation)
log-exceptions-only-help=Ако това е отметнато, регистрира изключения само от Elasticsearch и не ги хвърлят отново. (Automatic Translation)
network-bind-host=Мрежово обвързване на хост (Automatic Translation)
network-bind-host-help=Задайте мрежовия интерфейс(и) към който трябва да се свързва един възел, за да се прослушва за входящи заявки. (Automatic Translation)
network-host=Мрежов хост (Automatic Translation)
network-host-help=Задайте името на хоста или IP адреса, обвързан с възела, който се използва за публикуване (рекламиране) на хоста към други възли в клъстера. Това е пряк път, който задава името хост и публикуване хост в същото време. (Automatic Translation)
network-publish-host=Хост за публикуване на мрежа (Automatic Translation)
network-publish-host-help=Задайте един интерфейс възел рекламира други възли в клъстера, така че тези възли могат да се свързват с него. (Automatic Translation)
number-of-index-replicas=Брой на индексни реплики (Automatic Translation)
number-of-index-replicas-help=Въведете броя на копията за всеки индекс на Liferay. Ако е изключен, не се използват реплики. Промените в тази стойност влиза в сила след пълно преиндексиране. (Automatic Translation)
number-of-index-shards=Брой на парчетата индекс (Automatic Translation)
number-of-index-shards-help=Задайте броя на парчетата, които да се използват при създаване на индекс на Liferay. Ако е изключена, ще се използва единичен парче. Промените в тази стойност влиза в сила след пълно преиндексиране. (Automatic Translation)
operation-mode=Режим на работа (Automatic Translation)
operation-mode-help=Режимът на работа REMOTE се свързва към отдалечена самостоятелна elasticsearch клъстер. Режимът на работа EMBEDDED стартира портал с вътрешен еластично търсене екземпляр в същия JVM. Режимът на работа EMBEDDED не се поддържа. (Automatic Translation)
override-type-mappings=Заместване на съпоставяне на типове (Automatic Translation)
override-type-mappings-help=Задайте персонализирани картографи, за да замените изцяло съпоставянията по подразбиране за LiferayDocumentType, във формат JSON (Elasticsearch Put Mapping API). Ако зададете тази стойност, създаването на индекс игнорира дефиницията на съпоставянията по подразбиране и всички точки на разширение, вместо това използва тази дефиниция за алтернативни съпоставяния. Използвайте това, ако имате нужда от LiferayDocumentType, за да бъде създаден с нестандартни съпоставяния за полета по подразбиране. Ако просто трябва да добавите нови персонализирани съпоставяния без припокриване на всички настройки по подразбиране, използвайте additionalTypeMappings. (Automatic Translation)
password-help=Ако изисква удостоверяване е разрешено, се изисква парола. (Automatic Translation)
requires-authentication=Изисква удостоверяване (Automatic Translation)
requires-authentication-help=Ако е разрешено, връзките с Elasticsearch/X-Pack се удостоверяват с конфигурираното потребителско име и парола. (Automatic Translation)
rest-client-logger-level=Ниво на дърваря на REST клиент (Automatic Translation)
rest-client-logger-level-help=Задайте нивото на регистриране за клиента на Elasticsearch REST. (Automatic Translation)
retry-on-conflict=Опитай отново конфликт (Automatic Translation)
retry-on-conflict-help=Задайте броя на опитите за повтаряне на опит, ако възникне конфликт на версия, защото документът е актуализиран между извличането му и актуализирането му. (Automatic Translation)
ssl-certificate-authorities-paths=Органи за SSL сертификати (Automatic Translation)
ssl-certificate-authorities-paths-help=Предоставете списък с пътища до надеждни PEM кодирани файлове на сертификати. (Automatic Translation)
ssl-certificate-path=Сертификат за SSL (Automatic Translation)
ssl-certificate-path-help=Въведете пътя до PEM кодиран файл, съдържащ сертификата (или веригата на сертификата), който ще бъде представен на клиентите, когато се свържат. (Automatic Translation)
ssl-key-path=КЛЮЧ SSL (Automatic Translation)
ssl-key-path-help=Въведете пътя до PEM кодирания файл, съдържащ частния ключ. (Automatic Translation)
ssl-keystore-password=Парола за SSL ключове (Automatic Translation)
ssl-keystore-password-help=Въведете паролата във файла PKCS#12. (Automatic Translation)
ssl-keystore-path=Път до SSL ключове (Automatic Translation)
ssl-keystore-path-help=Въведете пътя до хранилището на ключове, който държи частния ключ и сертификата. (Automatic Translation)
ssl-truststore-password=Парола за ssl надеждност (Automatic Translation)
ssl-truststore-password-help=Въведете паролата в гаранта. (Automatic Translation)
ssl-truststore-path=Ssl TrustStore път (Automatic Translation)
ssl-truststore-path-help=Въведете пътя до файла на гаранта. (Automatic Translation)
track-total-hits=Проследяване на общите посещения (Automatic Translation)
track-total-hits-help=Задайте това на true, за да се отчете точно общият брой посещения, когато има повече от 10 000 резултата за търсене. Задаването на това на true може да окаже влияние върху производителността, когато има голям брой посещения за търсене. (Automatic Translation)
transport-addresses=Транспортни адреси (Automatic Translation)
transport-addresses-help=Задайте адресите на отдалечения възел, към които да се свързвате. Тази стойност е задължителна, когато режим на работа е зададен на ОТДАЛЕЧЕН. (Automatic Translation)
transport-ssl-enabled=Разрешен е ssl транспорт (Automatic Translation)
transport-ssl-enabled-help=Разрешаване или забраняване на TLS/SSL. (Automatic Translation)
transport-ssl-verification-mode=Режим на проверка на SSL транспорт (Automatic Translation)
transport-ssl-verification-mode-help=Укажете типа на проверката (няма, сертификат или пълно) при използване на LDAP защита срещу човек в средата атаки и сертификат подправяне. (Automatic Translation)
transport-tcp-port=Порт за транспорт на TCP (Automatic Translation)
transport-tcp-port-help=Задайте порт, който да се свързва за комуникация между възли. Приема една стойност или диапазон (напр. 9300-9400). (Automatic Translation)
username=Потребителско име (Automatic Translation)
username-help=Ако изисква удостоверяване е разрешено, задайте потребителското име за удостоверяване на Elasticsearch е необходимо. (Automatic Translation)
xpack-security-configuration-name=Защита от X-Pack (Automatic Translation)