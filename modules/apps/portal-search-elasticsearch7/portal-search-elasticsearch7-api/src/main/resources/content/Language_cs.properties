cluster-name=Název clusteru (Automatic Translation)
cluster-name-help=Zadejte název clusteru, ke který se chcete připojit. Název by se měl shodovat se vzdáleným clusterem, pokud je režim operace nastaven na vzdálený. (Automatic Translation)
discovery-zen-ping-unicast-hosts-port=Port hostitelů jednosměrového vysílání Zen Discovery (Automatic Translation)
