client-transport-nodes-sampler-interval=Interval vzorkovače uzlů přenosu klienta (Automatic Translation)
client-transport-nodes-sampler-interval-help=Nastavte interval (v sekundách), ve kterém klientský uzel vzorkul/pings připojené uzly. Pokud se odpojí, bude použita výchozí client.transport.nodes_sampler_interval elasticsearch. (Automatic Translation)
client-transport-ping-timeout=Časový limit příkazu Ping přenosu klienta (Automatic Translation)
