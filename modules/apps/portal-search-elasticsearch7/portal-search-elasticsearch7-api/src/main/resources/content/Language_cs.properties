track-total-hits-help=Nastavte tuto hodnotu na hodnotu true, abyste přesně spočítaly celkový počet přístupů, pokud je k dispozici více než 10 000 výsledků hledání. Nastavení hodnoty true může mít vliv na výkon, pokud je k dispozici velké množství přístupů k hledání. (Automatic Translation)
