http-cors-configurations-help=Zadejte vlastní nastavení pro HTTP CORS ve formátu YML (elasticsearch.yml). (Automatic Translation)
http-cors-enabled=Http CORS povoleno (Automatic Translation)
http-cors-enabled-help=Pokud je tato možnost zaškrtnuta, je povoleno sdílení prostředků mezi zdroji, což určuje, zda prohlížeč jiného původu může požadovat elastické ověřování. Pokud je zakázán, webové front-endové nástroje, jako je elasticsearch-head, se nemusí být možné připojit. (Automatic Translation)
http-enabled=Http povolen (Automatic Translation)
http-enabled-help=Toto nastavení bylo zastaralé a bude odebráno v budoucí verzi. Pokud je tato možnost zaškrtnuta, je povolena vrstva HTTP. Pokud není zaškrtnutí políčka, je vrstva HTTP zakázána u uzlů, které nejsou určeny k přímému obsluhování požadavků REST. (Automatic Translation)
index-name-prefix=Předpona názvu indexu (Automatic Translation)
index-name-prefix-help=Nastavte předponu pro název indexu hledání. Tato hodnota by se za běžných podmínek neměla měnit. Pokud tuto hodnotu změníte, musíte portál znovu indexovat a potom ručně odstranit starý index pomocí konzoly pro správu Elasticsearch. (Automatic Translation)
log-exceptions-only=Pouze výjimky protokolu (Automatic Translation)
