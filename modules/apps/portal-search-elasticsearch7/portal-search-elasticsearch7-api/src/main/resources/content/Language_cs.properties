network-bind-host=Hostitel síťové vazby (Automatic Translation)
network-bind-host-help=Zadejte síťová rozhraní, na která by se měl uzel vázat, aby bylo možné naslouchat příchozím požadavkům. (Automatic Translation)
network-host=Hostitel sítě (Automatic Translation)
network-host-help=Nastavte název hostitele nebo adresu IP vázané na uzel, který se používá k publikování (inzerování) hostitele do jiných uzlů v clusteru. Jedná se o zástupce, který současně nastaví hostitele vazby a hostitele publikování. (Automatic Translation)
network-publish-host=Hostitel publikování v síti (Automatic Translation)
network-publish-host-help=Nastavte jednotné rozhraní, které uzel inzeruje, na jiné uzly v clusteru, aby se k něj tyto uzly mohly připojit. (Automatic Translation)
number-of-index-replicas=Počet replik indexu (Automatic Translation)
number-of-index-replicas-help=Zadejte počet replik pro každý index Liferay. Pokud se odpojí, nejsou použity žádné repliky. Změny této hodnoty se projeví po úplném reindexu. (Automatic Translation)
number-of-index-shards=Počet horizontálních oddílů indexu (Automatic Translation)
number-of-index-shards-help=Nastavte počet horizontálních oddílů, které se mají použít při vytvoření indexu Liferay. Pokud se odpojí, bude použit jeden horizontálních oddílů. Změny této hodnoty se projeví po úplném reindexu. (Automatic Translation)
operation-mode=Provozní režim (Automatic Translation)
operation-mode-help=Režim vzdáleného ovládání se připojuje ke vzdálenému samostatnému clusteru Elasticsearch. Provozní režim EMBEDDED spustí portál s interní instancí Elasticsearch ve stejném JVM. Provozní režim EMBEDDED není podporován. (Automatic Translation)
override-type-mappings=Přepsat mapování typů (Automatic Translation)
override-type-mappings-help=Nastavte vlastní mapování tak, aby plně nahradila výchozí mapování pro LiferayDocumentType ve formátu JSON (Elasticsearch Put Mapping API). Pokud nastavíte tuto hodnotu, vytvoření indexu ignoruje výchozí definici mapování a všechny rozšiřující body, místo toho pomocí této alternativní definice mapování. Tuto možnost použijte, pokud potřebujete, aby byl liferaydocumentType vytvořen s nestandardními mapováními pro výchozí pole. Pokud potřebujete jen přidat nová vlastní mapování bez překrývání výchozích hodnot, použijte additionalTypeMappings. (Automatic Translation)
password-help=Pokud je povoleno ověření, je vyžadováno heslo. (Automatic Translation)
