additional-configurations=Πρόσθετες ρυθμίσεις παραμέτρων (Automatic Translation)
additional-configurations-help=Εισαγάγετε προσαρμοσμένες ρυθμίσεις για ενσωματωμένη elasticsearch, σε μορφή YML (elasticsearch.yml). (Automatic Translation)
additional-index-configurations=Πρόσθετες ρυθμίσεις παραμέτρων ευρετηρίου (Automatic Translation)
additional-index-configurations-help=Εισαγάγετε προσαρμοσμένες ρυθμίσεις για το ευρετήριο Liferay, σε μορφή JSON ή YML (Elasticsearch Δημιουργία ευρετηρίου API). (Automatic Translation)
additional-type-mappings=Πρόσθετες αντιστοιχίσεις τύπων (Automatic Translation)
additional-type-mappings-help=Ορισμός προσαρμοσμένων αντιστοιχίσεων για το LiferayDocumentType, σε μορφή JSON (Elasticsearch Τοποθέτηση αντιστοίχισης API). Αυτή η τιμή πρέπει να οριστεί μόνο με νέες αντιστοιχίσεις πεδίων. Εάν ορίσετε αυτήν την τιμή με τυχόν επικαλυπτόμενες αντιστοιχίσεις για προεπιλεγμένα πεδία, η δημιουργία ευρετηρίου αποτυγχάνει. Για να αντικαταστήσετε πλήρως τις προεπιλεγμένες αντιστοιχίσεις, χρησιμοποιήστε overrideTypeMappings. (Automatic Translation)
bootstrap-mlockall=Μπότες Mlockall (Automatic Translation)
bootstrap-mlockall-help=Εάν αυτό είναι επιλεγμένο, ο χώρος διευθύνσεων διεργασίας είναι κλειδωμένος στη μνήμη RAM, αποτρέποντας την αντάλλαξη μνήμης Elasticsearch. (Automatic Translation)
certificate-format=Μορφή πιστοποιητικού (Automatic Translation)
certificate-format-help=Καθορίστε τη μορφή πιστοποιητικού (PEM ή PKCS#12). (Automatic Translation)
client-transport-ignore-cluster-name=Η μεταφορά προγράμματος-πελάτη αγνοεί το όνομα συμπλέγματος (Automatic Translation)
client-transport-ignore-cluster-name-help=Εάν αυτό είναι επιλεγμένο, η επικύρωση ονόματος συμπλέγματος των συνδεδεμένων κόμβων παραβλέπεται. (Automatic Translation)
client-transport-nodes-sampler-interval=Διάστημα δειγματολήπτη κόμβων μεταφοράς προγράμματος-πελάτη (Automatic Translation)
client-transport-nodes-sampler-interval-help=Ορίστε το διάστημα (σε δευτερόλεπτα) στο οποίο τα δείγματα/ping του κόμβου-πελάτη συνδέουν κόμβους. Εάν δεν είναι δυνατή η ρύθμιση, χρησιμοποιείται η προεπιλεγμένη client.transport.nodes_sampler_interval Elasticsearch. (Automatic Translation)
client-transport-ping-timeout=Χρονικό διάστημα Ping μεταφοράς προγράμματος-πελάτη (Automatic Translation)
client-transport-ping-timeout-help=Εισαγάγετε την ώρα (σε δευτερόλεπτα) που ο κόμβος-πελάτης περιμένει για μια απόκριση ping από έναν κόμβο. Εάν δεν είναι δυνατή η ρύθμιση, χρησιμοποιείται η προεπιλεγμένη client.transport.ping_timeout Elasticsearch. (Automatic Translation)
client-transport-sniff=Μυρωδιά μεταφοράς πελατών (Automatic Translation)
client-transport-sniff-help=Εάν αυτό είναι επιλεγμένο, η ανίχνευση συμπλέγματος είναι ενεργοποιημένη για να ανακαλύψετε δυναμικά τους διαθέσιμους κόμβους στο σύμπλεγμα. (Automatic Translation)
cluster-name=Όνομα συμπλέγματος (Automatic Translation)
cluster-name-help=Εισαγάγετε το όνομα του συμπλέγματος στο οποίο θα συμμετάσχετε. Το όνομα θα πρέπει να ταιριάζει με το απομακρυσμένο σύμπλεγμα όταν η λειτουργία λειτουργίας έχει οριστεί σε απομακρυσμένη. (Automatic Translation)
discovery-zen-ping-unicast-hosts-port=Zen ανακάλυψη Unicast φιλοξενεί λιμάνι (Automatic Translation)
discovery-zen-ping-unicast-hosts-port-help=Παρέχετε μια σειρά θυρών που θα χρησιμοποιηθούν κατά τη δημιουργία της τιμής discovery.zen.ping.unicast.hosts. Πολλαπλοί κόμβοι Elasticsearch σε μια σειρά θυρών μπορούν να λειτουργήσουν ως δρομολογητές κουτσομπολιού στον ίδιο υπολογιστή. (Automatic Translation)
elasticsearch7-configuration-name=Ελαστική 7 (Automatic Translation)
http-cors-allow-origin=Το http CORS επιτρέπει την προέλευση (Automatic Translation)
http-cors-allow-origin-help=Εισαγάγετε την προέλευση που θα επιτρέπεται όταν είναι ενεργοποιημένη η HTTP CORS. (Automatic Translation)
http-cors-configurations=Ρυθμίσεις παραμέτρων HTTP CORS (Automatic Translation)
http-cors-configurations-help=Παρέχετε προσαρμοσμένες ρυθμίσεις για το HTTP CORS, σε μορφή YML (elasticsearch.yml). (Automatic Translation)
http-cors-enabled=Η διεύθυνση HTTP CORS είναι ενεργοποιημένη (Automatic Translation)
http-cors-enabled-help=Εάν αυτό είναι επιλεγμένο, είναι ενεργοποιημένη η κοινή χρήση πόρων μεταξύ προελεύσεων, η οποία καθορίζει εάν ένα πρόγραμμα περιήγησης σε άλλη προέλευση μπορεί να υποβάλει αιτήσεις στο Elasticsearch. Εάν είναι απενεργοποιημένα, τα εργαλεία προσκηνίων ιστού, όπως η ελαστική κεφαλήsearch, ενδέχεται να μην είναι δυνατό να συνδεθούν. (Automatic Translation)
http-enabled=Το http είναι ενεργοποιημένο (Automatic Translation)
http-enabled-help=Αυτή η ρύθμιση απορρίφθηκε και θα καταργηθεί σε μελλοντική έκδοση. Εάν αυτό είναι επιλεγμένο, είναι ενεργοποιημένο το επίπεδο HTTP. Εάν δεν είναι επιλεγμένο, το επίπεδο HTTP είναι απενεργοποιημένο σε κόμβους που δεν προορίζονται να εξυπηρετούν απευθείας αιτήσεις REST. (Automatic Translation)
index-name-prefix=Πρόθεμα ονόματος ευρετηρίου (Automatic Translation)
index-name-prefix-help=Ορίστε το πρόθεμα για το όνομα του ευρετηρίου αναζήτησης. Αυτή η τιμή δεν πρέπει να αλλάξει υπό κανονικές συνθήκες. Εάν αλλάξετε αυτήν την τιμή, πρέπει επίσης να επανεγκατασταίνετε την πύλη και, στη συνέχεια, να διαγράψετε με μη αυτόματο τρόπο το παλιό ευρετήριο χρησιμοποιώντας την κονσόλα διαχείρισης Elasticsearch. (Automatic Translation)
log-exceptions-only=Εξαιρέσεις καταγραφής μόνο (Automatic Translation)
log-exceptions-only-help=Εάν αυτό είναι επιλεγμένο, καταγράφει εξαιρέσεις μόνο από το Elasticsearch και δεν τις ρίχνει ξανά. (Automatic Translation)
network-bind-host=Κεντρικός υπολογιστής σύνδεσης δικτύου (Automatic Translation)
network-bind-host-help=Καθορίστε τη διασύνδεση δικτύου στην οποία θα πρέπει να συνδεθεί ένας κόμβος για να ακούει για εισερχόμενες αιτήσεις. (Automatic Translation)
network-host=Κεντρικός υπολογιστής δικτύου (Automatic Translation)
network-host-help=Ορίστε το όνομα κεντρικού υπολογιστή ή τη διεύθυνση IP συνδεδεμένη με τον κόμβο, ο οποίος χρησιμοποιείται για τη δημοσίευση (διαφήμιση) του κεντρικού υπολογιστή σε άλλους κόμβους του συμπλέγματος. Αυτή είναι μια συντόμευση που ορίζει ταυτόχρονα τον κεντρικό υπολογιστή σύνδεσης και τον κεντρικό υπολογιστή δημοσίευσης. (Automatic Translation)
network-publish-host=Κεντρικός υπολογιστής δημοσίευσης δικτύου (Automatic Translation)
network-publish-host-help=Ορίστε το μοναδικό περιβάλλον εργασίας που διαφημίζει ο κόμβος σε άλλους κόμβους του συμπλέγματος, έτσι ώστε αυτοί οι κόμβοι να μπορούν να συνδεθούν σε αυτό. (Automatic Translation)
number-of-index-replicas=Αριθμός ρεπλικών ευρετηρίου (Automatic Translation)
number-of-index-replicas-help=Εισαγάγετε τον αριθμό των ρεπλίκων για κάθε ευρετήριο Liferay. Εάν δεν είναι ένθετες, δεν χρησιμοποιούνται ρεπλίκες. Οι αλλαγές σε αυτήν την τιμή τίθενται σε ισχύ μετά από πλήρη reindex. (Automatic Translation)
number-of-index-shards=Αριθμός θραυσμάτων ευρετηρίου (Automatic Translation)
number-of-index-shards-help=Ορίστε τον αριθμό των θραυσμάτων που θα χρησιμοποιηθούν κατά τη δημιουργία ενός ευρετηρίου Liferay. Εάν δεν είναι θραύσματα, θα χρησιμοποιηθεί ένα μόνο θραύσμα. Οι αλλαγές σε αυτήν την τιμή τίθενται σε ισχύ μετά από πλήρη reindex. (Automatic Translation)
operation-mode=Λειτουργία λειτουργίας (Automatic Translation)
operation-mode-help=Η λειτουργία REMOTE συνδέεται σε ένα απομακρυσμένο αυτόνομο σύμπλεγμα Elasticsearch. Η λειτουργία ΕΝΣΩΜΑΤΩΜΈΝΗς λειτουργίας ξεκινά την Πύλη με μια εσωτερική παρουσία Elasticsearch στην ίδια JVM. Η λειτουργία ενσωματωμένης λειτουργίας δεν υποστηρίζεται. (Automatic Translation)
override-type-mappings=Παράκαμψη αντιστοιχίσεων τύπων (Automatic Translation)
override-type-mappings-help=Ορίστε προσαρμοσμένες αντιστοιχίσεις για να αντικαταστήσετε πλήρως τις προεπιλεγμένες αντιστοιχίσεις για το LiferayDocumentType, σε μορφή JSON (Elasticsearch Put Αντιστοίχιση API). Εάν ορίσετε αυτήν την τιμή, η δημιουργία ευρετηρίου αγνοεί τον προεπιλεγμένο ορισμό αντιστοιχίσεων και τυχόν σημεία επέκτασης, χρησιμοποιώντας αυτόν τον εναλλακτικό ορισμό αντιστοιχίσεων. Χρησιμοποιήστε αυτό εάν χρειάζεστε liferayDocumentType για να δημιουργηθεί με μη τυπικές αντιστοιχίσεις για προεπιλεγμένα πεδία. Εάν απλά πρέπει να προσθέσετε νέες προσαρμοσμένες αντιστοιχίσεις χωρίς να επικαλύψετε προεπιλογές, χρησιμοποιήστε πρόσθετεςTypeMappings. (Automatic Translation)
password-help=Εάν είναι ενεργοποιημένος ο έλεγχος ταυτότητας, απαιτείται κωδικός πρόσβασης. (Automatic Translation)
requires-authentication=Απαιτεί έλεγχο ταυτότητας (Automatic Translation)
requires-authentication-help=Εάν ενεργοποιηθεί, οι συνδέσεις με το Elasticsearch/X-Pack πιστώνονται με το ρυθμισμένο όνομα χρήστη και τον κωδικό πρόσβασης. (Automatic Translation)
rest-client-logger-level=Επίπεδο καταγραφής προγράμματος-πελάτη REST (Automatic Translation)
rest-client-logger-level-help=Ορίστε το επίπεδο καταγραφής για το πρόγραμμα-πελάτη Elasticsearch REST. (Automatic Translation)
retry-on-conflict=Επανάληψη της διένεξης (Automatic Translation)
retry-on-conflict-help=Ορίστε τον αριθμό των επαναδικαίων σε προσπάθεια, εάν παρουσιαστεί διένεξη έκδοσης, επειδή το έγγραφο ενημερώθηκε μεταξύ της ανάκτησής του και της ενημέρωσής του. (Automatic Translation)
ssl-certificate-authorities-paths=Αρχές πιστοποιητικών SSL (Automatic Translation)
ssl-certificate-authorities-paths-help=Δώστε μια λίστα με διαδρομές σε αξιόπιστα αρχεία πιστοποιητικών κωδικοποιημένα με PEM. (Automatic Translation)
ssl-certificate-path=Πιστοποιητικό SSL (Automatic Translation)
ssl-certificate-path-help=Εισαγάγετε τη διαδρομή προς ένα κωδικοποιημένο αρχείο PEM που περιέχει το πιστοποιητικό (ή την αλυσίδα πιστοποιητικών) που θα παρουσιαστεί στους υπολογιστές-πελάτες όταν συνδεθούν. (Automatic Translation)
ssl-key-path=Κλειδί SSL (Automatic Translation)
ssl-key-path-help=Εισαγάγετε τη διαδρομή προς το κωδικοποιημένο αρχείο PEM που περιέχει το ιδιωτικό κλειδί. (Automatic Translation)
ssl-keystore-password=Κωδικός πρόσβασης κλειδιού SSL (Automatic Translation)
ssl-keystore-password-help=Εισαγάγετε τον κωδικό πρόσβασης στο αρχείο PKCS#12. (Automatic Translation)
ssl-keystore-path=Διαδρομή κλειδιού SSL (Automatic Translation)
ssl-keystore-path-help=Εισαγάγετε τη διαδρομή προς το βιβλιοπωλείο που κατέχει το ιδιωτικό κλειδί και το πιστοποιητικό. (Automatic Translation)
ssl-truststore-password=Κωδικός πρόσβασης διαχειριστή SSL (Automatic Translation)
ssl-truststore-password-help=Εισαγάγετε τον κωδικό πρόσβασης στο κέντρο αξιοπιστίας. (Automatic Translation)
ssl-truststore-path=Διαδρομή καταπιστευματικού οδού SSL (Automatic Translation)
ssl-truststore-path-help=Εισαγάγετε τη διαδρομή προς το αρχείο truststore. (Automatic Translation)
track-total-hits=Παρακολούθηση συνολικών επιτυχιών (Automatic Translation)
track-total-hits-help=Ορίστε αυτό ως αληθές για να μετρήσετε με ακρίβεια τον συνολικό αριθμό των προσβολών όταν υπάρχουν περισσότερα από 10.000 αποτελέσματα για μια αναζήτηση. Ο ορισμός αυτού του νήματος σε true μπορεί να έχει αντίκτυπο στην απόδοση όταν υπάρχει μεγάλος αριθμός επιτυχιών για μια αναζήτηση. (Automatic Translation)
transport-addresses=Διευθύνσεις Μεταφορών (Automatic Translation)
transport-addresses-help=Ορίστε τις απομακρυσμένες διευθύνσεις κόμβων με τις οποίοι. Αυτή η τιμή απαιτείται όταν η λειτουργία λειτουργίας έχει οριστεί σε REMOTE. (Automatic Translation)
transport-ssl-enabled=Η μεταφορά SSL είναι ενεργοποιημένη (Automatic Translation)
transport-ssl-enabled-help=Ενεργοποίηση ή απενεργοποίηση TLS/SSL. (Automatic Translation)
transport-ssl-verification-mode=Λειτουργία επαλήθευσης SSL μεταφοράς (Automatic Translation)
transport-ssl-verification-mode-help=Καθορίστε τον τύπο επαλήθευσης (κανένα, πιστοποιητικό ή πλήρες) όταν χρησιμοποιείτε το LDAP για προστασία από τον άνθρωπο στις μεσαίες επιθέσεις και την πλαστογραφία πιστοποιητικών. (Automatic Translation)
transport-tcp-port=Μεταφορά θύρας TCP (Automatic Translation)
transport-tcp-port-help=Καθορίστε τη θύρα που θα συνδέεται για επικοινωνία μεταξύ κόμβων. Δέχεται μία τιμή ή μια περιοχή (π.χ. 9300-9400). (Automatic Translation)
username=Όνομα χρήστη (Automatic Translation)
username-help=Εάν είναι ενεργοποιημένος ο έλεγχος ταυτότητας απαιτείται, ορίστε το όνομα χρήστη για έλεγχο ταυτότητας σε Elasticsearch. (Automatic Translation)
xpack-security-configuration-name=Ασφάλεια X-Pack (Automatic Translation)