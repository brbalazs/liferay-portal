track-total-hits=آهنگ تعداد بازدید ها (Automatic Translation)
track-total-hits-help=تنظیم این درست به دقت شمارش تعداد کل بازدید زمانی که بیش از 10،000 نتایج برای جستجو وجود دارد. تنظیم این درست ممکن است زمانی بر عملکرد تأثیر داشته باشد که تعداد زیادی بازدید برای یک جستجو وجود داشته باشد. (Automatic Translation)
