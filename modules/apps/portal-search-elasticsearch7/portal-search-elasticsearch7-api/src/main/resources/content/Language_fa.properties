log-exceptions-only=تنها استثنائات را ثبت کنید
log-exceptions-only-help=اگر این بررسی شود، سیاهههای مربوط تنها از Elasticsearch استثنا می شود و آنها را دوباره پرتاب نمی کند. (Automatic Translation)
network-bind-host=میزبان اتصال شبکه
network-bind-host-help=مشخص کردن رابط شبکه (ها) گره باید به اتصال به منظور گوش دادن برای درخواست های دریافتی. (Automatic Translation)
network-host=میزبان شبکه
network-host-help=تنظیم نام میزبان یا آدرس IP محدود به گره، که برای انتشار (تبلیغ) میزبان به گره های دیگر در خوشه استفاده می شود. این یک میانبر است که میزبان متصل و میزبان انتشار را در همان زمان تنظیم می کند. (Automatic Translation)
network-publish-host=میزبان انتشار شبکه (Automatic Translation)
network-publish-host-help=رابط واحدی را که گره به گره های دیگر در خوشه تبلیغ می کند تنظیم کنید، به طوری که آن گره ها می توانند به آن متصل شوند. (Automatic Translation)
number-of-index-replicas=تعداد المثنی های شاخص (Automatic Translation)
