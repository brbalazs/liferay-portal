client-transport-nodes-sampler-interval-help=تعیین فاصله (در ثانیه) که در آن گره مشتری نمونه / pings گره های متصل. اگر تنظیم نشده باشد، از جستجوی client.transport.nodes_sampler_interval استفاده می شود. (Automatic Translation)
client-transport-ping-timeout=مشتری حمل و نقل پینگ Timeout (Automatic Translation)
