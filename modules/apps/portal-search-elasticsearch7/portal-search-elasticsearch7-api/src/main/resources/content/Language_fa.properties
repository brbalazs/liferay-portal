number-of-index-shards=تعداد چاردهای شاخص (Automatic Translation)
number-of-index-shards-help=تنظیم تعداد تکه ها به استفاده از زمانی که یک شاخص Liferay ایجاد شده است. اگر ناآشنا باشد، از یک تکه تکه استفاده خواهد شد. تغییرات در این مقدار پس از یک راس مجدد کامل اثر می کند. (Automatic Translation)
operation-mode=حالت کاربری
operation-mode-help=حالت عملیات REMOTE به یک خوشه Elasticsearch مستقل از راه دور متصل می شود. حالت عملیات EMBEDDED پورتال را با یک مثال Elasticsearch داخلی در همان JVM شروع می کند. حالت عملیات EMBEDDED بدون حمایت است. (Automatic Translation)
override-type-mappings=نقشه برداری نوع ابطال (Automatic Translation)
override-type-mappings-help=تنظیم نقشه های سفارشی به طور کامل جایگزین نقشه برداری های پیش فرض برای LiferayDocumentType، در فرمت ابد (Elasticsearch قرار دادن API نقشه برداری). اگر این مقدار را تنظیم کنید، ایجاد شاخص تعریف نقشه برداری های پیش فرض و هر نقطه پسوند را نادیده می گیرد، با استفاده از این تعریف نقشه برداری های جایگزین به جای آن. استفاده از این اگر شما نیاز به LiferayDocumentType با نقشه برداری های غیر استاندارد برای زمینه های پیش فرض ایجاد می شود. اگر شما فقط نیاز به اضافه کردن نقشه های سفارشی جدید بدون همپوشانی هر گونه پیش فرض, استفاده از additionalTypeMappings. (Automatic Translation)
password-help=اگر نیاز به احراز هویت فعال باشد، یک رمز عبور لازم است. (Automatic Translation)
requires-authentication=نیاز به احراز هویت (Automatic Translation)
requires-authentication-help=در صورت فعال شدن، اتصالات با Elasticsearch/X-Pack با نام کاربری پیکربندی شده و رمز عبور تصدیق می شوند. (Automatic Translation)
rest-client-logger-level=REST مشتری سطح چوب (Automatic Translation)
rest-client-logger-level-help=تنظیم سطح ورود به سیستم برای مشتری Elasticsearch REST. (Automatic Translation)
retry-on-conflict=در صورت مغایرت مجددا تلاش کنید
retry-on-conflict-help=تنظیم تعداد retries به تلاش اگر یک درگیری نسخه رخ می دهد چرا که سند بین بازیابی آن و به روز رسانی آن به روز شده است. (Automatic Translation)
