additional-type-mappings=Pemetaan Tipe Tambahan (Automatic Translation)
additional-type-mappings-help=Atur pemetaan kustom untuk LiferayDocumentType, dalam format JSON (Elasticsearch Put Mapping API). Nilai ini harus ditetapkan dengan pemetaan bidang baru saja. Jika Anda menetapkan nilai ini dengan pemetaan yang tumpang tindih untuk bidang default, pembuatan indeks gagal. Untuk mengganti pemetaan default sepenuhnya, gunakan overrideTypeMappings. (Automatic Translation)
bootstrap-mlockall=Bootstrap Mlockall (Automatic Translation)
bootstrap-mlockall-help=Jika ini diperiksa, ruang alamat proses dikunci ke dalam RAM, mencegah memori Elasticsearch ditukar. (Automatic Translation)
certificate-format=Format Sertifikat (Automatic Translation)
certificate-format-help=Tentukan format sertifikat (PEM atau PKCS#12). (Automatic Translation)
client-transport-ignore-cluster-name=Klien Abaikan Nama Kluster (Automatic Translation)
client-transport-ignore-cluster-name-help=Jika ini diperiksa, validasi nama kluster dari node yang terhubung diabaikan. (Automatic Translation)
client-transport-nodes-sampler-interval=Interval Sampler Node Transang Klien (Automatic Translation)
client-transport-nodes-sampler-interval-help=Atur interval (dalam detik) di mana sampel node klien/pings node terhubung. Jika tidak diset, default Elasticsearch client.transport.nodes_sampler_interval digunakan. (Automatic Translation)
client-transport-ping-timeout=Batas Waktu Ping Transportasi Klien (Automatic Translation)
client-transport-ping-timeout-help=Masukkan waktu (dalam detik) node klien menunggu respons ping dari node. Jika tidak diset, default Elasticsearch client.transport.ping_timeout digunakan. (Automatic Translation)
client-transport-sniff=Klien Transportasi Mengendus (Automatic Translation)
client-transport-sniff-help=Jika ini diperiksa, sniffing kluster diaktifkan untuk secara dinamis menemukan node yang tersedia di klaster. (Automatic Translation)
cluster-name=Nama Kluster (Automatic Translation)
cluster-name-help=Masukkan nama kluster untuk bergabung. Nama harus cocok dengan klaster jarak jauh ketika Mode Operasi disetel ke jarak jauh. (Automatic Translation)
discovery-zen-ping-unicast-hosts-port=Zen Discovery Unicast Host Port (Automatic Translation)
discovery-zen-ping-unicast-hosts-port-help=Menyediakan berbagai porta untuk digunakan saat membangun nilai discovery.zen.ping.unicast.hosts. Beberapa node Elasticsearch pada berbagai port dapat bertindak sebagai router gosip di komputer yang sama. (Automatic Translation)
elasticsearch7-configuration-name=Elasticsearch 7 (Automatic Translation)
http-cors-allow-origin=Http CORS Izinkan Asal (Automatic Translation)
http-cors-allow-origin-help=Masukkan asal untuk memungkinkan kapan HTTP CORS diaktifkan. (Automatic Translation)
http-cors-configurations=Konfigurasi HTTP CORS (Automatic Translation)
http-cors-configurations-help=Menyediakan pengaturan kustom untuk HTTP CORS, dalam format YML (elasticsearch.yml). (Automatic Translation)
http-cors-enabled=Http CORS Diaktifkan (Automatic Translation)
http-cors-enabled-help=Jika ini diperiksa, berbagi sumber daya lintas asal diaktifkan, yang menentukan apakah browser di asal lain dapat membuat permintaan ke Elasticsearch. Jika dinonaktifkan, alat front-end web seperti elasticsearch-head mungkin tidak dapat terhubung. (Automatic Translation)
http-enabled=Http Difungsikan (Automatic Translation)
http-enabled-help=Setelan ini telah ditolak dan akan dihapus dalam rilis mendatang. Jika ini diperiksa, lapisan HTTP diaktifkan. Jika tidak dicentang, lapisan HTTP dinonaktifkan pada node yang tidak dimaksudkan untuk melayani permintaan REST secara langsung. (Automatic Translation)
index-name-prefix=Awalan Nama Indeks (Automatic Translation)
index-name-prefix-help=Atur awalan untuk nama indeks pencarian. Nilai ini tidak boleh diubah dalam kondisi normal. Jika Anda mengubah nilai ini, Anda juga harus mengaktifkan kembali portal lalu menghapus indeks lama secara manual menggunakan konsol administrasi Elasticsearch. (Automatic Translation)
log-exceptions-only=Hanya Perepsian Log (Automatic Translation)
log-exceptions-only-help=Jika ini diperiksa, perjekalian log hanya dari Elasticsearch dan tidak membuangnya kembali. (Automatic Translation)
network-bind-host=Host Ikatan Jaringan (Automatic Translation)
network-bind-host-help=Tentukan antarmuka jaringan yang harus mengikat node untuk mendengarkan permintaan masuk. (Automatic Translation)
network-host=Host Jaringan (Automatic Translation)
network-host-help=Atur nama host atau alamat IP yang terikat ke node, yang digunakan untuk mempublikasikan (mengiklankan) host ke node lain di klaster. Ini adalah pintasan yang mengatur host bind dan host publikasi pada saat yang sama. (Automatic Translation)
network-publish-host=Host Publikasi Jaringan (Automatic Translation)
network-publish-host-help=Atur antarmuka tunggal yang diiklankan node ke node lain di klaster, sehingga node tersebut dapat terhubung ke node tersebut. (Automatic Translation)
number-of-index-replicas=Jumlah Replika Indeks (Automatic Translation)
number-of-index-replicas-help=Masukkan jumlah replika untuk setiap indeks Liferay. Jika tidak diset, tidak ada replika yang digunakan. Perubahan pada nilai ini berlaku setelah reindex penuh. (Automatic Translation)
number-of-index-shards=Jumlah Pecahan Indeks (Automatic Translation)
number-of-index-shards-help=Atur jumlah pecahan yang akan digunakan saat indeks Liferay dibuat. Jika tidak diset, satu shard akan digunakan. Perubahan pada nilai ini berlaku setelah reindex penuh. (Automatic Translation)
operation-mode=Mode Operasi (Automatic Translation)
operation-mode-help=Mode operasi REMOTE tersambung ke kluster Elasticsearch mandiri jarak jauh. Mode operasi EMBEDDED memulai Portal dengan instance Elasticsearch internal di JVM yang sama. Mode operasi EMBEDDED tidak didukung. (Automatic Translation)
override-type-mappings=Mengesampingkan Pemetaan Tipe (Automatic Translation)
override-type-mappings-help=Atur pemetaan kustom untuk sepenuhnya menggantikan pemetaan default untuk LiferayDocumentType, dalam format JSON (Elasticsearch Put Mapping API). Jika Anda menetapkan nilai ini, pembuatan indeks mengabaikan definisi pemetaan default dan titik ekstensi apa pun, menggunakan definisi pemetaan alternatif ini sebagai gantinya. Gunakan ini jika Anda memerlukan LiferayDocumentType untuk dibuat dengan pemetaan nonstandar untuk bidang default. Jika Anda hanya perlu menambahkan pemetaan kustom baru tanpa tumpang tindih default apa pun, gunakan AdditionalTypeMappings. (Automatic Translation)
password-help=Jika Memerlukan Otentikasi diaktifkan, kata sandi diperlukan. (Automatic Translation)
requires-authentication=Membutuhkan Otentikasi (Automatic Translation)
requires-authentication-help=Jika diaktifkan, koneksi dengan Elasticsearch/X-Pack diautentikasi dengan nama pengguna dan kata sandi yang dikonfigurasi. (Automatic Translation)
rest-client-logger-level=Tingkat Logger Klien REST (Automatic Translation)
rest-client-logger-level-help=Atur tingkat pembuatan log untuk klien Elasticsearch REST. (Automatic Translation)
retry-on-conflict=Coba lagi tentang Konflik (Automatic Translation)
retry-on-conflict-help=Atur jumlah upaya untuk mencoba jika terjadi konflik versi karena dokumen diperbarui antara mengambilnya dan memperbaruinya. (Automatic Translation)
ssl-certificate-authorities-paths=Otoritas Sertifikat SSL (Automatic Translation)
ssl-certificate-authorities-paths-help=Menyediakan daftar jalur ke berkas sertifikat bersandi PEM tepercaya. (Automatic Translation)
ssl-certificate-path=Sertifikat SSL (Automatic Translation)
ssl-certificate-path-help=Masukkan jalur ke file bersandi PEM yang berisi sertifikat (atau rantai sertifikat) yang akan disajikan kepada klien saat mereka terhubung. (Automatic Translation)
ssl-key-path=Kunci SSL (Automatic Translation)
ssl-key-path-help=Masukkan jalur ke berkas bersandi PEM yang berisi kunci privat. (Automatic Translation)
ssl-keystore-password=Kata Sandi Keystore SSL (Automatic Translation)
