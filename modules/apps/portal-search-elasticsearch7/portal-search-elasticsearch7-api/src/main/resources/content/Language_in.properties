ssl-keystore-path=Jalur Keystore SSL (Automatic Translation)
ssl-keystore-path-help=Masukkan jalur ke keystore yang memegang kunci dan sertifikat pribadi. (Automatic Translation)
ssl-truststore-password=Kata Sandi SSL Truststore (Automatic Translation)
