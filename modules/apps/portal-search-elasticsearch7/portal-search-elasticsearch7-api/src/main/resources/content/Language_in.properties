ssl-truststore-path=Jalur SSL Truststore (Automatic Translation)
ssl-truststore-path-help=Masukkan jalur ke file truststore. (Automatic Translation)
track-total-hits=Lacak Total Hits (Automatic Translation)
track-total-hits-help=Atur ini ke true untuk menghitung jumlah total hits secara akurat ketika ada lebih dari 10.000 hasil untuk pencarian. Mengatur ini ke true mungkin berdampak pada kinerja ketika ada sejumlah besar hit untuk pencarian. (Automatic Translation)
transport-addresses=Alamat Transportasi (Automatic Translation)
transport-addresses-help=Atur alamat node jarak jauh yang akan disambungkan. Nilai ini diperlukan ketika Mode Operasi diatur ke REMOTE. (Automatic Translation)
transport-ssl-enabled=SSL Transang Diaktifkan (Automatic Translation)
transport-ssl-enabled-help=Mengaktifkan atau menonaktifkan TLS/SSL. (Automatic Translation)
transport-ssl-verification-mode=Mode Verifikasi SSL Transport (Automatic Translation)
transport-ssl-verification-mode-help=Tentukan jenis verifikasi (tidak ada, sertifikat, atau penuh) saat menggunakan LDAP untuk melindungi terhadap manusia di serangan tengah dan pemalsuan sertifikat. (Automatic Translation)
transport-tcp-port=Port TCP Transang (Automatic Translation)
transport-tcp-port-help=Tentukan porta yang akan mengikat untuk komunikasi antar node. Menerima nilai tunggal atau rentang (misalnya, 9300-9400). (Automatic Translation)
username=Nama pengguna (Automatic Translation)
username-help=Jika Memerlukan Otentikasi diaktifkan, atur nama pengguna untuk mengautentikasi ke Elasticsearch diperlukan. (Automatic Translation)
