additional-configurations=Configurazioni aggiuntive
additional-configurations-help=Immettere le impostazioni personalizzate per Elasticsearch incorporato, in formato YML (elasticsearch.yml). (Automatic Translation)
additional-index-configurations=Configurazioni di indice aggiuntive (Automatic Translation)
