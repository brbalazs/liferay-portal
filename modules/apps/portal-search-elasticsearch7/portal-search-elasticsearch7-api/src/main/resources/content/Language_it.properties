ssl-certificate-path=Certificato SSL (Automatic Translation)
ssl-certificate-path-help=Immettere il percorso di un file codificato PEM contenente il certificato (o la catena di certificati) che verrà presentato ai client quando si connettono. (Automatic Translation)
ssl-key-path=Chiave SSL (Automatic Translation)
