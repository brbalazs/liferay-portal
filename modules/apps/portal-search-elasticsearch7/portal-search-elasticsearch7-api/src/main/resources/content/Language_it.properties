track-total-hits=Traccia i successi totali (Automatic Translation)
track-total-hits-help=Impostare questa valore su true per contare con precisione il numero totale di hit quando sono disponibili più di 10.000 risultati per una ricerca. L'impostazione di questo valore su true può avere un impatto sulle prestazioni quando è presente un numero elevato di riscontri per una ricerca. (Automatic Translation)
transport-addresses=Indirizzi di trasporto (Automatic Translation)
transport-addresses-help=Impostare gli indirizzi dei nodi remoti a cui connettersi. Questo valore è obbligatorio quando la modalità operativa è impostata su REMOTE. (Automatic Translation)
transport-ssl-enabled=SSL di trasporto abilitato (Automatic Translation)
transport-ssl-enabled-help=Abilita o disabilita TLS/SSL.
transport-ssl-verification-mode=Modalità di verifica SSL di trasporto (Automatic Translation)
transport-ssl-verification-mode-help=Specificare il tipo di verifica (nessuno, certificato o completo) quando si utilizza LDAP per proteggersi dagli attacchi man in the middle e dalla falsificazione dei certificati. (Automatic Translation)
transport-tcp-port=Porta TCP
transport-tcp-port-help=Specificare la porta da associare per la comunicazione tra nodi. Accetta un singolo valore o un intervallo (ad esempio, 9300-9400). (Automatic Translation)
username=nome utente (Automatic Translation)
username-help=Se richiede l'autenticazione abilitata, impostare il nome utente per l'autenticazione su Elasticsearch. (Automatic Translation)
