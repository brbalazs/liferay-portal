client-transport-nodes-sampler-interval=Kliento transportavimo mazgų mėginių ėmimo intervalas (Automatic Translation)
client-transport-nodes-sampler-interval-help=Nustatykite intervalą (sekundėmis), kuriuo kliento mazgo pavyzdžiai / ping prijungti mazgai. Jei išjungta, naudojama numatytoji elasticsearch client.transport.nodes_sampler_interval. (Automatic Translation)
client-transport-ping-timeout=Kliento transportavimo ping skirtasis laikas (Automatic Translation)
