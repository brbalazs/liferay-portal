cluster-name=Sankaupos pavadinimas (Automatic Translation)
cluster-name-help=Įveskite klasterio, prie kurios norite prisijungti, pavadinimą. Pavadinimas turi atitikti nuotolinį klasterį, kai veikimo režimas nustatytas kaip nuotolinis. (Automatic Translation)
discovery-zen-ping-unicast-hosts-port=Zen Discovery Unicast pagrindinio kompiuterio prievadas (Automatic Translation)
discovery-zen-ping-unicast-hosts-port-help=Pateikite prievadų diapazoną, kuris bus naudojamas kuriant discovery.zen.ping.unicast.hosts reikšmę. Keli "Elasticsearch" mazgai įvairiuose prievaduose gali veikti kaip paskalų maršrutizatoriai tame pačiame kompiuteryje. (Automatic Translation)
elasticsearch7-configuration-name=Elasticsearch 7 (Automatic Translation)
http-cors-allow-origin=http CORS leisti kilmę (Automatic Translation)
