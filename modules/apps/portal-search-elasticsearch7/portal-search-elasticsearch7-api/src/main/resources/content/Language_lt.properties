ssl-certificate-path=SSL sertifikatas (Automatic Translation)
ssl-certificate-path-help=Įveskite kelią į PEM užkoduotą failą, kuriame yra sertifikatas (arba sertifikatų grandinė), kuris bus pateiktas klientams, kai jie prisijungs. (Automatic Translation)
