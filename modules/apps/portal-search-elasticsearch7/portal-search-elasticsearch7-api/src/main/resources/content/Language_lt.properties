network-bind-host=Tinklo susiejimo pagrindinis kompiuteris (Automatic Translation)
network-bind-host-help=Nurodykite tinklo sąsają (-as), su kuria (-iomis) mazgas turėtų būti susietas, kad būtų galima klausytis gaunamų užklausų. (Automatic Translation)
network-host=Tinklo pagrindinis kompiuteris (Automatic Translation)
network-host-help=Nustatykite pagrindinio kompiuterio vardą arba IP adresą, susietą su mazgu, kuris naudojamas publikuoti (reklamuoti) pagrindinį kompiuterį kituose sankaupos mazguose. Tai nuoroda, kuri nustato susieti pagrindinio kompiuterio ir publikuoti pagrindinio kompiuterio tuo pačiu metu. (Automatic Translation)
network-publish-host=Tinklo publikavimo pagrindinis kompiuteris (Automatic Translation)
network-publish-host-help=Nustatykite vieną sąsają, kurią mazgas reklamuoja į kitus sankaupos mazgus, kad tie mazgai galėtų prie jos prisijungti. (Automatic Translation)
number-of-index-replicas=Rodyklės replikų skaičius (Automatic Translation)
number-of-index-replicas-help=Įveskite kiekvieno "Liferay" indekso replikų skaičių. Jei išjungta, replikų nenaudojama. Šios reikšmės pakeitimai įsigalioja po visiško reindekso. (Automatic Translation)
number-of-index-shards=Indekso Shards skaičius (Automatic Translation)
number-of-index-shards-help=Nustatykite skiautelių skaičių, kuris bus naudojamas sukūrus "Liferay" indeksą. Jei išjungta, bus naudojamas vienas skiautė. Šios reikšmės pakeitimai įsigalioja po visiško reindekso. (Automatic Translation)
operation-mode=Veikimo režimas (Automatic Translation)
operation-mode-help=NUOTOLINIO valdymo režimas prisijungia prie nuotolinio atskiro elasticsearch klasterio. EMBEDDED veikimo režimas paleidžia portalą su vidiniu elasticsearch egzemplioriumi tame pačiame JVM. EMBEDDED veikimo režimas nepalaikomas. (Automatic Translation)
override-type-mappings=Nepaisyti tipo susiejimų (Automatic Translation)
override-type-mappings-help=Nustatykite pasirinktinius susiejimus, kad visiškai pakeistumėte numatytuosius LiferayDocumentType susiejimus JSON formatu (Elasticsearch Put Mapping API). Jei nustatysite šią reikšmę, rodyklės kūrimas nepaisys numatytojo susiejimų apibrėžimo ir bet kokių plėtinių taškų, vietoj to naudodamas šį alternatyvų susiejimų apibrėžimą. Naudokite tai, jei jums reikia sukurti LiferayDocumentType su nestandartiniais numatytųjų laukų susiejimais. Jei jums tereikia pridėti naujų pasirinktinių susiejimų nepersidengiant su numatytosiomis reikšmėmis, naudokite papildomus "TypeMappings". (Automatic Translation)
password-help=Jei įgalintas autentifikavimas, reikalingas slaptažodis. (Automatic Translation)
requires-authentication=Reikia autentifikavimo (Automatic Translation)
