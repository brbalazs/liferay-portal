http-cors-configurations=Http CORS konfigūracijos (Automatic Translation)
http-cors-configurations-help=Pateikite pasirinktinius HTTP CORS parametrus YML formatu (elasticsearch.yml). (Automatic Translation)
http-cors-enabled=Http CORS įgalinta (Automatic Translation)
http-cors-enabled-help=Jei tai pažymėta, įgalinamas kryžminės kilmės išteklių bendrinimas, kuris nustato, ar kitos kilmės naršyklė gali pateikti užklausas "Elasticsearch". Jei išjungta, žiniatinklio išoriniai įrankiai, pvz., elastinga galvos, gali nepavykti prisijungti. (Automatic Translation)
http-enabled=Http įgalinta (Automatic Translation)
http-enabled-help=Šis parametras nebenaudojamas ir bus pašalintas būsimame leidime. Jei tai pažymėta, HTTP sluoksnis įgalintas. Jei nepažymėta, HTTP sluoksnis išjungiamas mazguose, kurie nėra skirti tiesiogiai teikti REST užklausas. (Automatic Translation)
index-name-prefix=Rodyklės pavadinimo prefiksas (Automatic Translation)
index-name-prefix-help=Nustatykite ieškos indekso pavadinimo priešdėlį. Ši vertė neturėtų būti keičiama įprastomis sąlygomis. Jei pakeisite šią reikšmę, taip pat turite iš naujo įsisakinti portalą ir neautomatiniu būdu panaikinti seną indeksą naudodami elastingų tyrimų administravimo konsolę. (Automatic Translation)
log-exceptions-only=Tik žurnalo išimtys (Automatic Translation)
