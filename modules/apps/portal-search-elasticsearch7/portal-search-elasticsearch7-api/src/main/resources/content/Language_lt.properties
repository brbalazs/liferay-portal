transport-ssl-verification-mode-help=Nurodykite tikrinimo tipą (nėra, sertifikato ar visą), kai naudojate LDAP, kad apsaugotumėte nuo žmogaus per vidurines atakas ir sertifikato klastojimą. (Automatic Translation)
