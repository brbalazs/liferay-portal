track-total-hits-help=Nustatykite, kad tai teisinga, kad tiksliai suskaičiuotumėte bendrą įvykių skaičių, kai yra daugiau nei 10 000 paieškos rezultatų. Tai gali turėti įtakos našumui, kai yra daug ieškos įvykių. (Automatic Translation)
transport-addresses=Transportavimo adresai (Automatic Translation)
transport-addresses-help=Nustatykite nuotolinio mazgo adresus, prie kurių norite prisijungti. Ši reikšmė būtina, kai veikimo režimas nustatytas kaip REMOTE. (Automatic Translation)
