rest-client-logger-level=REST kliento logger lygis (Automatic Translation)
rest-client-logger-level-help=Nustatykite kliento Elasticsearch REST registravimo lygį. (Automatic Translation)
retry-on-conflict=Kartoti konfliktą (Automatic Translation)
