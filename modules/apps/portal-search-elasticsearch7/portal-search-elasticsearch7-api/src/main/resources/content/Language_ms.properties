ssl-certificate-path=Sijil SSL (Automatic Translation)
ssl-certificate-path-help=Masukkan laluan ke fail yang dikodkan PEM yang mengandungi sijil (atau rantai sijil) yang akan dibentangkan kepada pelanggan apabila mereka bersambung. (Automatic Translation)
ssl-key-path=Kekunci SSL (Automatic Translation)
