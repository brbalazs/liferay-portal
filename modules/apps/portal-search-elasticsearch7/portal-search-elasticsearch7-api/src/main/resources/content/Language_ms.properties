client-transport-ignore-cluster-name=Pengangkutan Pelanggan Abaikan Nama Kluster (Automatic Translation)
client-transport-ignore-cluster-name-help=Jika ini disemak, pengesahan nama kelompok nod bersambung diabaikan. (Automatic Translation)
client-transport-nodes-sampler-interval=Selang Nod Pengangkutan Pelanggan Sampler (Automatic Translation)
client-transport-nodes-sampler-interval-help=Tetapkan selang (dalam beberapa saat) di mana sampel nod pelanggan / pings disambungkan nod. Jika tidak diset, Elasticsearch client.transport.nodes_sampler_interval lalai digunakan. (Automatic Translation)
client-transport-ping-timeout=Pelanggan Pengangkutan Ping Timeout (Automatic Translation)
client-transport-ping-timeout-help=Masukkan masa (dalam beberapa saat) nod pelanggan menunggu jawapan ping dari nod. Jika tidak diset, Elasticsearch client.transport.ping_timeout lalai digunakan. (Automatic Translation)
client-transport-sniff=Pengangkutan Pelanggan Menghidu (Automatic Translation)
client-transport-sniff-help=Jika ini diperiksa, penghidupan kelompok didayakan untuk menemui nod yang ada secara dinamik dalam kelompok. (Automatic Translation)
cluster-name=Nama Kluster (Automatic Translation)
cluster-name-help=Masukkan nama kelompok untuk menyertai. Nama harus sepadan dengan kelompok jauh apabila Mod Operasi ditetapkan kepada jauh. (Automatic Translation)
discovery-zen-ping-unicast-hosts-port=Zen Discovery Unicast Tuan Rumah Pelabuhan (Automatic Translation)
discovery-zen-ping-unicast-hosts-port-help=Sediakan pelbagai pelabuhan untuk digunakan semasa membina nilai discovery.zen.ping.unicast.hosts. Pelbagai nod Elasticsearch pada pelbagai port boleh bertindak sebagai penghala gosip pada komputer yang sama. (Automatic Translation)
elasticsearch7-configuration-name=Elasticsearch 7 (Automatic Translation)
http-cors-allow-origin=Http CORS Benarkan Asal (Automatic Translation)
