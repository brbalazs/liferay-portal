retry-on-conflict=Cuba semula pada Konflik (Automatic Translation)
retry-on-conflict-help=Tetapkan bilangan cubaan semula jika konflik versi berlaku kerana dokumen itu dikemas kini antara mendapatkannya dan mengemas kininya. (Automatic Translation)
ssl-certificate-authorities-paths=Pihak Berkuasa Sijil SSL (Automatic Translation)
