transport-ssl-verification-mode=Mod Pengesahan SSL Pengangkutan (Automatic Translation)
transport-ssl-verification-mode-help=Tentukan jenis pengesahan (tiada, sijil, atau penuh) apabila menggunakan LDAP untuk melindungi daripada manusia dalam serangan tengah dan pemalsuan sijil. (Automatic Translation)
transport-tcp-port=Pelabuhan TCP Pengangkutan (Automatic Translation)
transport-tcp-port-help=Tentukan port untuk mengikat komunikasi antara nod. Menerima nilai tunggal atau julat (contohnya, 9300-9400). (Automatic Translation)
