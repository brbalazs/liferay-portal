additional-type-mappings=Pemetaan Jenis Tambahan (Automatic Translation)
additional-type-mappings-help=Tetapkan pemetaan tersuai untuk LiferayDocumentType, dalam format JSON (Elasticsearch Meletakkan API Pemetaan). Nilai ini harus ditetapkan dengan pemetaan medan baru sahaja. Jika anda menetapkan nilai ini dengan mana-mana pemetaan bertindih untuk medan lalai, penciptaan indeks gagal. Untuk menggantikan pemetaan lalai sepenuhnya, gunakan overrideTypeMappings. (Automatic Translation)
bootstrap-mlockall=Bootstrap Mlockall (Automatic Translation)
bootstrap-mlockall-help=Jika ini diperiksa, ruang alamat proses dikunci ke dalam RAM, menghalang sebarang ingatan Elasticsearch daripada ditukar keluar. (Automatic Translation)
certificate-format=Format Sijil (Automatic Translation)
