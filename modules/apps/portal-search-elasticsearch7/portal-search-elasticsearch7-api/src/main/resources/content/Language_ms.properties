http-cors-configurations=Konfigurasi HTTP CORS (Automatic Translation)
http-cors-configurations-help=Menyediakan seting tersuai untuk HTTP CORS, dalam format YML (elasticsearch.yml). (Automatic Translation)
http-cors-enabled=Http CORS Didayakan (Automatic Translation)
http-cors-enabled-help=Jika ini diperiksa, perkongsian sumber silang asal didayakan, yang menentukan sama ada pelayar pada asal lain boleh membuat permintaan kepada Elasticsearch. Jika dinyahdayakan, alatan front-end web seperti kepala anjal mungkin tidak dapat menyambung. (Automatic Translation)
http-enabled=Didayakan Http (Automatic Translation)
http-enabled-help=Seting ini telah diluaskan dan akan dialih keluaran pada masa akan datang. Jika ini disemak, lapisan HTTP didayakan. Jika tidak disemak, lapisan HTTP dinyahdayakan pada nod yang tidak dimaksudkan untuk melayani permintaan REST secara langsung. (Automatic Translation)
index-name-prefix=Awalan Nama Indeks (Automatic Translation)
index-name-prefix-help=Tetapkan awalan untuk nama indeks carian. Nilai ini tidak boleh diubah dalam keadaan normal. Jika anda menukar nilai ini, anda juga mesti memasang semula portal dan kemudian memadam indeks lama secara manual menggunakan konsol pentadbiran Elasticsearch. (Automatic Translation)
log-exceptions-only=Pengecualian Log Sahaja (Automatic Translation)
log-exceptions-only-help=Jika ini diperiksa, pengecualian balak hanya dari Elasticsearch dan tidak membuangnya semula. (Automatic Translation)
network-bind-host=Hos Ikatan Rangkaian (Automatic Translation)
network-bind-host-help=Tentukan antara muka rangkaian nod harus diikat untuk mendengar permintaan masuk. (Automatic Translation)
network-host=Hos Rangkaian (Automatic Translation)
network-host-help=Tetapkan nama hos atau alamat IP yang terikat pada nod, yang digunakan untuk menerbitkan (mengiklankan) tuan rumah kepada nod lain dalam kelompok. Ini adalah pintasan yang menetapkan hos terikat dan hos penerbitan pada masa yang sama. (Automatic Translation)
network-publish-host=Hos Terbitan Rangkaian (Automatic Translation)
network-publish-host-help=Tetapkan antara muka tunggal nod mengiklankan kepada nod lain dalam kelompok, supaya nod tersebut boleh menyambung kepadanya. (Automatic Translation)
number-of-index-replicas=Bilangan Replika Indeks (Automatic Translation)
number-of-index-replicas-help=Masukkan bilangan replika untuk setiap indeks Liferay. Jika tidak diset, tiada replika digunakan. Perubahan kepada nilai ini berkesan selepas reindex penuh. (Automatic Translation)
number-of-index-shards=Bilangan Shards Indeks (Automatic Translation)
number-of-index-shards-help=Tetapkan bilangan jerung untuk digunakan apabila indeks Liferay dicipta. Jika tidak diset, satu jerung akan digunakan. Perubahan kepada nilai ini berkesan selepas reindex penuh. (Automatic Translation)
operation-mode=Mod Operasi (Automatic Translation)
operation-mode-help=Mod operasi JAUH menyambung ke kluster Elasticsearch kendiri jauh. Mod operasi EMBEDDED memulakan Portal dengan contoh Elasticsearch dalaman dalam JVM yang sama. Mod operasi EMBEDDED tidak disokong. (Automatic Translation)
override-type-mappings=Pemetaan Jenis Override (Automatic Translation)
override-type-mappings-help=Tetapkan pemetaan tersuai untuk menggantikan sepenuhnya pemetaan lalai untuk LiferayDocumentType, dalam format JSON (Elasticsearch Put Mapping API). Jika anda menetapkan nilai ini, penciptaan indeks mengabaikan definisi pemetaan lalai dan sebarang titik sambungan, menggunakan definisi pemetaan alternatif ini. Gunakan ini jika anda memerlukan LiferayDocumentType untuk dicipta dengan pemetaan nonstandard untuk medan lalai. Jika anda hanya perlu menambah pemetaan tersuai baru tanpa bertindih mana-mana lalai, gunakan TambahanTypeMappings. (Automatic Translation)
password-help=Jika Memerlukan Pengesahan didayakan, kata laluan diperlukan. (Automatic Translation)
