additional-configurations=Dodatkowe konfiguracje (Automatic Translation)
additional-configurations-help=Wprowadź niestandardowe ustawienia osadzonego Elasticsearch w formacie YML (elasticsearch.yml). (Automatic Translation)
additional-index-configurations=Dodatkowe konfiguracje indeksów (Automatic Translation)
additional-index-configurations-help=Wprowadź niestandardowe ustawienia indeksu Liferay w formacie JSON lub YML (Elasticsearch Create Index API). (Automatic Translation)
additional-type-mappings=Dodatkowe mapowania typów (Automatic Translation)
additional-type-mappings-help=Ustaw niestandardowe mapowania dla LiferayDocumentType w formacie JSON (Elasticsearch Put Mapping API). Ta wartość powinna być ustawiona tylko przy nowych mapowaniach pól. Jeśli ta wartość zostanie ustawiona z dowolnymi nakładającymi się mapowaniami dla pól domyślnych, tworzenie indeksu zakończy się niepowodzeniem. Aby całkowicie zastąpić mapowania domyślne, należy użyć overrideTypeMappings. (Automatic Translation)
bootstrap-mlockall=Bootstrap Mlockall (Automatic Translation)
bootstrap-mlockall-help=Jeśli to jest zaznaczone, przestrzeń adresowa procesu jest zablokowana w pamięci RAM, zapobiegając zamianie pamięci Elasticsearch. (Automatic Translation)
certificate-format=Format certyfikatu (Automatic Translation)
certificate-format-help=Określ format certyfikatu (PEM lub PKCS#12). (Automatic Translation)
client-transport-ignore-cluster-name=Nazwa klastra ignorowania transportu klienta (Automatic Translation)
client-transport-ignore-cluster-name-help=Jeśli to jest zaznaczone, sprawdzanie poprawności nazwy klastra połączonych węzłów jest ignorowane. (Automatic Translation)
client-transport-nodes-sampler-interval=Interwał próbnika węzłów transportu klienta (Automatic Translation)
client-transport-nodes-sampler-interval-help=Ustaw interwał (w sekundach), w którym węzeł klienta przyłącza się do węzłów/pingów. Jeśli nie jest ustawiona, używana jest domyślna client.transport.nodes_sampler_interval elasticsearch. (Automatic Translation)
client-transport-ping-timeout=Limit czasu ping transportu klienta (Automatic Translation)
client-transport-ping-timeout-help=Wprowadź czas (w sekundach) węzeł klienta czeka na odpowiedź ping z węzła. Jeśli nie jest ustawione, używana jest domyślna client.transport.ping_timeout elasticsearch. (Automatic Translation)
client-transport-sniff=Wąchanie transportu klienta (Automatic Translation)
client-transport-sniff-help=Jeśli to jest zaznaczone, wąchanie klastra jest włączone dynamicznie odnajdywać dostępne węzły w klastrze. (Automatic Translation)
cluster-name=Nazwa klastra (Automatic Translation)
cluster-name-help=Wprowadź nazwę klastra do dołączenia. Nazwa powinna być zgodna ze zdalnym klastrem, gdy tryb pracy jest ustawiony na zdalny. (Automatic Translation)
discovery-zen-ping-unicast-hosts-port=Port hostów emisji pojedynczej Zen Discovery (Automatic Translation)
discovery-zen-ping-unicast-hosts-port-help=Podaj zakres portów używanych podczas tworzenia wartości discovery.zen.ping.unicast.hosts. Wiele węzłów Elasticsearch na różnych portach może działać jako routery plotkarskie na tym samym komputerze. (Automatic Translation)
elasticsearch7-configuration-name=Elasticsearch 7 (Automatic Translation)
http-cors-allow-origin=Http CORS Zezwalaj na pochodzenie (Automatic Translation)
http-cors-allow-origin-help=Wprowadź źródła, aby zezwolić, gdy http cors jest włączony. (Automatic Translation)
http-cors-configurations=Konfiguracje protokołu HTTP CORS (Automatic Translation)
http-cors-configurations-help=Podaj niestandardowe ustawienia protokołu HTTP CORS w formacie YML (elasticsearch.yml). (Automatic Translation)
http-cors-enabled=Http CORS włączone (Automatic Translation)
http-cors-enabled-help=Jeśli to jest zaznaczone, udostępnianie zasobów między źródłami jest włączone, co określa, czy przeglądarka innego źródła może żądać Elasticsearch. Jeśli jest wyłączona, narzędzia front-endu sieci web, takie jak elasticsearch-head, mogą nie być w stanie się połączyć. (Automatic Translation)
http-enabled=Http włączone (Automatic Translation)
http-enabled-help=To ustawienie zostało przestarzałe i zostanie usunięte w przyszłej wersji. Jeśli ta opcja jest zaznaczona, warstwa HTTP jest włączona. Jeśli opcja ta nie jest zaznaczona, warstwa HTTP jest wyłączona w węzłach, które nie są przeznaczone do bezpośredniego obsługi żądań REST. (Automatic Translation)
index-name-prefix=Prefiks nazwy indeksu (Automatic Translation)
index-name-prefix-help=Ustaw prefiks nazwy indeksu wyszukiwania. Ta wartość nie powinna być zmieniana w normalnych warunkach. Jeśli zmienisz tę wartość, należy również ponownie zeksuj portal, a następnie ręcznie usunąć stary indeks za pomocą konsoli administracyjnej Elasticsearch. (Automatic Translation)
log-exceptions-only=Tylko wyjątki dziennika (Automatic Translation)
log-exceptions-only-help=Jeśli jest to zaznaczone, rejestruje wyjątki tylko z Elasticsearch i nie zgłasza je ponownie. (Automatic Translation)
network-bind-host=Host wiązania sieciowego (Automatic Translation)
network-bind-host-help=Określ interfejsy sieciowe, z których węzeł powinien być powiązany w celu nasłuchiowania żądań przychodzących. (Automatic Translation)
network-host=Host sieciowy (Automatic Translation)
network-host-help=Ustaw adres hosta lub adres IP powiązany z węzłem, który jest używany do publikowania (anonsowania) hosta w innych węzłach w klastrze. Jest to skrót, który ustawia hosta powiązania i hosta publikowania w tym samym czasie. (Automatic Translation)
network-publish-host=Host publikowania w sieci (Automatic Translation)
network-publish-host-help=Ustaw pojedynczy interfejs, który węzeł anonsuje do innych węzłów w klastrze, aby te węzły mogły się z nim połączyć. (Automatic Translation)
number-of-index-replicas=Liczba replik indeksu (Automatic Translation)
number-of-index-replicas-help=Wprowadź liczbę replik dla każdego indeksu Liferay. Jeśli nie zostanie ustawione, nie są używane żadne repliki. Zmiany tej wartości zaa ujmują się po pełnym redeksu. (Automatic Translation)
number-of-index-shards=Liczba odłamków indeksu (Automatic Translation)
number-of-index-shards-help=Ustaw liczbę fragmentów do użycia podczas tworzenia indeksu Liferay. Jeśli unset, jeden fragment będzie używany. Zmiany tej wartości zaa ujmują się po pełnym redeksu. (Automatic Translation)
operation-mode=Tryb pracy (Automatic Translation)
operation-mode-help=Tryb pracy REMOTE łączy się ze zdalnym autonomicznym klastrem elasticsearch. Tryb operacji EMBEDDED uruchamia portal z wewnętrznym wystąpieniem Elasticsearch w tym samym dżomie JVM. Tryb pracy EMBEDDED nie jest nieobsługiwał. (Automatic Translation)
override-type-mappings=Zastępowanie mapowań typów (Automatic Translation)
override-type-mappings-help=Ustaw niestandardowe mapowania, aby w pełni zastąpić domyślne mapowania dla LiferayDocumentType w formacie JSON (Elasticsearch Put Mapping API). Jeśli ustawisz tę wartość, tworzenie indeksu ignoruje domyślną definicję mapowań i wszystkie punkty rozszerzenia, używając tej alternatywnej definicji mapowań. Użyj tego, jeśli potrzebujesz LiferayDocumentType do utworzenia z niestandardowymi mapowaniami dla pól domyślnych. Jeśli wystarczy dodać nowe mapowania niestandardowe bez nakładania się żadnych ustawień domyślnych, należy użyć additionalTypeMappings. (Automatic Translation)
password-help=Jeśli jest włączona opcja Wymaga uwierzytelniania, wymagane jest hasło. (Automatic Translation)
requires-authentication=Wymaga uwierzytelniania (Automatic Translation)
requires-authentication-help=Jeśli ta opcja jest włączona, połączenia z elasticsearch/X-Pack są uwierzytelniane przy użyciu skonfigurowanego loginu i hasła. (Automatic Translation)
rest-client-logger-level=Poziom rejestratora klienta REST (Automatic Translation)
rest-client-logger-level-help=Ustaw poziom rejestrowania dla klienta elasticsearch REST. (Automatic Translation)
retry-on-conflict=Ponów próbę konfliktu (Automatic Translation)
retry-on-conflict-help=Ustaw liczbę ponownych prób, aby spróbować, jeśli występuje konflikt wersji, ponieważ dokument został zaktualizowany między pobieraniem go i aktualizowanie go. (Automatic Translation)
ssl-certificate-authorities-paths=Urzędy certyfikacji SSL (Automatic Translation)
ssl-certificate-authorities-paths-help=Podaj listę ścieżek do zaufanych plików certyfikatów zakodowanych w pem. (Automatic Translation)
ssl-certificate-path=Certyfikat SSL (Automatic Translation)
ssl-certificate-path-help=Wprowadź ścieżkę do pliku zakodowanego pem zawierającego certyfikat (lub łańcuch certyfikatów), który zostanie przedstawiony klientom podczas łączenia się. (Automatic Translation)
ssl-key-path=Klucz SSL (Automatic Translation)
ssl-key-path-help=Wprowadź ścieżkę do pliku zakodowanego w pliku PEM zawierającego klucz prywatny. (Automatic Translation)
ssl-keystore-password=Hasło do magazynu kluczy SSL (Automatic Translation)
ssl-keystore-password-help=Wprowadź hasło do pliku PKCS#12. (Automatic Translation)
ssl-keystore-path=Ścieżka magazynu kluczy SSL (Automatic Translation)
ssl-keystore-path-help=Wprowadź ścieżkę do magazynu kluczy, w którym znajduje się klucz prywatny i certyfikat. (Automatic Translation)
ssl-truststore-password=Hasło do magazynu zaufania SSL (Automatic Translation)
ssl-truststore-password-help=Wprowadź hasło do magazynu zaufania. (Automatic Translation)
ssl-truststore-path=Ścieżka magazynu zaufania SSL (Automatic Translation)
ssl-truststore-path-help=Wprowadź ścieżkę do pliku magazynu zaufania. (Automatic Translation)
track-total-hits=Śledź łączną liczbę trafień (Automatic Translation)
track-total-hits-help=Ustaw to na true, aby dokładnie policzyć całkowitą liczbę trafień, gdy wyszukiwanie jest więcej niż 10 000. Ustawienie tej funkcji true może mieć wpływ na wydajność, gdy istnieje duża liczba trafień w wyszukiwaniu. (Automatic Translation)
transport-addresses=Adresy transportu (Automatic Translation)
transport-addresses-help=Ustaw zdalne adresy węzłów, z którymi chcesz się połączyć. Ta wartość jest wymagana, gdy tryb pracy jest ustawiony na REMOTE. (Automatic Translation)
transport-ssl-enabled=Transport SSL włączone (Automatic Translation)
transport-ssl-enabled-help=Włączanie lub wyłączanie protokołu TLS/SSL. (Automatic Translation)
transport-ssl-verification-mode=Transport SSL Tryb weryfikacji (Automatic Translation)
transport-ssl-verification-mode-help=Określ typ weryfikacji (brak, certyfikat lub pełny) podczas korzystania z protokołu LDAP w celu ochrony przed atakami typu man w środku i fałszerstwa certyfikatów. (Automatic Translation)
transport-tcp-port=Port TCP transportu (Automatic Translation)
transport-tcp-port-help=Określ port do powiązania dla komunikacji między węzłami. Akceptuje pojedynczą wartość lub zakres (np. 9300-9400). (Automatic Translation)
username=Nazwę użytkownika (Automatic Translation)
username-help=Jeśli wymaga uwierzytelniania jest włączona, należy ustawić nazwę użytkownika do uwierzytelniania na Elasticsearch jest wymagane. (Automatic Translation)
xpack-security-configuration-name=Zabezpieczenia X-Pack (Automatic Translation)