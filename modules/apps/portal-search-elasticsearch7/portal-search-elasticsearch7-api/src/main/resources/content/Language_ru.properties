transport-ssl-verification-mode=Режим проверки транспорта SSL (Automatic Translation)
transport-ssl-verification-mode-help=Укажите тип проверки (нет, сертификат или полный) при использовании LDAP для защиты от человека в средних атаках и подделке сертификатов. (Automatic Translation)
transport-tcp-port=Транспорт TCP Порт (Automatic Translation)
transport-tcp-port-help=Укажите порт для связывания связи между узлами. Принимает одно значение или диапазон (например, 9300-9400). (Automatic Translation)
username=Имя пользователя (Automatic Translation)
