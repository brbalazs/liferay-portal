additional-type-mappings=Дополнительные типы карт (Automatic Translation)
additional-type-mappings-help=Установите пользовательские отображения для LiferayDocumentType в формате JSON (Elasticsearch Put Mapping API). Это значение должно быть установлено только с помощью новых полевых карт. Если установить это значение с помощью перекрывающихся отображений для полей по умолчанию, создание индекса не удается. Чтобы полностью заменить отображение по умолчанию, используйте overrideTypeMappings. (Automatic Translation)
bootstrap-mlockall=Бутстрап Млоколл (Automatic Translation)
bootstrap-mlockall-help=Если это проверено, пространство адреса процесса заблокировано в оперативной памяти, предотвращая замену памяти Elasticsearch. (Automatic Translation)
certificate-format=Формат сертификата (Automatic Translation)
certificate-format-help=Укажите формат сертификата (PEM или PKCS-12). (Automatic Translation)
client-transport-ignore-cluster-name=Клиент Транспорт Игнорировать название кластера (Automatic Translation)
client-transport-ignore-cluster-name-help=Если это проверено, проверка имени кластера подключенных узлов игнорируется. (Automatic Translation)
client-transport-nodes-sampler-interval=Интервал клиентских транспортных узлов Sampler (Automatic Translation)
client-transport-nodes-sampler-interval-help=Установите интервал (в секундах), при котором клиентские образцы узлов/пингов подключены к узлам. При неустановлении используется client.transport.nodes_sampler_interval Elasticsearch. (Automatic Translation)
client-transport-ping-timeout=Клиент Транспорт Ping тайм-аут (Automatic Translation)
client-transport-ping-timeout-help=Введите время (в секундах) узел клиента ждет ответа пинг от узла. При неустановлении используется client.transport.ping_timeout Elasticsearch. (Automatic Translation)
client-transport-sniff=Клиент Транспорт Sniff (Automatic Translation)
client-transport-sniff-help=Если это проверено, кластерное нюхание позволяет динамически обнаружить доступные узлы в кластере. (Automatic Translation)
cluster-name=Название кластера (Automatic Translation)
cluster-name-help=Введите название кластера, чтобы присоединиться. Название должно соответствовать удаленному кластеру при настройке режима работы на удаленном. (Automatic Translation)
discovery-zen-ping-unicast-hosts-port=Дзен Дискавери Unicast Хосты Порт (Automatic Translation)
discovery-zen-ping-unicast-hosts-port-help=Предоставьте ряд портов для использования при создании значения discovery.zen.ping.unicast.hosts. Несколько узлов Elasticsearch в различных портах могут выступать в качестве маршрутизаторов сплетен на одном компьютере. (Automatic Translation)
elasticsearch7-configuration-name=Упругий поиск 7 (Automatic Translation)
http-cors-allow-origin=Http CORS Разрешить происхождение (Automatic Translation)
http-cors-allow-origin-help=Введите истоки, чтобы, когда HTTP CORS включен. (Automatic Translation)
http-cors-configurations=Конфигурации Http CORS (Automatic Translation)
http-cors-configurations-help=Предоставьте пользовательские настройки для HTTP CORS в формате YML (elasticsearch.yml). (Automatic Translation)
http-cors-enabled=Http CORS Включено (Automatic Translation)
http-cors-enabled-help=Если это проверено, включается совместное использование ресурсов кросс-происхождения, которое определяет, может ли браузер другого происхождения делать запросы в Elasticsearch. При отключении веб-инструменты переднего конца, такие как elasticsearch-голова, могут быть не в состоянии подключиться. (Automatic Translation)
http-enabled=Http Включено (Automatic Translation)
http-enabled-help=Эта настройка была увеничаема и будет удалена в будущем выпуске. Если это проверено, включен слой HTTP. При отсутствии контроля слой HTTP отмечен на узлах, которые не предназначены для непосредственного обслуживания запросов REST. (Automatic Translation)
index-name-prefix=Префикс названия индекса (Automatic Translation)
index-name-prefix-help=Установите приставку для имени индекса поиска. Это значение не должно быть изменено при нормальных условиях. Если вы измените это значение, вы также должны переиндексировать портал, а затем вручную удалить старый индекс с помощью консоли администрирования Elasticsearch. (Automatic Translation)
log-exceptions-only=Только исключения из журнала (Automatic Translation)
log-exceptions-only-help=Если это проверено, журналы исключения только из Elasticsearch и не повторно бросить их. (Automatic Translation)
network-bind-host=Сетевой хост bind (Automatic Translation)
network-bind-host-help=Укажите сетевой интерфейс (ы) узел должен связываться с для того, чтобы слушать входящие запросы. (Automatic Translation)
network-host=Сетевой хост (Automatic Translation)
network-host-help=Установите имя хоста или IP-адрес, связанный с узлом, который используется для публикации (рекламы) узла другим узлам кластера. Это ярлык, который устанавливает хост связывания и хост публикации в то же время. (Automatic Translation)
network-publish-host=Сеть Публикация Хост (Automatic Translation)
network-publish-host-help=Установите единый интерфейс, который узел рекламирует другим узлам кластера, чтобы эти узлы могли подключаться к нему. (Automatic Translation)
number-of-index-replicas=Количество индексных реплик (Automatic Translation)
number-of-index-replicas-help=Введите количество реплик для каждого индекса Liferay. Если не умножество, реплики не используются. Изменения в этом значении вступят в силу после полного переиндекса. (Automatic Translation)
number-of-index-shards=Количество осколков индекса (Automatic Translation)
number-of-index-shards-help=Установите количество осколков для использования при создании индекса Liferay. При неустановлении будет использоваться один осколок. Изменения в этом значении вступят в силу после полного переиндекса. (Automatic Translation)
operation-mode=Режим работы (Automatic Translation)
operation-mode-help=Режим работы REMOTE подключается к удаленному автономному кластеру Elasticsearch. Режим работы EMBEDDED запускает Portal с внутреннего экземпляра Elasticsearch в том же JVM. Режим работы EMBEDDED не поддерживается. (Automatic Translation)
override-type-mappings=Переопределение типов карт (Automatic Translation)
override-type-mappings-help=Установите пользовательские отображения, чтобы полностью заменить отображение по умолчанию для LiferayDocumentType, в формате JSON (Elasticsearch Put Mapping API). Если вы установите это значение, создание индекса игнорирует определение отображения по умолчанию и любые точки расширения, используя вместо этого это альтернативное определение отображения. Используйте это, если вам нужно LiferayDocumentType, который будет создан с нестандартными отображениями для полей по умолчанию. Если вам просто нужно добавить новые пользовательские отображения без перекрытия каких-либо по умолчанию, используйте additionalTypeMappings. (Automatic Translation)
password-help=Если требуется аутентификация включена, пароль не требуется. (Automatic Translation)
requires-authentication=Требуется аутентификация (Automatic Translation)
requires-authentication-help=При включении соединения с Elasticsearch/X-Pack подаются с помощью настроенного имени пользователя и пароля. (Automatic Translation)
rest-client-logger-level=REST Клиент Логгер уровень (Automatic Translation)
rest-client-logger-level-help=Установите уровень регистрации для клиента Elasticsearch REST. (Automatic Translation)
retry-on-conflict=Повторить конфликт (Automatic Translation)
retry-on-conflict-help=Установите количество ретрий, чтобы попытаться, если происходит конфликт версии, потому что документ был обновлен между его извлечением и обновлением. (Automatic Translation)
ssl-certificate-authorities-paths=Органы SSL-сертификаты (Automatic Translation)
ssl-certificate-authorities-paths-help=Предоставьте список путей доверенных файлов сертификатов PEM. (Automatic Translation)
ssl-certificate-path=Сертификат SSL (Automatic Translation)
ssl-certificate-path-help=Введите путь к закодированный файл PEM, содержащий сертификат (или цепочку сертификатов), который будет представлен клиентам при подключении. (Automatic Translation)
ssl-key-path=Ключ SSL (Automatic Translation)
ssl-key-path-help=Введите путь к закодированный файл PEM, содержащий частный ключ. (Automatic Translation)
ssl-keystore-password=Пароль SSL Keystore (Automatic Translation)
ssl-keystore-password-help=Введите пароль к файлу PKCS-12. (Automatic Translation)
ssl-keystore-path=Путь SSL Keystore (Automatic Translation)
ssl-keystore-path-help=Введите путь к keystore проведения частный ключ и сертификат. (Automatic Translation)
ssl-truststore-password=Пароль SSL Truststore (Automatic Translation)
ssl-truststore-password-help=Введите пароль в магазин доверия. (Automatic Translation)
ssl-truststore-path=Путь SSL Truststore (Automatic Translation)
ssl-truststore-path-help=Введите путь к файлу truststore. (Automatic Translation)
track-total-hits=Трек Всего хитов (Automatic Translation)
track-total-hits-help=Установите это, чтобы точно подсчитать общее количество просмотров, когда есть более чем 10000 результатов для поиска. Установка этого истине может повлиять на производительность, когда есть большое количество хитов для поиска. (Automatic Translation)
transport-addresses=Транспортные адреса (Automatic Translation)
transport-addresses-help=Установите адреса удаленных узла для подключения. Это значение требуется при настройке режима работы REMOTE. (Automatic Translation)
transport-ssl-enabled=Транспорт SSL включен (Automatic Translation)
