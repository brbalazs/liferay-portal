network-bind-host=Вузол мережних прив'яязку (Automatic Translation)
network-bind-host-help=Вкажіть мережеві інтерфейси, до які слід прив' язати вузол, щоб прослуховувати вхідні запити. (Automatic Translation)
network-host=Мережний вузол (Automatic Translation)
network-host-help=Встановіть ім'я хоста або IP-адресу, прив'язану до вузла, який використовується для публікації (реклами) вузла на інших вузлах кластера. Це скорочення, яке встановлює вузол прив'їв і вузол публікації одночасно. (Automatic Translation)
network-publish-host=Вузол публікації в мережі (Automatic Translation)
network-publish-host-help=Встановіть єдиний інтерфейс, який вузол рекламує, на інші вузли кластера, щоб ці вузли могли підключатися до нього. (Automatic Translation)
number-of-index-replicas=Кількість реплік індексу (Automatic Translation)
number-of-index-replicas-help=Введіть кількість реплік для кожного індексу Liferay. Якщо цей аргумент не буде використано, репліки не використовуватися. Зміни цього значення наберуть сили після повного переіндекса. (Automatic Translation)
