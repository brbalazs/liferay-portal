additional-type-mappings-help=Встановіть власні зіставлення для liferayDocumentType у форматі JSON (Api пружної карти). Це значення слід установити лише для нових зіставлень полів. Якщо встановити це значення з будь-якими зіставленнями, що перекриваються для полів за промовчанням, створення індексу зазнає невдачі. Щоб повністю замінити зіставлення за промовчанням, використовуйте defaultTypeMappings. (Automatic Translation)
bootstrap-mlockall=Завантаження Mlockall (Automatic Translation)
