number-of-index-shards-help=Встановіть кількість осколків, які використовуватимуться під час створення індексу Liferay. Якщо ви не встановиться, буде використано один осколок. Зміни цього значення наберуть сили після повного переіндекса. (Automatic Translation)
operation-mode=Режим роботи (Automatic Translation)
operation-mode-help=Режим дистанційної роботи підключається до віддаленого автономного кластера Elasticsearch. Режим вбудованої роботи запускає портал із внутрішнім екземпляром Elasticsearch у тому самому СПМ. Режим вбудованої операції не підтримується. (Automatic Translation)
override-type-mappings=Перевизначити зіставлення типів (Automatic Translation)
override-type-mappings-help=Установіть власні зіставлення, щоб повністю замінити зіставлення за промовчанням для LiferayDocumentType у форматі JSON (Elasticsearch Put Mapping API). Якщо встановити це значення, створення індексу ігноруватиме визначення зіставлень за промовчанням і будь-які точки розширення, використовуючи натомість це альтернативне визначення зіставлення. Використовуйте цей параметр, якщо потрібно створити LiferayDocumentType із нестандартними зіставленнями полів за промовчанням. Якщо потрібно просто додати нові настроювані зіставлення, не перекриваючи жодних значень за промовчанням, використовуйте додаткові зіставленняType. (Automatic Translation)
password-help=Якщо ввімкнуто обов'язкову автентифікацію, потрібен пароль. (Automatic Translation)
