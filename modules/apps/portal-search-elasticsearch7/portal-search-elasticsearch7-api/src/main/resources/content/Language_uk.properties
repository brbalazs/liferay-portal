client-transport-ping-timeout-help=Введіть час (у секундах), коли вузол клієнта чекає на відповідь ping від вузла. Якщо цей параметр не буде задано, буде client.transport.ping_timeout elasticsearch. (Automatic Translation)
client-transport-sniff=Нюхання транспорту клієнта (Automatic Translation)
client-transport-sniff-help=Якщо буде позначено цей пункт, буде увімкнено обнюхування кластера для динамічного виявлення доступних вузлів у кластері. (Automatic Translation)
cluster-name=Ім'я кластера (Automatic Translation)
cluster-name-help=Введіть ім'я кластера, який потрібно об'єднати. Ім'я має збігатися з іменем віддаленого кластера, якщо режим роботи встановлено на віддалений. (Automatic Translation)
