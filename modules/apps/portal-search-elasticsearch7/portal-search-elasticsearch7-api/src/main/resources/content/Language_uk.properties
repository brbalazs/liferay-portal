http-cors-enabled=Увімкнуто http CORS (Automatic Translation)
http-cors-enabled-help=Якщо буде позначено цей пункт, буде увімкнено спільний доступ до ресурсів між джерелом, який визначає, чи може браузер іншого походження робити запити до Elasticsearch. Якщо цей інструмент вимкнено, веб-інструменти інтерфейсу, такі як elasticsearch-head, можуть бути не в змозі підключитися. (Automatic Translation)
http-enabled=Ввімкнуто http (Automatic Translation)
http-enabled-help=Цей параметр вилучено, і його буде видалено в майбутньому випуску. Якщо буде позначено цей пункт, буде увімкнено шар HTTP. Якщо цей пункт не буде позначено, рівень HTTP буде вимкнено на вузлах, які не призначені для безпосереднього обслуговування запитів REST. (Automatic Translation)
index-name-prefix=Префікс імені індексу (Automatic Translation)
index-name-prefix-help=Установіть префікс імені індексу пошуку. Це значення не слід змінювати за звичайних умов. Якщо це значення змінюється, потрібно також повторно додати портал, а потім вручну видалити старий індекс за допомогою консолі адміністрування Elasticsearch. (Automatic Translation)
log-exceptions-only=Лише винятки журналу (Automatic Translation)
