track-total-hits-help=Встановіть значення true, щоб точно підрахувати загальну кількість звернень, якщо результатів пошуку більше 10 000. Встановлення значення true може вплинути на продуктивність, якщо пошук буде великою кількістю звернень. (Automatic Translation)
