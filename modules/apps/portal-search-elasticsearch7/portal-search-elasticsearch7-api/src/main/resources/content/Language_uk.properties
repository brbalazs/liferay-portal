discovery-zen-ping-unicast-hosts-port-help=Укажіть діапазон портів, які використовуватиметься під час побудови значення discovery.zen.ping.unicast.hosts. Кілька вузлів Elasticsearch на ряді портів можуть виступати в якості маршрутизаторів пліток на одному комп'ютері. (Automatic Translation)
