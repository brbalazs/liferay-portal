requires-authentication-help=Якщо увімкнено, з'єднання з Elasticsearch/X-Pack автентифікуються за допомогою налаштованого імені користувача та пароля. (Automatic Translation)
rest-client-logger-level=Рівень журналу клієнтів REST (Automatic Translation)
