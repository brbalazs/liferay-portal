network-host-help=Đặt tên máy chủ hoặc địa chỉ IP bị ràng buộc với nút, được sử dụng để xuất bản (quảng cáo) máy chủ cho các nút khác trong cụm. Đây là một lối tắt đặt máy chủ liên kết và máy chủ xuất bản cùng một lúc. (Automatic Translation)
