operation-mode=Chế độ hoạt động (Automatic Translation)
operation-mode-help=Chế độ hoạt động REMOTE kết nối với cụm Elasticsearch độc lập từ xa. Chế độ hoạt động EMBEDDED khởi động Portal với một phiên bản Elasticsearch bên trong trong cùng một JVM. Chế độ hoạt động EMBEDDED không được hỗ trợ. (Automatic Translation)
override-type-mappings=Ghi đè Ánh xạ Loại (Automatic Translation)
override-type-mappings-help=Đặt ánh xạ tùy chỉnh để thay thế hoàn toàn ánh xạ mặc định cho LiferayDocumentType, ở định dạng JSON (ELASTICSEARCH Put Mapping API). Nếu bạn đặt giá trị này, tạo chỉ mục bỏ qua định nghĩa ánh xạ mặc định và bất kỳ điểm mở rộng nào, thay vào đó sử dụng định nghĩa ánh xạ thay thế này. Sử dụng điều này nếu bạn cần LiferayDocumentType được tạo bằng ánh xạ không chuẩn cho các trường mặc định. Nếu bạn chỉ cần thêm ánh xạ tùy chỉnh mới mà không chồng chéo bất kỳ mặc định nào, hãy sử dụng additionalTypeMappings. (Automatic Translation)
