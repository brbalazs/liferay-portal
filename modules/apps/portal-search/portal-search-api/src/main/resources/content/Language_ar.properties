nonbulk-indexing-override-help=تؤدي القيمة "صواب" إلى إعادة فهرسة الكيانات المعدلة دائمًا واحدًا تلو الآخر. ولأسباب تتعلق بالأداء، يتم إيقاف هذا الإعداد عمومًا في الإنتاج.
permission-filtered-search-result-accurate-count-threshold=權限篩選搜尋結果準確計數門檻值
permission-filtered-search-result-accurate-count-threshold-help=如果搜尋查詢結果低於門檻值，則確保權限篩選器後的搜尋結果的數量是準確的。
permission-terms-limit=權限條款限制
permission-terms-limit-help=يمكنك تعيين هذا الخيار للحد من عدد شروط البحث عن الإذن التي ستتم إضافتها إلى طلب البحث. إذا تم تجاوز هذا الحد، فلن تتم إضافة أي شروط بحث للإذن. وبدلاً من ذلك، سيعود التحقق من الإذن إلى عامل تصفية إذن البحث.
