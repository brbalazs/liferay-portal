search-query-result-window-limit=搜尋查詢結果的最大數
search-query-result-window-limit-help=عيّن هذا الخيار لتحديد عدد نتائج البحث التي يمكن طلبها من استعلام بحث.
synchronous-execution-override=تجاوز التنفيذ المتزامن
synchronous-execution-override-help=تؤدي القيمة "صواب" إلى حظر إعادة فهرسة الكيانات المعدلة دائمًا حتى اكتمالها. ولأسباب تتعلق بالأداء، يتم إيقاف هذا الإعداد عمومًا في الإنتاج.
