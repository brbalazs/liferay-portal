buffered=Gepuffert
buffered-execution-mode=Gepufferter Ausführungsmodus
default-keyword-query-configuration-name=預設關鍵字查詢
default-search-result-permission-filter-configuration-name=預設搜尋結果權限篩選
disabled-entry-class-names=Eintragsklassennamen deaktivieren
disabled-entry-class-names-help=Geben Sie die Eintragsklassennamen ein, für die DefaultKeywordQueryContributor die Felder Beschreibung, Benutzername und Titel nicht als Teil der Schlüsselwort-Suchanfrage enthalten wird.
exact-match-boost=Exact-Match-Boost
exact-match-boost-help=Legen Sie den Verstärkungswert fest, der angewendet werden soll, wenn Suchbegriffe mit einem Titel als exakte Wortfolge übereinstimmen.
excluded-entry-class-names=不包括條目類別名稱
field-name-patterns=欄位名稱模式
include-inherited-permissions=包括繼承的權限
include-inherited-permissions-help=Aktivieren Sie diese Einstellung, um die geerbten Rollen eines Benutzers bei der Filterung der Suchergbnisse einzuschließen. Die geerbten Rollen eines Benutzers schließen alle die durch Benutzergruppen- oder Oranisationszugehörigkeit zugewiesenen Rollen ein.
index-commit-immediately=Index sofort Commit
index-commit-immediately-help=設置此項為True來立即提交搜索索引寫入請求。因為每個寫入請求將迫使搜尋引擎刷新索引閱讀器和可能對刷新磁片事務，所以設置此項為True可能會對搜尋引擎性能帶來負面影響。Portal的預設行為是立即提交個人索引操作（例如，添加部落格、更新部落格）但對批量操作延遲提交（例如，索引所有客戶、索引所有Wiki）直到所有條目發送到搜尋引擎上。設置此項為False，則可能造成像資產出版器等 Widget 延遲回應顯示新添加的內容。例如，用戶使用預設Elasticsearch搜尋引擎時可能會遇到延遲。更多資訊請點擊：https://www.elastic.co/guide/en/elasticsearch/guide/current/near-real-time.html
index-status-manager-configuration-name=Index Statusmanager
index-writer-helper-configuration-name=Helfer Indexer-Schreiber
indexer-registry-configuration-name=Indexregistry
indexing-batch-sizes=Stapelgrößen indizieren
indexing-batch-sizes-help=Die Anzahl der Dokumente zum Indizieren pro Stapel für Modelltypen, die Stapel-Indizierung unterstützen. Standardmäßig 10000. Bei Modellen mit großen Dokumenten kann das Verkleinern dieses Wertes möglicherweise die Stabilität beim Ausführen einer vollständigen Neuindizierung verbessern.
max-buffer-size=Maximale Puffergröße
max-expansions=Maximale Erweiterungen
max-expansions-help=Legen Sie die Anzahl der eindeutigen Titel fest, die zugeordnet werden können, wenn Suchbegriffe einem Titel als Phrasenpräfix entsprechen.
minimum-buffer-availability-percentage=Minimaler Prozentsatz für Pufferverfügbarkeit
nonbulk-indexing-override=Nonbulk-Indizierung überschreiben
nonbulk-indexing-override-help=Der Wert "wahr" bewirkt, dass geänderte Entitäten immer einzeln neu indiziert werden. Aus Leistungsgründen ist diese Einstellung in der Fertigung generell deaktiviert.
permission-filtered-search-result-accurate-count-threshold=權限篩選搜尋結果準確計數門檻值
permission-filtered-search-result-accurate-count-threshold-help=如果搜尋查詢結果低於門檻值，則確保權限篩選器後的搜尋結果的數量是準確的。
permission-terms-limit=權限條款限制
permission-terms-limit-help=Legen Sie hier die Anzahl an Berechtigungssuchworten fest, die zur Suchanfrage hinzugefügt werden. Wenn dieses Limit überschritten wird, werden keine Berechtigungssuchworte hinzugefügt. Stattdessen wird die Berechtigungsüberprüfung zurückgehen zum Suchberechtigungsfilter.
query-pre-process-configuration-name=索引查詢預處理器
reindex-configuration-name=Neu indizieren
reindexer-configuration-name=Neuindizierer
search-engine-helper-configuration-name=Engine-Assistent
search-permission-checker-configuration-name=權限檢查器
search-query-result-window-limit=搜尋查詢結果的最大數
search-query-result-window-limit-help=Legen Sie hier die Anzahl der Suchergebnisse fest, die von einer Suchanfrage angefordert werden können.
synchronous-execution-override=Überschreiben der synchronen Ausführung
synchronous-execution-override-help=Der Wert "wahr" bewirkt, dass die Neuindizierung geänderter Entitäten immer blockiert wird, bis sie abgeschlossen ist. Aus Leistungsgründen ist diese Einstellung in der Fertigung generell deaktiviert.
title-field-query-builder-configuration-name=標題欄位查詢建置器