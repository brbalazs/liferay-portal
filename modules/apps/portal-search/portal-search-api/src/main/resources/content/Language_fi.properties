buffered=Puskuroitu
buffered-execution-mode=Puskuroitu Suoritustila
default-keyword-query-configuration-name=預設關鍵字查詢
default-search-result-permission-filter-configuration-name=預設搜尋結果權限篩選
disabled-entry-class-names=Käytöstä Poistetut Merkintäluokkien Nimet
disabled-entry-class-names-help=Määritä merkinnän luokan nimiä, joille DefaultKeywordQueryContributor ei sisällytä kuvausta, käyttäjänimeä ja otsikkokenttiä osana avainsanahakulauseketta.
exact-match-boost=Tarkan Vastaavuuden Tehostus
exact-match-boost-help=Aseta tehostusarvo, jota käytetään, kun hakutermit täsmäävät otsikkoon tarkkana fraasina.
excluded-entry-class-names=不包括條目類別名稱
field-name-patterns=欄位名稱模式
include-inherited-permissions=包括繼承的權限
include-inherited-permissions-help=Asettamalla tämän todeksi käyttäjän perityt roolit sisällytetään osaksi hakulupasuodatusta. Käyttäjän perittyihin rooleihin sisältyvät kaikki käyttäjälle nimitetyt käyttäjät hänen käyttäjäryhmästään sekä organisaation jäsenyydet.
index-commit-immediately=Indeksin Toimeenpano Välittömästi
index-commit-immediately-help=設置此項為True來立即提交搜索索引寫入請求。因為每個寫入請求將迫使搜尋引擎刷新索引閱讀器和可能對刷新磁片事務，所以設置此項為True可能會對搜尋引擎性能帶來負面影響。Portal的預設行為是立即提交個人索引操作（例如，添加部落格、更新部落格）但對批量操作延遲提交（例如，索引所有客戶、索引所有Wiki）直到所有條目發送到搜尋引擎上。設置此項為False，則可能造成像資產出版器等 Widget 延遲回應顯示新添加的內容。例如，用戶使用預設Elasticsearch搜尋引擎時可能會遇到延遲。更多資訊請點擊：https://www.elastic.co/guide/en/elasticsearch/guide/current/near-real-time.html
index-status-manager-configuration-name=Indeksi Tilan Hallinnoija
index-writer-helper-configuration-name=Indeksin kirjoittaja avustin
indexer-registry-configuration-name=Indeksirekisteri
indexing-batch-sizes=Indeksointierien Koot
indexing-batch-sizes-help=Erää kohti indeksoitavien asiakirjojen lukumäärä mallityypeille, jotka tukevat eräindeksointia. Oletusarvo on 10000. Malleille, joissa on laajoja dokumentteja, tämän arvon pienentäminen voi parantaa vakautta, kun suoritetaan täysi uudelleenindeksointi.
max-buffer-size=Suurin Puskurin Koko
max-expansions=Suurimmat Laajennukset
max-expansions-help=Aseta niiden yksikäsitteisten otsikkojen määrä, joita voidaan täsmäyttää, kun hakutermi täsmää otsikkoon fraasin etuliitteenä.
minimum-buffer-availability-percentage=Pienin Puskurin Saatavuuden Prosenttiosuus
nonbulk-indexing-override=Ei-massakäsittleyn Ohitus
nonbulk-indexing-override-help=Arvo "tosi" saa muutetut entiteetit aina uudelleenindeksoimaan yksi kerrallaan. Suorituskyvyn vuoksi tämä asetus on yleensä pois käytöstä tuotannossa.
permission-filtered-search-result-accurate-count-threshold=權限篩選搜尋結果準確計數門檻值
permission-filtered-search-result-accurate-count-threshold-help=如果搜尋查詢結果低於門檻值，則確保權限篩選器後的搜尋結果的數量是準確的。
permission-terms-limit=權限條款限制
permission-terms-limit-help=Aseta tämä rajoittamaan niiden käyttöoikeuksien hakuehtojen määrää, jotka lisätään hakulausekeeseen. Jos tämä raja ylittyy, ei käyttöoikeuksien hakuehtoja lisätä. Sen sijaan luvan tarkistus putoaa takaisin käyttöoikeuksien hakusuodattimeen.
query-pre-process-configuration-name=索引查詢預處理器
reindex-configuration-name=Uudelleenindeksoi
reindexer-configuration-name=Uudelleenindeksoija
search-engine-helper-configuration-name=Moottoriavustaja
search-permission-checker-configuration-name=權限檢查器
search-query-result-window-limit=搜尋查詢結果的最大數
search-query-result-window-limit-help=Aseta tämä rajoittamaan sitä hakutulosten määrää, jota voidaan pyytää hakukyselystä.
synchronous-execution-override=Synkronisen Suorituksen Ohitus
synchronous-execution-override-help=Arvo "tosi" saa muutettujen entiteettien uudelleenindeksoinnin aina estämään kunnes valmis. Suorituskyvyn vuoksi tämä asetus on yleensä pois käytöstä tuotannossa.
title-field-query-builder-configuration-name=標題欄位查詢建置器