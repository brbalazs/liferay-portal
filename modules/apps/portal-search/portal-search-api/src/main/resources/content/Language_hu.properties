buffered=Pufferelt
buffered-execution-mode=Pufferelt végrehajtási üzemmód
default-keyword-query-configuration-name=預設關鍵字查詢
default-search-result-permission-filter-configuration-name=預設搜尋結果權限篩選
disabled-entry-class-names=Kikapcsolt bejegyzésiosztály-nevek
disabled-entry-class-names-help=Adja meg a beviteli osztály nevét, amelyhez a DefaultKeywordQueryContributor nem tartalmazza a leírás, a felhasználónév és cím mezőket a kulcsszókeresés lekérdezésében.
exact-match-boost=Pontos egyezés fokozása
exact-match-boost-help=Állítsa be az alkalmazni kívánt erősítési értéket, ha a keresési kifejezés pontosan megegyezik egy címmel.
excluded-entry-class-names=不包括條目類別名稱
field-name-patterns=欄位名稱模式
include-inherited-permissions=包括繼承的權限
include-inherited-permissions-help=Állítsa ezt igaz állapotra, hogy a keresési jogosultsági szűrő részeként egy felhasználó örökölt szerepköreit szerepeltesse. Egy felhasználó örökölt szerepkörei tartalmazzák a felhasználói csoportjától és szervezeti tagságától az adott felhasználóhoz rendelt összes felhasználót.
index-commit-immediately=Azonnal elvégezni az indexelést
index-commit-immediately-help=設置此項為True來立即提交搜索索引寫入請求。因為每個寫入請求將迫使搜尋引擎刷新索引閱讀器和可能對刷新磁片事務，所以設置此項為True可能會對搜尋引擎性能帶來負面影響。Portal的預設行為是立即提交個人索引操作（例如，添加部落格、更新部落格）但對批量操作延遲提交（例如，索引所有客戶、索引所有Wiki）直到所有條目發送到搜尋引擎上。設置此項為False，則可能造成像資產出版器等 Widget 延遲回應顯示新添加的內容。例如，用戶使用預設Elasticsearch搜尋引擎時可能會遇到延遲。更多資訊請點擊：https://www.elastic.co/guide/en/elasticsearch/guide/current/near-real-time.html
index-status-manager-configuration-name=Index állapotkezelője
index-writer-helper-configuration-name=Indexelő író súgó
indexer-registry-configuration-name=Index regiszter
indexing-batch-sizes=Indexköteg méretei
indexing-batch-sizes-help=Az indexelésre váró dokumentumok mérete kötegenként a kötegelt indexelést támogató modellek esetében. Az alapértelmezés 10 000. A nagy dokumentumokat tartalmazó modellek esetében az érték csökkentése növelheti a stabilitást a teljes újraindexelés során.
max-buffer-size=Maximális pufferméret
max-expansions=Maximális kibővítések
max-expansions-help=Állítsa be az egyedi címek számát, amelyek egyeztethetők ha a keresési kifejezések előtagként megegyeznek egy címmel.
minimum-buffer-availability-percentage=A minimális elérhető puffer százalékaránya
nonbulk-indexing-override=Nem tömeges indexelés felülírása
nonbulk-indexing-override-help=Egy "igaz" érték azt okozza, hogy a módosított bejegyzések mindig egyenként lesznek indexelve. Teljesítmény-okokból ez a beállítás általában ki van kapcsolva az élesített üzemmódban.
permission-filtered-search-result-accurate-count-threshold=權限篩選搜尋結果準確計數門檻值
permission-filtered-search-result-accurate-count-threshold-help=如果搜尋查詢結果低於門檻值，則確保權限篩選器後的搜尋結果的數量是準確的。
permission-terms-limit=權限條款限制
permission-terms-limit-help=Állítsa be, ha korlátozni kívánja a jogosultságok keresési kifejezéseit, amelyek a keresési lekérdezésbe kerülnek. Ha túllépi ezt a határt, nem kerül be semmilyen jogosultságkeresési kifejezés. Az engedély ellenőrzése visszaállítja az engedélykeresés szűrőjét.
query-pre-process-configuration-name=索引查詢預處理器
reindex-configuration-name=Újraindexelés
reindexer-configuration-name=Újraindexelő
search-engine-helper-configuration-name=Motor súgója
search-permission-checker-configuration-name=權限檢查器
search-query-result-window-limit=搜尋查詢結果的最大數
search-query-result-window-limit-help=Állítsa be, ha korlátozni kívánja a kiadott keresési lekérdezés keresési eredményeit.
synchronous-execution-override=Szinkronizált végrehajtás felülírása
synchronous-execution-override-help=Egy "igaz" érték azt okozza, hogy a módosított bejegyzések újraindexelése a befejezésig zárolva van. Teljesítmény-okokból ez a beállítás általában ki van kapcsolva az élesített üzemmódban.
title-field-query-builder-configuration-name=標題欄位查詢建置器