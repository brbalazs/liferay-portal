disabled-entry-class-names-help=ציין את שמות המחלקה entry עבורם DefaultKeywordQueryContributor לא יכללו את התיאור, שם המשתמש ושדות כותרת כחלק משאילתת חיפוש על פי מילות מפתח.
exact-match-boost=Exact Match Boost
