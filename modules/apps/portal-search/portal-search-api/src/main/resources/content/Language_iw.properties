include-inherited-permissions-help=הגדר כ-true כדי לכלול תפקידי משתמש שעברו בירושה במסגרת סינון הרשאות חיפוש. תפקידי משתמש שעברו בירושה כוללים את כל המשתמשים המוקצים למשתמש מקבוצת המשתמשים שלהם והחברויות בארגונים.
index-commit-immediately=אינדקס Commit באופן מיידי
index-commit-immediately-help=設置此項為True來立即提交搜索索引寫入請求。因為每個寫入請求將迫使搜尋引擎刷新索引閱讀器和可能對刷新磁片事務，所以設置此項為True可能會對搜尋引擎性能帶來負面影響。Portal的預設行為是立即提交個人索引操作（例如，添加部落格、更新部落格）但對批量操作延遲提交（例如，索引所有客戶、索引所有Wiki）直到所有條目發送到搜尋引擎上。設置此項為False，則可能造成像資產出版器等 Widget 延遲回應顯示新添加的內容。例如，用戶使用預設Elasticsearch搜尋引擎時可能會遇到延遲。更多資訊請點擊：https://www.elastic.co/guide/en/elasticsearch/guide/current/near-real-time.html
index-status-manager-configuration-name=מנהל סטטוס האינדקס
index-writer-helper-configuration-name=תוכנת עזר למחבר סדרנים
indexer-registry-configuration-name=רג'יסטרי של אינדקס
indexing-batch-sizes=גודל אצוות מפתוח
indexing-batch-sizes-help=מספר המסמכים למפתוח לכל אצווה עבור סוגי דגמים התומכים במפתוח אצוות. ערך ברירת המחדל הוא 10000. עבור דגמים עם מסמכים גדולים, הקטנת ערך זה עשויה לשפר את היציבות בעת מפתוח מלא מחדש.
max-buffer-size=גודל מאגר מרבי
max-expansions=Maximum Expansions
max-expansions-help=Set the number of unique titles that can be matched when search terms match a title as a phrase prefix.
minimum-buffer-availability-percentage=אחוז זמינות מאגר מינימלית
nonbulk-indexing-override=Nonbulk Indexing Override
nonbulk-indexing-override-help=A value of "true" causes modified entities to always be reindexed one by one. For performance reasons, this setting is generally turned off in production.
permission-filtered-search-result-accurate-count-threshold=權限篩選搜尋結果準確計數門檻值
permission-filtered-search-result-accurate-count-threshold-help=如果搜尋查詢結果低於門檻值，則確保權限篩選器後的搜尋結果的數量是準確的。
permission-terms-limit=權限條款限制
permission-terms-limit-help=הגדר זאת כדי להגביל את מספר מונחי חיפוש ההרשאות אשר יתווספו לשאילתת החיפוש. אם יש חריגה ממגבלה זו, לא יתווספו מונחי חיפוש הרשאות. במקום זאת, הבדיקות תשובנה להיות בהתאם למסנן ההרשאות של החיפוש.
query-pre-process-configuration-name=索引查詢預處理器
