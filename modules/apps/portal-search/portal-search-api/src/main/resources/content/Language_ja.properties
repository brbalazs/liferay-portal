buffered=バッファ
buffered-execution-mode=バッファー実行モード
default-keyword-query-configuration-name=預設關鍵字查詢
default-search-result-permission-filter-configuration-name=預設搜尋結果權限篩選
disabled-entry-class-names=エントリークラス名は無効
disabled-entry-class-names-help=DescriptionとuserNameとtitle フィールドを検索クエリ内に含まないDefaultKeywordQueryContributorの、クラス名を指定してください。
exact-match-boost=完全一致の上位表示
exact-match-boost-help=検索語がタイトルに完全一致するときに適用するブースト値を指定します。
excluded-entry-class-names=不包括條目類別名稱
field-name-patterns=欄位名稱模式
include-inherited-permissions=包括繼承的權限
include-inherited-permissions-help=これをTrueに設定すると、検索権限フィルターに、ユーザーが継承しているロールを含みます。ユーザーが継承しているロールは、ユーザーグループ、組織のメンバーシップも含みます。
index-commit-immediately=ただちにコミットをインデックスする
index-commit-immediately-help=設置此項為True來立即提交搜索索引寫入請求。因為每個寫入請求將迫使搜尋引擎刷新索引閱讀器和可能對刷新磁片事務，所以設置此項為True可能會對搜尋引擎性能帶來負面影響。Portal的預設行為是立即提交個人索引操作（例如，添加部落格、更新部落格）但對批量操作延遲提交（例如，索引所有客戶、索引所有Wiki）直到所有條目發送到搜尋引擎上。設置此項為False，則可能造成像資產出版器等 Widget 延遲回應顯示新添加的內容。例如，用戶使用預設Elasticsearch搜尋引擎時可能會遇到延遲。更多資訊請點擊：https://www.elastic.co/guide/en/elasticsearch/guide/current/near-real-time.html
index-status-manager-configuration-name=インデックス・ステータス・マネージャー
index-writer-helper-configuration-name=インデックス書き込みヘルパー
indexer-registry-configuration-name=インデックス・レジストリ
indexing-batch-sizes=インデックス化バッチサイズ
indexing-batch-sizes-help=バッチのインデックス化をサポートするモデルタイプで、バッチごとにインデックス化するドキュメントの数です。デフォルトは 10000 です。大きなドキュメントのあるモデルでは、この値を減らすとインデックスを完全に再構築する際の安定性が向上します。
max-buffer-size=最大バッファサイズ
max-expansions=最大拡張
max-expansions-help=検索語がタイトルに前方一致するときに一致可能な重複しないタイトルの数を指定します。
minimum-buffer-availability-percentage=バッファー利用サイズの最小パーセンテージ
nonbulk-indexing-override=少量インデックス作成の上書き
nonbulk-indexing-override-help=「true」の値により、各変更されたエンティティのインデックスが常に再作成されます。パフォーマンスに影響するため、本番環境ではこの機能を無効にします。
permission-filtered-search-result-accurate-count-threshold=權限篩選搜尋結果準確計數門檻值
permission-filtered-search-result-accurate-count-threshold-help=如果搜尋查詢結果低於門檻值，則確保權限篩選器後的搜尋結果的數量是準確的。
permission-terms-limit=權限條款限制
permission-terms-limit-help=検索クエリに追加される、検索パーミッションタームの数を制限に設定します。この制限を超えた場合、検索パーミッションタームは追加されません。代わりに、検索パーミッションフィルターのチェックにフォールバックします。
query-pre-process-configuration-name=索引查詢預處理器
reindex-configuration-name=インデックスの再構築
reindexer-configuration-name=リインデックサー
search-engine-helper-configuration-name=エンジンヘルパー
search-permission-checker-configuration-name=權限檢查器
search-query-result-window-limit=搜尋查詢結果的最大數
search-query-result-window-limit-help=検索クエリの検索結果数の最大数を指定してください
synchronous-execution-override=同期的実行の上書き
synchronous-execution-override-help=「true」の値により、各変更されたエンティティのインデックスの再構築は終わるまで常にブロックします。パフォーマンスに影響するため、本番環境ではこの機能を無効にします。
title-field-query-builder-configuration-name=標題欄位查詢建置器