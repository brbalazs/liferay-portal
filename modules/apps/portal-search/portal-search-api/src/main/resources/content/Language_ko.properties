buffered=버퍼됨
buffered-execution-mode=버퍼 실행 모드
default-keyword-query-configuration-name=기본 키워드 질의
default-search-result-permission-filter-configuration-name=기본 검색 결과 권한 필터
disabled-entry-class-names=비활성 엔트리 클래스 이름
disabled-entry-class-names-help=DefaultKeywordQueryContributor가 키워드 검색 조회의 일부로 설명, 사용자 이름 및 제목 필드를 포함하지 않을 항목 클래스 이름을 지정하십시오.
exact-match-boost=정확한 매칭 부스트
exact-match-boost-help=검색어가 정확한 구문으로 제목과 일치할 때 적용할 부스트 값을 설정합니다.
excluded-entry-class-names=제외된 엔트리 클래스 이름
field-name-patterns=필드 이름 패턴
include-inherited-permissions=상속된 사용 권한 포함
include-inherited-permissions-help=검색 권한 필터링의 일부로 사용자의 상속된 역할을 포함하려면 이를 true로 설정하십시오. 사용자의 상속된 역할에는 사용자 그룹 및 조직 멤버십에서 사용자에게 할당된 모든 사용자가 포함됩니다.
index-commit-immediately=인덱스 즉시 커밋
index-commit-immediately-help=검색 인덱스 쓰기 요청을 즉시 커밋하려면 이를 true로 설정합니다. 이를 true로 설정하면 각 쓰기 요청이 검색 엔진에서 색인 판독기를 새로 고치고 잠재적으로 트랜잭션을 디스크로 플러시하기 때문에 검색 엔진 성능에 부정적인 영향을 미칠 수 있습니다. 포털의 기본 동작은 개별 색인 작업(예: 블로그 추가, 블로그 업데이트)에 대해 즉시 커밋하지만 모든 항목이 검색 엔진에 전송될 때까지 대량 작업(예: 모든 사용자 색인, 모든 Wiki 색인)에 대한 커밋을 지연하는 것입니다. 이를 false로 설정하면 새로 추가된 콘텐츠를 표시할 때 Asset Publisher와 같은 위젯이 지연된 응답을 나타낼 수 있습니다. 예를 들어 사용자는 기본 Elasticsearch 검색 엔진에서 지연을 경험할 수 있습니다. 자세한 내용은 https://www.elastic.co/guide/en/elasticsearch/guide/current/near-real-time.html을 참조하세요.
index-status-manager-configuration-name=인덱스 상태 관리자
index-writer-helper-configuration-name=Indexer Writer Helper
indexer-registry-configuration-name=인덱스 레지스트리
indexing-batch-sizes=인덱싱 배치 크기
indexing-batch-sizes-help=배치 인덱싱을 지원하는 모델 유형에 대해 배치당 인덱싱할 문서 수입니다. 기본값은 10000입니다. 큰 문서가 있는 모델의 경우 이 값을 줄이면 전체 재색인을 실행할 때 안정성이 향상될 수 있습니다.
max-buffer-size=최대 버퍼 크기
max-expansions=최대 확장
max-expansions-help=검색어가 제목과 일치할 때 일치시킬 수 있는 고유한 제목의 수를 구문 접두어로 설정합니다.
minimum-buffer-availability-percentage=최소 버퍼 가용성 백분율
nonbulk-indexing-override=대량이 아닌 인덱싱 재정의
nonbulk-indexing-override-help=true 값을 지정하면 수정된 도면요소가 항상 하나씩 다시 인덱싱됩니다. 성능상의 이유로 이 설정은 일반적으로 운영 환경에서 해제됩니다.
permission-filtered-search-result-accurate-count-threshold=권한 필터링된 검색 결과 정확한 수 임계값 (Automatic Translation)
permission-filtered-search-result-accurate-count-threshold-help=검색 쿼리가 이 임계값 내에 있는 개수로 검색 결과를 반환하면 권한 필터링 후총 수가 정확하다고 보장됩니다. (Automatic Translation)
permission-terms-limit=권한 조건 제한 (Automatic Translation)
permission-terms-limit-help=이 설정은 검색 쿼리에 추가될 권한 검색 어정문의 수를 제한하도록 설정합니다. 이 제한을 초과하면 권한 검색 어가 추가되지 않습니다. 대신 사용 권한 확인이 검색 권한 필터로 돌아갑니다. (Automatic Translation)
query-pre-process-configuration-name=인덱스 쿼리 사전 프로세서 (Automatic Translation)
reindex-configuration-name=신호
reindexer-configuration-name=재인덱서 (Automatic Translation)
search-engine-helper-configuration-name=엔진 도우미 (Automatic Translation)
search-permission-checker-configuration-name=권한 검사기 (Automatic Translation)
search-query-result-window-limit=검색 쿼리 결과 창 제한 (Automatic Translation)
search-query-result-window-limit-help=이 설정은 검색 쿼리에서 요청할 수 있는 검색 결과의 수를 제한하도록 설정합니다. (Automatic Translation)
synchronous-execution-override=동기 실행 재정의 (Automatic Translation)
synchronous-execution-override-help="true"의 값으로 인해 수정된 엔터티의 다시 인덱싱이 완료될 때까지 항상 차단됩니다. 성능상의 이유로 이 설정은 일반적으로 프로덕션 환경에서 꺼져 있습니다. (Automatic Translation)
title-field-query-builder-configuration-name=제목 필드 쿼리 빌더 (Automatic Translation)