buffered=Gebufferd
buffered-execution-mode=Gebufferde uitvoeringsmodus
default-keyword-query-configuration-name=預設關鍵字查詢
default-search-result-permission-filter-configuration-name=預設搜尋結果權限篩選
disabled-entry-class-names=Klassenamen invoer uitgeschakeld
disabled-entry-class-names-help=Geef de invoerklassenamen op waarvoor DefaultKeywordQueryContributor geen beschrijving, gebruikersnaam en titelvelden zal opnemen als onderdeel van de query voor het zoeken naar sleutelwoorden.
exact-match-boost=Exacte-overeenstemmingsboost
exact-match-boost-help=Stel de toe te passen boostwaarde in wanneer zoektermen overeenstemmen met een titel als exacte zin.
excluded-entry-class-names=不包括條目類別名稱
field-name-patterns=欄位名稱模式
include-inherited-permissions=包括繼承的權限
include-inherited-permissions-help=Stel dit in op juist om de geërfde rollen van een gebruiker als onderdeel van het filteren van zoekpermissies op te nemen. Tot de geërfde rollen van een gebruiker behoren alle gebruikers die aan een gebruiker toegewezen zijn vanuit het lidmaatschap van hun gebruikersgebruik of organisatie.
index-commit-immediately=Index Onmiddellijk toewijzen
index-commit-immediately-help=設置此項為True來立即提交搜索索引寫入請求。因為每個寫入請求將迫使搜尋引擎刷新索引閱讀器和可能對刷新磁片事務，所以設置此項為True可能會對搜尋引擎性能帶來負面影響。Portal的預設行為是立即提交個人索引操作（例如，添加部落格、更新部落格）但對批量操作延遲提交（例如，索引所有客戶、索引所有Wiki）直到所有條目發送到搜尋引擎上。設置此項為False，則可能造成像資產出版器等 Widget 延遲回應顯示新添加的內容。例如，用戶使用預設Elasticsearch搜尋引擎時可能會遇到延遲。更多資訊請點擊：https://www.elastic.co/guide/en/elasticsearch/guide/current/near-real-time.html
index-status-manager-configuration-name=Index Statusmanager
index-writer-helper-configuration-name=Indexeerder schrijver hulpmiddel
indexer-registry-configuration-name=Indexregister
indexing-batch-sizes=Batchgrootte voor indexering
indexing-batch-sizes-help=Het aantal te indexeren documenten per batch voor modeltypes die batchindexering ondersteunen. De standaardwaarde is 10.000. Voor modellen met grote documenten kan een lagere waarde de stabiliteit ten goede komen bij een volledige herindexering.
max-buffer-size=Maximale buffergrootte
max-expansions=Maximale expansies
max-expansions-help=Stel het aantal unieke titels in voor overeenstemming wanneer zoektermen overeenstemmen met een titel als prefix van een zin.
minimum-buffer-availability-percentage=Minimaal percentage voor bufferschikbaarheid
nonbulk-indexing-override=Niet-bulk indexering negeren
nonbulk-indexing-override-help=De waarde "waar" zorgt er altijd voor dat gewijzigde entiteiten één per één opnieuw worden geïndexeerd. Omwille van de prestaties is deze instelling meestal uitgeschakeld in productie.
permission-filtered-search-result-accurate-count-threshold=權限篩選搜尋結果準確計數門檻值
permission-filtered-search-result-accurate-count-threshold-help=如果搜尋查詢結果低於門檻值，則確保權限篩選器後的搜尋結果的數量是準確的。
permission-terms-limit=權限條款限制
permission-terms-limit-help=Stel dit in om het aantal zoektermen voor machtigingen te beperken dat toegevoegd zal worden aan de zoekquery. Bij overschrijding van deze limiet worden geen zoektermen voor machtigingen toegevoegd. De machtigingcontrole zal in dat geval gebruikmaken van de filter 'machtiging zoeken'.
query-pre-process-configuration-name=索引查詢預處理器
reindex-configuration-name=Herindexeren
reindexer-configuration-name=Herindexeerder
search-engine-helper-configuration-name=Helper zoekmachine
search-permission-checker-configuration-name=權限檢查器
search-query-result-window-limit=搜尋查詢結果的最大數
search-query-result-window-limit-help=Stel dit in om het aantal zoekresultaten te beperken dat kan opgevraagd worden van een zoekquery.
synchronous-execution-override=Synchrone uitvoering negeren
synchronous-execution-override-help=De waarde "waar" zorgt er altijd voor dat herindexering van gewijzigde entiteiten wordt geblokkeerd tot aan de voltooiing. Omwille van de prestaties is deze instelling meestal uitgeschakeld in productie.
title-field-query-builder-configuration-name=標題欄位查詢建置器