buffered=Buffrad
buffered-execution-mode=Buffrat körningsläge
default-keyword-query-configuration-name=預設關鍵字查詢
default-search-result-permission-filter-configuration-name=預設搜尋結果權限篩選
disabled-entry-class-names=Inaktiverade klassnamn för poster
disabled-entry-class-names-help=Ange klassnamn för inmatningar som DefaultKeywordQueryContributor inte inkluderar i beskrivningen, användarnamnet och titelfältet som en del av nyckelordsfrågan.
exact-match-boost=Boosta exakt matchning
exact-match-boost-help=Ställ in det förstärkta värdet som ska användas när söktermer matchar en titel som en exakt fras.
excluded-entry-class-names=不包括條目類別名稱
field-name-patterns=欄位名稱模式
include-inherited-permissions=包括繼承的權限
include-inherited-permissions-help=Ange detta som sant för att inkludera en användares ärvda roller som del av filtrering av sökbehörigheter. En användares ärvda roller inkluderar alla användare som tilldelats till en användare från deras användargrupp och organisationsmedlemskap.
index-commit-immediately=Utför indexering direkt
index-commit-immediately-help=設置此項為True來立即提交搜索索引寫入請求。因為每個寫入請求將迫使搜尋引擎刷新索引閱讀器和可能對刷新磁片事務，所以設置此項為True可能會對搜尋引擎性能帶來負面影響。Portal的預設行為是立即提交個人索引操作（例如，添加部落格、更新部落格）但對批量操作延遲提交（例如，索引所有客戶、索引所有Wiki）直到所有條目發送到搜尋引擎上。設置此項為False，則可能造成像資產出版器等 Widget 延遲回應顯示新添加的內容。例如，用戶使用預設Elasticsearch搜尋引擎時可能會遇到延遲。更多資訊請點擊：https://www.elastic.co/guide/en/elasticsearch/guide/current/near-real-time.html
index-status-manager-configuration-name=Hanterare för indexstatus
index-writer-helper-configuration-name=Hjälp för indexerare
indexer-registry-configuration-name=Index-register
indexing-batch-sizes=Indexerar batchstorlekar
indexing-batch-sizes-help=Antal dokument att indexera per batch för modelltyper som stöder batchindexering. Standardvärdet är 10000. För modeller med större dokument kan stabiliteten förbättras när full omindexering genomförs genom att minska det här värdet.
max-buffer-size=Maximal buffertstorlek
max-expansions=Maximala uttryck
max-expansions-help=Ställ in antalet unika titlar som kan matchas när söktermer matchar en titel som frasprefix.
minimum-buffer-availability-percentage=Minsta procent för bufferttillgänglighet
nonbulk-indexing-override=Åsidosätt icke-massindexering
nonbulk-indexing-override-help=Värdet "sant" gör att modifierade enheter alltid omindexeras en åt gången. Av prestandaskäl stängs den här inställningen vanligtvis av i produktion.
permission-filtered-search-result-accurate-count-threshold=權限篩選搜尋結果準確計數門檻值
permission-filtered-search-result-accurate-count-threshold-help=如果搜尋查詢結果低於門檻值，則確保權限篩選器後的搜尋結果的數量是準確的。
permission-terms-limit=權限條款限制
permission-terms-limit-help=Ange detta för att begränsa antalet söktermer för behörighet som läggs till i sökfrågan. Om den här gränsen överskrids läggs inga söktermer för behörighet till. Istället återgår behörighetskontroll till filtret för sökbehörighet.
query-pre-process-configuration-name=索引查詢預處理器
reindex-configuration-name=Indexera om
reindexer-configuration-name=Omindexering
search-engine-helper-configuration-name=Motorhjälp
search-permission-checker-configuration-name=權限檢查器
search-query-result-window-limit=搜尋查詢結果的最大數
search-query-result-window-limit-help=Ange detta som gräns för antalet sökresultat som kan begäras från en sökfråga.
synchronous-execution-override=Åsidosätt synkront utförande
synchronous-execution-override-help=Värdet "sant" gör att omindexering av modifierade enheter alltid blockeras tills slutförande. Av prestandaskäl stängs den här inställningen vanligtvis av i produktion.
title-field-query-builder-configuration-name=標題欄位查詢建置器