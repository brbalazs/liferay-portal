buffered=缓冲器
buffered-execution-mode=缓冲执行模式
default-keyword-query-configuration-name=預設關鍵字查詢
default-search-result-permission-filter-configuration-name=預設搜尋結果權限篩選
disabled-entry-class-names=禁用的条目类名称
disabled-entry-class-names-help=指定DefaultKeywordQueryContributor将不包含说明、用户名和标题字段作为关键字搜索查询的一部分的条目类名称。
exact-match-boost=精确匹配提升
exact-match-boost-help=设置在搜索词作为精确短语与标题匹配时要应用的提升值。
excluded-entry-class-names=不包括條目類別名稱
field-name-patterns=欄位名稱模式
include-inherited-permissions=包括繼承的權限
include-inherited-permissions-help=设置此为真。包括用户继承的角色作为搜索权限过滤的一部分。用户继承的角色包括从其用户组和组织成员分配给用户的所有用户。
index-commit-immediately=立刻提交索引
index-commit-immediately-help=設置此項為True來立即提交搜索索引寫入請求。因為每個寫入請求將迫使搜尋引擎刷新索引閱讀器和可能對刷新磁片事務，所以設置此項為True可能會對搜尋引擎性能帶來負面影響。Portal的預設行為是立即提交個人索引操作（例如，添加部落格、更新部落格）但對批量操作延遲提交（例如，索引所有客戶、索引所有Wiki）直到所有條目發送到搜尋引擎上。設置此項為False，則可能造成像資產出版器等 Widget 延遲回應顯示新添加的內容。例如，用戶使用預設Elasticsearch搜尋引擎時可能會遇到延遲。更多資訊請點擊：https://www.elastic.co/guide/en/elasticsearch/guide/current/near-real-time.html
index-status-manager-configuration-name=索引状态管理器
index-writer-helper-configuration-name=索引写入帮助
indexer-registry-configuration-name=索引注册表
indexing-batch-sizes=索引批处理大小
indexing-batch-sizes-help=每个批次要为支持批处理索引的模型类型编制索引的文档数量。默认为 10000。对于具有大文档的模型，减小此值可以提高执行完整重新索引时的稳定性。
max-buffer-size=最大缓冲器大小
max-expansions=最大扩展
max-expansions-help=设置在搜索词作为短语前缀与标题匹配时可以匹配的唯一标题数量。
minimum-buffer-availability-percentage=最大缓冲器可用性百分比
nonbulk-indexing-override=非批量索引重写
nonbulk-indexing-override-help=值"true"会使修改的实体始终逐个重新索引。出于性能原因，此设置在生产环境中通常处于关闭状态。
permission-filtered-search-result-accurate-count-threshold=權限篩選搜尋結果準確計數門檻值
permission-filtered-search-result-accurate-count-threshold-help=如果搜尋查詢結果低於門檻值，則確保權限篩選器後的搜尋結果的數量是準確的。
permission-terms-limit=權限條款限制
permission-terms-limit-help=将限制设置为添加到搜索查询的搜索许可条款的数量。如果超过此限制，则不会添加权限搜索条款。相反，权限检查将会回到搜索权限筛选器。
query-pre-process-configuration-name=索引查詢預處理器
reindex-configuration-name=重新索引
reindexer-configuration-name=重新索引器
search-engine-helper-configuration-name=引擎帮助程序
search-permission-checker-configuration-name=權限檢查器
search-query-result-window-limit=搜尋查詢結果的最大數
search-query-result-window-limit-help=设置此项，限制指定搜索查询的搜索结果数量。
synchronous-execution-override=同步执行重写
synchronous-execution-override-help=值"true"会使修改实体的重新索引在完成之前始终处于屏蔽状态。出于性能原因，此设置在生产环境中通常处于关闭状态。
title-field-query-builder-configuration-name=標題欄位查詢建置器