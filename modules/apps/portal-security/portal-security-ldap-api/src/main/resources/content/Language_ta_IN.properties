authentication-search-filter-help=பயனரின் validity-யை சோதிக்க பயன்படும் search filter-ஐ உள்ளிடவும். இந்த டோக்கன்கள் @company_id@, @email_address@, @screen_name@, and @user_id@ சரியான மதிப்புகளுடன் ரன் டைமில் மாற்றப்படுகின்றன.
autogenerate-user-password=自動產生使用者密碼
base-dn-help=Base DN பயனர்களுக்கான ஆரம்ப search context-ஐக் குறிப்பிடுகிறது மற்றும் இது கட்டாயமில்லை.
connection-properties=Connection Properties
contact-custom-mappings=Contact Custom Mappings
contact-custom-mappings-help=பயனர்களை Import and Export செய்யும்போது, ​​LDAP பயனர் attributes-களை மற்றும் போர்ட்டல் contact's custom attributes களை இணைக்க, போர்ட்டல் இந்த mapping-ஐப் பயன்படுத்தும்.
contact-mappings=Contact Mappings
contact-mappings-help=பயனர்களை Import and Export செய்யும்போது, ​​LDAP பயனர் attributes-களை மற்றும் போர்ட்டல் contact's attributes களை இணைக்க, போர்ட்டல் இந்த mapping-ஐப் பயன்படுத்தும்.
