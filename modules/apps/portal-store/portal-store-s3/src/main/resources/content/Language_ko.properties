access-key=액세스 키
access-key-help=AWS 계정 액세스 키를 입력하십시오.
bucket-name=부켓 이름
bucket-name-help=파일을 저장하기 위해 S3에서 사용하는 부켓 이름을 설정하십시오.
cache-dir-clean-up-expunge=캐시 디렉터리 정리
cache-dir-clean-up-expunge-help=파일이 캐시에 저장되는 일수를 설정합니다.
cache-dir-clean-up-frequency=캐시 디렉터리 정리 빈도
cache-dir-clean-up-frequency-help=파일 캐시 정리 방법에 대한 호출 횟수와 실제 파일 캐시 정리 사이의 비율을 설정합니다. 항상 정리하려면 이 속성을 1로 설정하십시오. 숫자가 높을수록 빈도가 낮아집니다.
connection-protocol=연결 프로토콜
connection-protocol-help=S3(HTTP 또는 HTTPS)에 연결하는 데 사용되는 프로토콜을 설정합니다.
connection-timeout=연결 타임아웃
connection-timeout-help=타임아웃 되기 전에 처음 연결을 설정할 때 대기할 시간(밀리초)을 설정합니다. 값 0은 무한대를 의미하므로 권장하지 않습니다.
core-pool-size=코어 풀 사이즈
core-pool-size-help=부분을 업로드하는 데 사용되는 초기 스레드 수를 설정합니다.
http-client-max-connections=최대 HTTP 연결 수
http-client-max-connections-help=열려 있는 HTTP 연결의 최대 수를 설정합니다.
http-client-max-error-retry=최대 HTTP 재시도 횟수
http-client-max-error-retry-help=실패한 재시도 가능한 요청에 대한 최대 재시도 횟수를 설정합니다.
max-pool-size=최대 풀 크기
max-pool-size-help=부품을 업로드할 때 사용할 최대 스레드 수를 설정합니다.
minimum-uploads-part-size=최소 부품 크기
minimum-uploads-part-size-help=업로드 파트의 최소 파트 크기를 설정합니다. 최소 부분 크기를 줄이면 멀티파트 업로드가 더 많은 수의 더 작은 부분으로 분할됩니다. 이 값을 너무 낮게 설정하면 전송 속도에 부정적인 영향을 미쳐 각 부분에 대한 추가 대기 시간 및 네트워크 통신이 발생합니다.
multipart-upload-threshold=다중 부품 업로드 임계값
multipart-upload-threshold-help=멀티파트 업로드를 사용할 때 크기 임계값(바이트)을 설정합니다. 이 크기를 초과하는 업로드는 자동으로 멀티파트 업로드 전략을 사용하는 반면 이 임계값보다 작은 업로드는 단일 연결을 사용하여 전체 개체를 업로드합니다.
ntlm-proxy-domain=NTLM 프록시 도메인
ntlm-proxy-domain-help=NTLM 프록시의 Windows 도메인 이름을 설정합니다. Windows NTLM 프록시를 사용하지 않는 경우 이 속성을 설정하지 마십시오.
ntlm-proxy-workstation=NTLM 프록시 워크스테이션
ntlm-proxy-workstation-help=NTLM 프록시에 대한 Windows 워크스테이션 이름을 설정합니다. Windows NTLM 프록시를 사용하지 않는 경우 이 속성을 설정하지 마십시오.
proxy-auth-type=프록시 인증 유형 (Automatic Translation)
proxy-auth-type-help=S3 서비스에 연결할 때 사용할 프록시 인증 유형을 설정합니다. "없음"은 프록시를 구성하지 않습니다. "사용자 이름 암호"는 프록시를 구성합니다. 이 구성의 경우 프록시 사용자 이름 및 프록시 암호에 대한 값을 지정합니다. "Ntlm"은 Windows NTLM 프록시를 구성합니다. 이 구성의 경우 프록시 사용자 이름, 프록시 암호, NTLM 프록시 도메인 및 NTLM 프록시 워크스테이션에 대한 값을 지정합니다. (Automatic Translation)
proxy-host-help=클라이언트가 연결하는 데 사용하는 프록시 호스트를 설정합니다. (Automatic Translation)
proxy-password=프록시 암호 (Automatic Translation)
proxy-password-help=프록시를 통해 연결하는 경우 사용할 프록시 암호를 설정합니다. (Automatic Translation)
proxy-port-help=클라이언트가 연결하는 데 사용하는 프록시 포트를 설정합니다. (Automatic Translation)
proxy-username=프록시 사용자 이름 (Automatic Translation)
proxy-username-help=프록시를 통해 연결하는 경우 사용할 프록시 사용자 이름을 설정합니다. (Automatic Translation)
s3-endpoint=S3 Endpoint (Automatic Copy)
s3-endpoint-help=Set the default endpoint to use to connect to S3. (Automatic Copy)
s3-pathstyle=Use Path-Style (Automatic Copy)
s3-pathstyle-help=Use path-style access for all requests. (Automatic Copy)
s3-region=S3 리전 (Automatic Translation)
s3-region-help=Amazon S3가 사용자가 만든 버킷을 저장하는 지리적 영역을 나타내는 Amazon S3 리전을 설정합니다. Amazon S3 지역은 대기 시간을 최적화하고 비용을 최소화하며 규제 요구 사항을 해결하는 데 사용됩니다. Amazon S3 리전에 저장된 개체는 명시적으로 다른 지역으로 전송되지 않는 한 해당 지역을 떠나지 않습니다. (Automatic Translation)
s3-storage-class=S3 스토리지 클래스 (Automatic Translation)
s3-storage-class-help=Amazon S3 스토리지 클래스를 설정합니다. STANDARD 저장소 클래스는 기본적으로 사용되며 중복된 데이터 복사본이 다른 위치에 저장됨을 의미합니다. REDUCED_REDUNDANCY 스토리지 클래스는 중요하지 않은 재현 가능한 데이터를 저장하여 저비용 고가용성 스토리지 옵션을 제공하기 위한 것입니다. 그러나 이 옵션은 중복이 적습니다. (Automatic Translation)
s3-store-configuration-name=S3 스토어 (Automatic Translation)
secret-key=비밀 키 (Automatic Translation)
secret-key-help=AWS 계정 비밀 키를 설정합니다. (Automatic Translation)
signer-override=Signer Override (Automatic Copy)
signer-override-help=Set the name of the signature algorithm to use for signing requests. (Automatic Copy)