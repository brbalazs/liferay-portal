application-permissions=Permissões da Aplicação
application-permissions-help=Estas permissões definem quais ações podem ser executadas nesta aplicação. Isso inclui ações que todas as aplicações têm, como Adicionar à Página e Visualizar, assim como ações específicas de aplicações.
are-you-sure-you-want-to-delete-this-role=Tem certeza que deseja excluir esta função? Ela será excluído imediatamente. Se for uma função de revisor, suas atribuições de tarefa serão excluídas com ela.
