general-permissions=Permissões Gerais
general-permissions-help=Essas permissões definem quais ações podem ser executadas para todas as aplicações nesta seção, como suas configurações, se eles podem ser vistos, acessados ​​no painel de controle e administração do site, e muito mais.
javax.portlet.description.com_liferay_roles_admin_web_portlet_RolesAdminPortlet=Papéis são agrupamentos de usuários que compartilham uma função específica dentro do portal, de acordo com um escopo específico. Você pode adicionar papéis que podem ter permissões para várias funções dentro de aplicativos de portlet.
javax.portlet.title.com_liferay_roles_admin_web_portlet_RolesAdminPortlet=Funções
key-field-help=Fornecer um identificador exclusivo para esta função que possa ser usado para consultá-la programaticamente. Se for uma função nova, o valor será preenchido automaticamente pelo título dado, mas também pode ser dado manualmente.
