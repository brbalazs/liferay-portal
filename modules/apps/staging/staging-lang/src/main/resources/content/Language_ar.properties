staged-applications-alert=عندما يتم تحديد تطبيق، يتم نسخ بياناته إلى التجهيز ومن الممكن تحريره مباشرة عند البث المباشر. وعند إلغاء تحديد تطبيق، تأكد من نشر أي تغييرات تم إجراؤها أثناء التجهيز أولاً، وإلا فقد يتم فقدها.
staged-applications-help=يتم تقسيم التطبيقات المحددة بأنها مجهزة. وهذا يعني أن بياناتها يتم نشرها تلقائيًا كلما تم نشر صفحة تحتوي عليها. ويتم دائمًا تصدير التطبيقات التي يتم تعطيلها وتحديدها تلقائيًا، حتى إذا لم تكن موجودة في الصفحة. ولا يتم نشر المقالات التي تم تعطيلها أو عدم تحديدها تلقائيًا. ويتم استبعاد التطبيقات التعاونية، مثل المدونات ولوحات الرسائل وويكي </em>من حالة كونها مجهزة بشكل افتراضي نظرًا لأن البيانات الخاصة بها تبدأ في البث. وبشكل فعّال، عندما لا يتم تجهيز تطبيق للبث، فلا تحتوي بيئة البث المباشر إلا على البيانات الهامة فقط. وعند استخدام تجهيز البث المحلي، يتم عرض نفس البيانات عند عرض التطبيق من أي بيئة.
