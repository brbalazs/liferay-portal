staged-applications-help=チェックマークがついているアプリケーションはステージングされています。それらのアプリケーションを含むページが公開されると、自動的にそれらのデータも公開されることを意味しています。無効で、チェックマークがついているアプリケーションは、ページに配置されていなくても自動的に毎回エクスポートされます。無効で、チェックマークがついてないアプリケーションは、自動では公開されません。<em>ブログや掲示板、Wiki</em>といったコラボレーションポートレットは、それらのデータが本番環境に基づくものなので、ステージング環境からはデフォルトで除外されます。アプリケーションがステージングされていない時は、本番環境は重要なデータのみ保持していることになります。ローカル公開ステージングを利用している場合、他の環境からアプリケーションを見たとしても、同じデータが表示されます。
