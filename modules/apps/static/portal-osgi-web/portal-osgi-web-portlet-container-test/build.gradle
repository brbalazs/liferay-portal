copyLibs {
	enabled = true
}

dependencies {
	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.impl", version: "default"
	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.kernel", version: "default"
	compileOnly group: "com.liferay.portal", name: "com.liferay.util.java", version: "default"
	compileOnly group: "com.liferay.portal", name: "com.liferay.util.taglib", version: "default"
	compileOnly project(":apps:dynamic-data-mapping:dynamic-data-mapping-taglib")
	compileOnly project(":apps:petra:petra-encryptor")
	compileOnly project(":core:petra:petra-lang")
	compileOnly project(":core:petra:petra-string")

	testIntegrationImplementation group: "com.liferay", name: "com.liferay.arquillian.extension.junit.bridge", version: "1.0.19"
	testIntegrationImplementation group: "javax.portlet", name: "portlet-api", version: "3.0.0"
	testIntegrationImplementation group: "javax.servlet", name: "javax.servlet-api", version: "3.0.1"
	testIntegrationImplementation group: "org.osgi", name: "org.osgi.service.component.annotations", version: "1.3.0"
	testIntegrationImplementation group: "org.osgi", name: "osgi.core", version: "6.0.0"
	testIntegrationImplementation group: "org.springframework", name: "spring-web", version: "4.1.9.RELEASE"
	testIntegrationImplementation project(":apps:upload:upload-api")
}