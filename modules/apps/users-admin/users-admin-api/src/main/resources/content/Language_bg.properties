organizations-types-help=Задайте този JSON обект да променяте типовете организации. Добавяне на ново свойство на обекта JSON за създаване на нов тип организация. (Automatic Translation)
use-initials-for-default-user-portrait=Използвай инициали за портрет по подразбиране на потребителя (Automatic Translation)
use-initials-for-default-user-portrait-help=Задайте това на true, за да използвате потребителските инициали като потребителски портрет по подразбиране. В противен случай ще се използват файловете с портретни изображения по подразбиране. Пътят по подразбиране за портретно изображение може да се зададе чрез свойствата "image.default.user.male.portrait" и "image.default.user.female.portrait" в портала.свойства. (Automatic Translation)
user-file-uploads-configuration-name=Потребителски изображения (Automatic Translation)
users-image-check-token-help=Задайте това на true, за да проверите маркера на изображението, преди да го покажете. (Automatic Translation)
users-image-maximum-file-size-help=Задайте максималния размер на файла за портрети на потребителя. Стойност 0 за максималния размер на файла може да се използва за обозначаване на неограничен размер на файла. Обаче максималният размер на файла е зададен в свойството "com.liferay.portal.uploadServletRequestImpl.max.size". (Automatic Translation)
users-image-maximum-height-help=Задаване на максимална височина на портрета на потребителя в пиксели. Стойност 0 показва никакви ограничения за потребителски портретни размери. (Automatic Translation)
users-image-maximum-width-help=Задаване на максимална ширина на портрета на потребителя в пиксели. Стойност 0 показва никакви ограничения за потребителски портретни размери. (Automatic Translation)