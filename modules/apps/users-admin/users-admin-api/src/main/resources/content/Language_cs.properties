use-initials-for-default-user-portrait=Použít iniciály pro výchozí portrét uživatele (Automatic Translation)
use-initials-for-default-user-portrait-help=Nastavte tuto hodnotu na hodnotu true, aby se iniciály uživatele používaly jako výchozí portrét uživatele. V opačném případě budou použity výchozí soubory obrázků na výšku. Výchozí cestu k obrázku na výšku lze nastavit pomocí vlastností "image.default.user.male.portrait" a "image.default.user.female.portrait" v portal.properties. (Automatic Translation)
