users-image-check-token-help=Nastavte tuto hodnotu na hodnotu true, abyste před zobrazením zkontrolovali token obrázku. (Automatic Translation)
users-image-maximum-file-size-help=Nastavte maximální velikost souboru pro portréty uživatelů. Hodnota 0 pro maximální velikost souboru může být použita k označení neomezené velikosti souboru. Maximální povolená velikost souboru je však nastavena ve vlastnosti "com.liferay.portal.upload.UploadServletRequestImpl.max.size". (Automatic Translation)
users-image-maximum-height-help=Nastavte maximální výšku na výšku na výšku uživatele v pixelech. Hodnota 0 označuje žádná omezení pro rozměry na výšku uživatele. (Automatic Translation)
users-image-maximum-width-help=Nastavte maximální šířku na výšku uživatele v pixelech. Hodnota 0 označuje žádná omezení pro rozměry na výšku uživatele. (Automatic Translation)