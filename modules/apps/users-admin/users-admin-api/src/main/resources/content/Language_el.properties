organizations-types-help=Ορίστε αυτό το αντικείμενο JSON για να αλλάξετε τους τύπους οργανισμών. Προσθέστε μια νέα ιδιότητα στο αντικείμενο JSON για να δημιουργήσετε έναν νέο τύπο οργανισμού. (Automatic Translation)
use-initials-for-default-user-portrait=Χρήση αρχικών για προεπιλεγμένο πορτρέτο χρήστη (Automatic Translation)
use-initials-for-default-user-portrait-help=Ορίστε αυτό ως αληθές για να χρησιμοποιήσετε τα αρχικά του χρήστη ως το προεπιλεγμένο πορτρέτο χρήστη. Διαφορετικά, θα χρησιμοποιηθούν τα προεπιλεγμένα αρχεία εικόνας πορτρέτου. Η προεπιλεγμένη διαδρομή εικόνας πορτρέτου μπορεί να οριστεί μέσω των ιδιοτήτων "image.default.user.male.portrait" και "image.default.user.female.portrait" στο portal.properties. (Automatic Translation)
user-file-uploads-configuration-name=Εικόνες χρηστών (Automatic Translation)
users-image-check-token-help=Ορίστε αυτό ως αληθές για να ελέγξετε το διακριτικό εικόνας πριν το εμφανίσετε. (Automatic Translation)
users-image-maximum-file-size-help=Ορίστε το μέγιστο μέγεθος αρχείου για πορτρέτα χρηστών. Μια τιμή 0 για το μέγιστο μέγεθος αρχείου μπορεί να χρησιμοποιηθεί για να υποδείξει απεριόριστο μέγεθος αρχείου. Ωστόσο, το μέγιστο επιτρεπόμενο μέγεθος αρχείου ορίζεται στην ιδιότητα "com.liferay.portal.upload.UploadServletRequestImpl.max.size". (Automatic Translation)
users-image-maximum-height-help=Ορίστε το μέγιστο ύψος πορτρέτου χρήστη σε pixel. Η τιμή 0 δεν υποδεικνύει περιορισμούς στις διαστάσεις πορτρέτου χρήστη. (Automatic Translation)
users-image-maximum-width-help=Ορίστε το μέγιστο πλάτος πορτρέτου χρήστη σε pixel. Η τιμή 0 δεν υποδεικνύει περιορισμούς στις διαστάσεις πορτρέτου χρήστη. (Automatic Translation)