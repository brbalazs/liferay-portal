use-initials-for-default-user-portrait-help=این را درست تنظیم کنید تا از حروف اول کاربر به عنوان پرتره کاربر پیش فرض استفاده کنید. در غیر این صورت از فایل های تصویر پرتره پیش فرض استفاده خواهد شد. مسیر تصویر پرتره پیش فرض را می توان از طریق خواص "image.default.user.male.portrait" و "image.default.user.female.portrait" در portal.properties تنظیم کرد. (Automatic Translation)
