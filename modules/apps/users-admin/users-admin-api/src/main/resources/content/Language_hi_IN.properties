check-token=इमेज टोकन की जांच करें (Automatic Translation)
maximum-height=अधिकतम ऊंचाई (Automatic Translation)
maximum-width=अधिकतम चौड़ाई (Automatic Translation)
organizations-types-help=संगठनों के प्रकारों को बदलने के लिए इस JSON ऑब्जेक्ट सेट करें। एक नया संगठन प्रकार बनाने के लिए जेएसओएन ऑब्जेक्ट में एक नई संपत्ति जोड़ें। (Automatic Translation)
use-initials-for-default-user-portrait=डिफ़ॉल्ट उपयोगकर्ता पोर्ट्रेट के लिए प्रथमाक्षर का उपयोग करें (Automatic Translation)
use-initials-for-default-user-portrait-help=डिफ़ॉल्ट उपयोगकर्ता चित्र के रूप में उपयोगकर्ता के प्रथमाक्षर का उपयोग करने के लिए इसे सही करें। अन्यथा, डिफ़ॉल्ट पोर्ट्रेट इमेज फाइलों का उपयोग किया जाएगा। डिफ़ॉल्ट पोर्ट्रेट इमेज पथ को पोर्टल.गुणों में "image.user.male.portrait" और "image.default.user.female.portrait" के माध्यम से सेट किया जा सकता है। (Automatic Translation)
user-file-uploads-configuration-name=उपयोगकर्ता छवियां (Automatic Translation)
users-image-check-token-help=इसे प्रदर्शित करने से पहले छवि टोकन की जांच करने के लिए इसे सही करने के लिए सेट करें। (Automatic Translation)
users-image-maximum-file-size-help=उपयोगकर्ता पोर्ट्रेट के लिए अधिकतम फ़ाइल आकार सेट करें। असीमित फ़ाइल आकार को इंगित करने के लिए अधिकतम फ़ाइल आकार के लिए 0 के मूल्य का उपयोग किया जा सकता है। हालांकि, अधिकतम फ़ाइल आकार की अनुमति संपत्ति "com.liferay.portal.upload.Upload.UploadServletRequestImpl.max.size" में सेट की गई है। (Automatic Translation)
users-image-maximum-height-help=पिक्सल में अधिकतम उपयोगकर्ता पोर्ट्रेट ऊंचाई सेट करें। 0 का मूल्य उपयोगकर्ता पोर्ट्रेट आयामों पर कोई प्रतिबंध नहीं इंगित करता है। (Automatic Translation)
users-image-maximum-width-help=पिक्सल में अधिकतम उपयोगकर्ता पोर्ट्रेट चौड़ाई सेट करें। 0 का मूल्य उपयोगकर्ता पोर्ट्रेट आयामों पर कोई प्रतिबंध नहीं इंगित करता है। (Automatic Translation)