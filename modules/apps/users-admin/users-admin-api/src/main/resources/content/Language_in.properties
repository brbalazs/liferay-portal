use-initials-for-default-user-portrait-help=Atur ini ke true untuk menggunakan inisial pengguna sebagai potret pengguna default. Jika tidak, file gambar potret default akan digunakan. Jalur gambar potret default dapat diatur melalui properti "image.default.user.male.portrait" dan "image.default.user.female.portrait" di portal.properties. (Automatic Translation)
