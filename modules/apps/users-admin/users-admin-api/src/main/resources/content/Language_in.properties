users-image-check-token-help=Atur ini ke true untuk memeriksa token gambar sebelum menampilkannya. (Automatic Translation)
users-image-maximum-file-size-help=Atur ukuran file maksimum untuk potret pengguna. Nilai 0 untuk ukuran file maksimum dapat digunakan untuk menunjukkan ukuran file tanpa batas. Namun, ukuran file maksimum yang diizinkan diatur di properti "com.liferay.portal.upload.UploadServletRequestImpl.max.size". (Automatic Translation)
users-image-maximum-height-help=Atur tinggi potret pengguna maksimum dalam piksel. Nilai 0 menunjukkan tidak ada batasan pada dimensi potret pengguna. (Automatic Translation)
users-image-maximum-width-help=Atur lebar potret pengguna maksimum dalam piksel. Nilai 0 menunjukkan tidak ada batasan pada dimensi potret pengguna. (Automatic Translation)