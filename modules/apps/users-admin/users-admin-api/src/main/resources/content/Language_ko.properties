users-image-check-token-help=이미지 토큰을 표시하기 전에 이미지 토큰을 확인하려면 이 것을 true로 설정합니다. (Automatic Translation)
users-image-maximum-file-size-help=사용자 세로의 최대 파일 크기를 설정합니다. 최대 파일 크기에 대해 0값을 사용하여 파일 크기를 무제한으로 나타낼 수 있습니다. 그러나 허용되는 최대 파일 크기는 "com.liferay.portal.upload.UploadServletRequestImpl.max.size"에 설정되어 있습니다. (Automatic Translation)
users-image-maximum-height-help=픽셀단위로 최대 사용자 세로 높이를 설정합니다. 값이 0인 값은 사용자 세로 치수에 대한 제한을 나타내지 않습니다. (Automatic Translation)
users-image-maximum-width-help=픽셀단위로 최대 사용자 세로 너비를 설정합니다. 값이 0인 값은 사용자 세로 치수에 대한 제한을 나타내지 않습니다. (Automatic Translation)