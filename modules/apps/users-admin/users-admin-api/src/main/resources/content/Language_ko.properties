use-initials-for-default-user-portrait=기본 사용자 세로에 이스리 사용 (Automatic Translation)
use-initials-for-default-user-portrait-help=사용자의 이슬을 기본 사용자 세로로 사용하도록 이 것을 true로 설정합니다. 그렇지 않으면 기본 세로 이미지 파일이 사용됩니다. 기본 인물 화상 경로는 portal.properties의 속성 "image.default.user.male.portrait" 및 "image.default.user.female.portrait"을 통해 설정할 수 있습니다. (Automatic Translation)
