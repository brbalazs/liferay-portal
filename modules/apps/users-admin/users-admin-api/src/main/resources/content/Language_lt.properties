use-initials-for-default-user-portrait-help=Nustatykite, kad tai teisinga, jei vartotojo inicialai būtų naudojami kaip numatytasis vartotojo stačias. Kitu atveju bus naudojami numatytieji portretinio vaizdo failai. Numatytąjį portreto vaizdo kelią galima nustatyti naudojant portalo.properties ypatybes "image.default.user.male.portrait" ir "image.default.user.female.portrait". (Automatic Translation)
