users-image-check-token-help=Nustatykite, kad tai teisinga, kad prieš rodydami jį patikrintumėte vaizdo atpažinimo ženklą. (Automatic Translation)
users-image-maximum-file-size-help=Nustatykite maksimalų vartotojo stačių failo dydį. Norint nurodyti neribotą failo dydį, galima naudoti maksimalaus failo dydžio reikšmę 0. Tačiau maksimalus leistinas failo dydis nustatytas ypatybėje "com.liferay.portal.upload.UploadServletRequestImpl.max.size". (Automatic Translation)
users-image-maximum-height-help=Nustatykite maksimalų vartotojo stačią aukštį pikseliais. Reikšmė 0 nenurodo jokių vartotojo stačios dimensijos apribojimų. (Automatic Translation)
users-image-maximum-width-help=Nustatykite maksimalų vartotojo stačią plotį pikseliais. Reikšmė 0 nenurodo jokių vartotojo stačios dimensijos apribojimų. (Automatic Translation)