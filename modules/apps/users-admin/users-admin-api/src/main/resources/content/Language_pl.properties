organizations-types-help=Ustaw ten obiekt JSON, aby zmienić typy organizacji. Dodaj nową właściwość do obiektu JSON, aby utworzyć nowy typ organizacji. (Automatic Translation)
use-initials-for-default-user-portrait=Używanie inicjałów w domyślnej orientacji pionowej użytkownika (Automatic Translation)
use-initials-for-default-user-portrait-help=Ustaw tę wartość true, aby używać inicjałów użytkownika jako domyślnego portretu użytkownika. W przeciwnym razie zostaną użyte domyślne pliki obrazów portretowych. Domyślną ścieżkę obrazu portretowego można ustawić za pomocą właściwości "image.default.user.male.portrait" i "image.default.user.female.portrait" w portalu.properties. (Automatic Translation)
user-file-uploads-configuration-name=Obrazy użytkownika (Automatic Translation)
users-image-check-token-help=Ustaw tę wartość na true, aby sprawdzić token obrazu przed jego wyświetleniem. (Automatic Translation)
users-image-maximum-file-size-help=Ustaw maksymalny rozmiar pliku dla portretów użytkownika. Wartość 0 dla maksymalnego rozmiaru pliku może służyć do wskazania nieograniczonego rozmiaru pliku. Jednak maksymalny dozwolony rozmiar pliku jest ustawiony we właściwości "com.liferay.portal.upload.UploadServletRequestImpl.max.size". (Automatic Translation)
users-image-maximum-height-help=Ustaw maksymalną wysokość portretu użytkownika w pikselach. Wartość 0 oznacza brak ograniczeń dotyczących wymiarów portretu użytkownika. (Automatic Translation)
users-image-maximum-width-help=Ustaw maksymalną szerokość portretu użytkownika w pikselach. Wartość 0 oznacza brak ograniczeń dotyczących wymiarów portretu użytkownika. (Automatic Translation)