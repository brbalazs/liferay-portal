use-initials-for-default-user-portrait-help=Setați acest lucru la adevărat pentru a utiliza inițialele utilizatorului ca portret de utilizator implicit. În caz contrar, se vor utiliza fișierele imagine portret implicite. Calea implicită a imaginii portret poate fi setată prin proprietățile "image.default.user.male.portrait" și "image.default.user.female.portrait" din portal.properties. (Automatic Translation)
