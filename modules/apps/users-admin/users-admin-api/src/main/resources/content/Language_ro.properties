users-image-maximum-file-size-help=Setați dimensiunea maximă a fișierului pentru portretele utilizatorilor. O valoare de 0 pentru dimensiunea maximă a fișierului poate fi utilizată pentru a indica dimensiunea nelimitată a fișierului. Cu toate acestea, dimensiunea maximă a fișierului permisă este setată în proprietatea "com.liferay.portal.upload.UploadServletRequestImpl.max.size". (Automatic Translation)
users-image-maximum-height-help=Setați înălțimea maximă a portretului utilizatorului în pixeli. O valoare de 0 nu indică restricții privind dimensiunile portretului utilizatorului. (Automatic Translation)
