organizations-types-help=Установите этот объект JSON для изменения типов организаций. Добавьте новое свойство в объект JSON для создания нового типа организации. (Automatic Translation)
use-initials-for-default-user-portrait=Используйте инициалы для портрета пользователя по умолчанию (Automatic Translation)
use-initials-for-default-user-portrait-help=Установите это, чтобы верно использовать инициалы пользователя в качестве портрета пользователя по умолчанию. В противном случае будут использованы файлы портретного изображения по умолчанию. Путь портретного изображения по умолчанию может быть установлен по свойствам "image.default.user.male.portrait" и "image.default.user.female.portrait" на portal.properties. (Automatic Translation)
user-file-uploads-configuration-name=Изображения пользователей (Automatic Translation)
users-image-check-token-help=Установите это, чтобы проверить маркер изображения перед отображением. (Automatic Translation)
users-image-maximum-file-size-help=Установите максимальный размер файла для портретов пользователей. Значение 0 для максимального размера файла может быть использовано для обозначения неограниченного размера файла. Тем не менее, максимальный допустимый размер файла установлен в свойстве "com.liferay.portal.upload.UploadServletRequestImpl.max.size". (Automatic Translation)
users-image-maximum-height-help=Установите максимальную высоту портрета пользователя в пикселях. Значение 0 не указывает на отсутствие ограничений на размеры портрета пользователя. (Automatic Translation)
users-image-maximum-width-help=Установите максимальную ширину портрета пользователя в пикселях. Значение 0 не указывает на отсутствие ограничений на размеры портрета пользователя. (Automatic Translation)