organizations-types-help=Ak chcete zmeniť typy organizácií, nastavte tento objekt JSON. Pridajte novú vlastnosť do objektu JSON a vytvorte nový typ organizácie. (Automatic Translation)
use-initials-for-default-user-portrait=Použiť iniciály pre predvolený portrét používateľa (Automatic Translation)
use-initials-for-default-user-portrait-help=Nastavte túto hodnotu na hodnotu true, ak chcete použiť iniciály používateľa ako predvolený portrét používateľa. V opačnom prípade sa použijú predvolené súbory s obrázkami na výšku. Predvolenú cestu k portrétnemu obrazu je možné nastaviť pomocou vlastností "image.default.user.male.portrait" a "image.default.user.female.portrait" v portal.properties. (Automatic Translation)
user-file-uploads-configuration-name=Obrázky používateľov (Automatic Translation)
users-image-check-token-help=Nastavte ho na hodnotu true, aby ste pred zobrazením skontrolovali token obrázka. (Automatic Translation)
users-image-maximum-file-size-help=Nastavte maximálnu veľkosť súboru pre portréty používateľov. Hodnotu 0 pre maximálnu veľkosť súboru možno použiť na označenie neobmedzenej veľkosti súboru. Maximálna povolená veľkosť súboru je však nastavená vo vlastnosti "com.liferay.portal.upload.UploadServletRequestImpl.max.size". (Automatic Translation)
users-image-maximum-height-help=Nastavte maximálnu výšku portrétu používateľa v pixeloch. Hodnota 0 označuje žiadne obmedzenia rozmerov portrétu používateľa. (Automatic Translation)
users-image-maximum-width-help=Nastavte maximálnu šírku portrétu používateľa v pixeloch. Hodnota 0 označuje žiadne obmedzenia rozmerov portrétu používateľa. (Automatic Translation)