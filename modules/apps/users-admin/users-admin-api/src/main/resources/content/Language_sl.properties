use-initials-for-default-user-portrait-help=To nastavite tako, da bo uporabil začetnice uporabnika kot privzeti uporabniški portret. V nasprotnem primeru bodo uporabljene privzete slikovne datoteke pokonci. Privzeto pot portretne slike lahko nastavite prek lastnosti "image.default.user.male.portrait" in "image.default.user.female.portrait" v portal.properties. (Automatic Translation)
