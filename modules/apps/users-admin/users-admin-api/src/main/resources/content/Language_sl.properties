users-image-maximum-file-size-help=Nastavite največjo velikost datoteke za uporabniške portrete. Vrednost 0 za največjo velikost datoteke lahko označuje neomejeno velikost datoteke. Največja dovoljena velikost datoteke pa je nastavljena v lastnosti "com.liferay.portal.upload.UploadServletRequestImpl.max.size". (Automatic Translation)
users-image-maximum-height-help=Nastavite največjo višino uporabniškega portreta v pikslih. Vrednost 0 ne pomeni omejitev dimenzij uporabniškega portreta. (Automatic Translation)
