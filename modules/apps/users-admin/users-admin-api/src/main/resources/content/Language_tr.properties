users-image-maximum-file-size-help=Kullanıcı portreleri için en büyük dosya boyutunu ayarlayın. En büyük dosya boyutu için 0 değeri sınırsız dosya boyutunu belirtmek için kullanılabilir. Ancak, izin verilen en büyük dosya boyutu "com.liferay.portal.upload.UploadServletRequestImpl.max.size" özelliğinde ayarlanır. (Automatic Translation)
users-image-maximum-height-help=Maksimum kullanıcı portresi yüksekliğini piksel cinsinden ayarlayın. 0 değeri, kullanıcı portresi boyutlarında kısıtlama olmadığını gösterir. (Automatic Translation)
users-image-maximum-width-help=En fazla kullanıcı dikey genişliğini piksel cinsinden ayarlayın. 0 değeri, kullanıcı portresi boyutlarında kısıtlama olmadığını gösterir. (Automatic Translation)