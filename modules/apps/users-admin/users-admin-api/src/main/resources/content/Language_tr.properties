use-initials-for-default-user-portrait-help=Varsayılan kullanıcı portresi olarak kullanıcının baş harflerini kullanmak için bunu true olarak ayarlayın. Aksi takdirde, varsayılan dikey görüntü dosyaları kullanılır. Varsayılan dikey görüntü yolu portal.properties içindeki "image.default.user.male.portrait" ve "image.default.user.female.portrait" özellikleri aracılığıyla ayarlanabilir. (Automatic Translation)
