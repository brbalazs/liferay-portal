organizations-types-help=Встановіть цей об'єкт JSON для зміни типів організацій. Додайте нову властивість до об'єкта JSON, щоб створити новий тип організації. (Automatic Translation)
use-initials-for-default-user-portrait=Використовувати ініціали для книжкової орієнтації користувача за промовчанням (Automatic Translation)
use-initials-for-default-user-portrait-help=Встановіть значення true, щоб використовувати ініціали користувача як портрет користувача за промовчанням. Інакше буде використано типові файли портретних зображень. Шлях до портретного зображення за промовчанням можна встановити за допомогою властивостей "image.default.user.male.portrait" і "image.default.user.female.portrait" у властивості portal.properties. (Automatic Translation)
user-file-uploads-configuration-name=Зображення користувача (Automatic Translation)
users-image-check-token-help=Встановіть для цього значення true, щоб перевірити маркер зображення перед його показом. (Automatic Translation)
users-image-maximum-file-size-help=Установіть максимальний розмір файлу для портретів користувачів. Значення 0 для максимального розміру файлу можна використовувати для позначення необмеженого розміру файлу. Однак максимальний дозволений розмір файлу встановлюється у властивості "com.liferay.portal.upload.UploadServletRequestImpl.max.size". (Automatic Translation)
users-image-maximum-height-help=Встановіть максимальну висоту портрета користувача в пікселях. Значення 0 не вказує на обмеження книжкових розмірів користувача. (Automatic Translation)
users-image-maximum-width-help=Встановити максимальну ширину портрета користувача в пікселях. Значення 0 не вказує на обмеження книжкових розмірів користувача. (Automatic Translation)