organizations-types-help=Đặt đối tượng JSON này để thay đổi các loại tổ chức. Thêm một thuộc tính mới vào đối tượng JSON để tạo một loại tổ chức mới. (Automatic Translation)
use-initials-for-default-user-portrait=Sử dụng tên viết tắt cho chân dung người dùng mặc định (Automatic Translation)
use-initials-for-default-user-portrait-help=Đặt điều này thành true để sử dụng tên viết tắt của người dùng làm chân dung người dùng mặc định. Nếu không, các tệp hình ảnh chân dung mặc định sẽ được sử dụng. Đường dẫn hình ảnh chân dung mặc định có thể được đặt thông qua các thuộc tính "image.default.user.male.portrait" và "image.default.user.female.portrait" trong portal.properties. (Automatic Translation)
user-file-uploads-configuration-name=Hình ảnh người dùng (Automatic Translation)
users-image-check-token-help=Đặt điều này thành true để kiểm tra mã thông báo hình ảnh trước khi hiển thị nó. (Automatic Translation)
users-image-maximum-file-size-help=Đặt kích thước tệp tối đa cho chân dung người dùng. Giá trị 0 cho kích thước tệp tối đa có thể được sử dụng để chỉ ra kích thước tệp không giới hạn. Tuy nhiên, kích thước tệp tối đa cho phép được đặt trong thuộc tính "com.liferay.portal.upload.UploadServletRequestImpl.max.size". (Automatic Translation)
users-image-maximum-height-help=Đặt chiều cao chân dung người dùng tối đa tính bằng pixel. Giá trị 0 cho biết không có giới hạn đối với thứ nguyên chân dung người dùng. (Automatic Translation)
users-image-maximum-width-help=Đặt chiều rộng chân dung người dùng tối đa tính bằng pixel. Giá trị 0 cho biết không có giới hạn đối với thứ nguyên chân dung người dùng. (Automatic Translation)