check-token=件查圖片 Token
maximum-height=最大高度
maximum-width=最大寬度
organizations-types-help=設置此 JSON 物件以更改組織類型。向 JSON 物件添加新屬性以創建新的組織類型。
use-initials-for-default-user-portrait=為預設使用者肖像使用首字母縮寫
use-initials-for-default-user-portrait-help=將此設置為真實，以使用使用者的首字母縮寫作為默認使用者肖像。否則，將使用預設的縱向圖像檔。默認人像路徑可以通過入口網站屬性中的屬性「圖像.default.使用者.male.肖像」和「圖像.預設使用者.女性.肖像」設置。 (Automatic Translation)
user-file-uploads-configuration-name=使用者圖片
users-image-check-token-help=將此設定為真值，以便在顯示圖像權杖之前檢查圖像權杖。 (Automatic Translation)
users-image-maximum-file-size-help=為使用者肖像設置最大檔大小。最大檔案大小的值為 0 可用於指示無限的檔案大小。但是，允許的最大檔大小設置在屬性"com.liferay.portal.上傳.上傳服務查詢.max.大小"。 (Automatic Translation)
users-image-maximum-height-help=以圖元為單位，設置使用者肖像最大高度。值為0表示垂直方向上的圖像大小沒有限制。
users-image-maximum-width-help=設置最大使用者封面相片的寬度（以像素為單位）。 值為 0 表示對使用者封面相片的尺寸沒有限制。