_format_version: "3.0"
plugins:
  - config:
      cache_control: false
      cache_ttl: 30
      content_type:
        - application/json; charset=utf-8
      ignore_uri_case: false
      memory:
        dictionary_name: kong_db_cache
      request_method:
        - GET
      response_code:
        - 200
      storage_ttl: null
      strategy: memory
      vary_headers: null
      vary_query_params: null
    enabled: true
    name: proxy-cache
    protocols:
      - http
services:
  - connect_timeout: 60000
    enabled: true
    host: backend.ac.dev.internal
    name: ac_backend_service
    port: 8086
    protocol: http
    read_timeout: 60000
    retries: 5
    routes:
      - hosts:
          - backend.ac.dev.internal
        https_redirect_status_code: 426
        name: ac_backend_route
        path_handling: v0
        preserve_host: true
        protocols:
          - http
        regex_priority: 0
        request_buffering: true
        response_buffering: true
        strip_path: true
    write_timeout: 60000
  - connect_timeout: 60000
    enabled: true
    host: publisher.ac.dev.internal
    name: ac_publisher_service
    port: 8084
    protocol: http
    read_timeout: 60000
    retries: 5
    routes:
      - hosts:
          - publisher.ac.dev.internal
        https_redirect_status_code: 426
        name: ac_publisher_route
        path_handling: v0
        preserve_host: true
        protocols:
          - http
        regex_priority: 0
        request_buffering: true
        response_buffering: true
        strip_path: true
    write_timeout: 60000