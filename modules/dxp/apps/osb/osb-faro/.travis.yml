addons:
    chrome: stable
before_install:
    - mv $HOME/build $HOME/faro
    - TRAVIS_BUILD_DIR=$HOME/faro/$TRAVIS_REPO_SLUG
cache:
    directories:
        - $HOME/.gradle/caches/
        - $HOME/.gradle/wrapper/
    timeout: 600
dist: trusty
env:
    global:
        - NODE_OPTIONS=--max_old_space_size=2048
jdk: oraclejdk8
jobs:
    include:
        - stage: push docker image
          if: branch = 7.1.x AND type = push
          script: ./gradlew pushAppDockerImage
        - stage: source formatting checks
          script: ./gradlew packageRunLint checkSourceFormatting pmdMain pmdTest pmdTestIntegration
        - stage: javascript tests
          script: ./gradlew packageRunWebpack packageRunTest
          after_success: ./gradlew packageRunCoveralls
services:
    - docker
sudo: required