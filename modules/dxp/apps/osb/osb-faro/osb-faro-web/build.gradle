configJSModules {
	dependsOn = []
	enabled = false
}

dependencies {
	compileInclude group: "com.fasterxml.jackson.core", name: "jackson-annotations", version: "2.9.10"
	compileInclude group: "com.fasterxml.jackson.core", name: "jackson-core", version: "2.9.10"
	compileInclude group: "com.fasterxml.jackson.core", name: "jackson-databind", version: "2.9.10.4"
	compileInclude group: "com.fasterxml.jackson.dataformat", name: "jackson-dataformat-yaml", version: "2.9.6"
	compileInclude group: "com.fasterxml.jackson.jaxrs", name: "jackson-jaxrs-base", version: "2.9.1"
	compileInclude group: "com.fasterxml.jackson.jaxrs", name: "jackson-jaxrs-json-provider", version: "2.9.1"
	compileInclude group: "com.fasterxml.jackson.module", name: "jackson-module-jaxb-annotations", version: "2.9.1"
	compileInclude group: "com.github.scribejava", name: "scribejava-core", version: "3.2.0"
	compileInclude group: "com.univocity", name: "univocity-parsers", version: "2.4.1"
	compileInclude group: "commons-codec", name: "commons-codec", version: "1.11"
	compileInclude group: "javax.annotation", name: "javax.annotation-api", version: "1.2"
	compileInclude group: "org.apache.commons", name: "commons-collections4", version: "4.4"
	compileInclude group: "org.apache.httpcomponents", name: "httpclient", version: "4.5.5"
	compileInclude group: "org.apache.httpcomponents", name: "httpcore", version: "4.4.10"
	compileInclude group: "org.yaml", name: "snakeyaml", version: "1.15"

	compileOnly group: "com.liferay", name: "com.liferay.oauth2.provider.api", version: "1.2.2"
	compileOnly group: "com.liferay", name: "com.liferay.oauth2.provider.scope.api", version: "1.0.4"
	compileOnly group: "com.liferay", name: "com.liferay.osgi.util", version: "4.0.0"
	compileOnly group: "com.liferay", name: "com.liferay.petra.lang", version: "2.0.0"
	compileOnly group: "com.liferay", name: "com.liferay.petra.string", version: "2.0.0"
	compileOnly group: "com.liferay", name: "com.liferay.portal.instance.lifecycle.api", version: "1.0.3"
	compileOnly group: "com.liferay", name: "com.liferay.registry.api", version: "2.0.0"
	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.kernel", version: "3.0.0"
	compileOnly group: "com.liferay.portal", name: "com.liferay.util.taglib", version: "3.0.0"
	compileOnly group: "javax.mail", name: "mail", version: "1.4"
	compileOnly group: "javax.portlet", name: "portlet-api", version: "3.0.0"
	compileOnly group: "javax.servlet", name: "javax.servlet-api", version: "3.0.1"
	compileOnly group: "javax.ws.rs", name: "javax.ws.rs-api", version: "2.1"
	compileOnly group: "org.apache.cxf", name: "cxf-core", version: "3.2.5"
	compileOnly group: "org.apache.cxf", name: "cxf-rt-frontend-jaxrs", version: "3.2.5"
	compileOnly group: "org.osgi", name: "org.osgi.core", version: "6.0.0"
	compileOnly group: "org.osgi", name: "org.osgi.service.cm", version: "1.5.0"
	compileOnly group: "org.osgi", name: "org.osgi.service.component.annotations", version: "1.3.0"
	compileOnly project(":dxp:apps:osb:osb-faro:osb-faro-api")
	compileOnly project(":dxp:apps:osb:osb-faro:osb-faro-contacts-api")
	compileOnly project(":dxp:apps:osb:osb-faro:osb-faro-engine-client")
	compileOnly project(":dxp:apps:osb:osb-faro:osb-faro-provisioning-client")
}

generateJSPJava {
	enabled = false
}

packageRunWebpack {
	if (project.hasProperty("faroEnvironmentName")) {
		environment "FARO_ENVIRONMENT_NAME", faroEnvironmentName
	}

	enabled = ((System.getProperty("user.name") != "root") || (System.getProperty("liferay.ci") == "true"))

	inputs.dir "src/main/css"
	inputs.dir "src/main/images"
	inputs.dir "src/main/js"

	outputs.dir "src/main/resources/META-INF/resources/dist"
}

processResources {
	dependsOn packageRunWebpack
}