cross-cluster-replication-enabled-help=Ενεργοποίηση ή απενεργοποίηση λειτουργιών ανάγνωσης από τα τοπικά συμπλέγματα Elasticsearch. Αυτή η ρύθμιση χρησιμοποιείται μόνο όταν η λειτουργία λειτουργίας έχει οριστεί σε REMOTE. Ρυθμίστε τις παραμέτρους της λειτουργίας στις Ρυθμίσεις συστήματος Elasticsearch. (Automatic Translation)
