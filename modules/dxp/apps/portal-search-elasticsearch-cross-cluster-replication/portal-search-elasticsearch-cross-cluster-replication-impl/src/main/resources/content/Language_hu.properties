authentication-enabled=Hitelesítés engedélyezve
authentication-enabled-help=Ha be van jelölve, a kapcsolatok a konfigurált felhasználónév és jelszó segítségével vannak hitelesítve.
automatic-replication-enabled=Automatic Replication Enabled (Automatic Copy)
automatic-replication-enabled-help=Enable or disable automatic creation of follower indexes in the local Elasticsearch clusters when Read from Local Clusters is enabled. Disable this setting if replication will be managed manually through Elasticsearch. (Automatic Copy)
certificate-format=Tanúsítvány formátuma
certificate-format-help=Adja meg a tanúsítvány formátumát (PEM vagy PKCS#12).
client-transport-ignore-cluster-name=Ügyfélszállítás mellőzi a fürtnevet
client-transport-ignore-cluster-name-help=Ha be van jelölve, a rendszer figyelmen kívül hagyja az összekapcsolt csomópontok fürtnév hitelesítését.
client-transport-nodes-sampler-interval=Ügyfélszállítás csomópontok mintavételi intervalluma
client-transport-nodes-sampler-interval-help=Az időköz (másodpercben), amellyel az ügyfél csomópont mintavételt/pinget végez az összekapcsolt csomópontokon. Ha nincs beállítva, az alapértelmezett Elasticsearch client.transport.nodes_sampler_interval értéket használja.
client-transport-ping-timeout=Ügyfélszállítás ping időtúllépése
client-transport-ping-timeout-help=Az idő (másodpercben), amennyit az ügyfél csomópontja vár, hogy a ping választ kapjon egy csomóponttól. Ha nincs beállítva, az alapértelmezett Elasticsearch client.transport.ping_timeout értéket használja.
client-transport-sniff=Ügyfélszállítás keresőprogram
client-transport-sniff-help=Ha be van jelölve, a fürt keresőprogram dinamikusan kikeresheti a fürt elérhető csomópontjait.
cluster-name=Fürt neve
cluster-name-help=Adja meg a helyi fürt nevét, amelyet az olvasási műveletek során használ.
connection-id=Kapcsolatazonosító
connection-id-help=Egyedi azonosító beállítása ehhez a kapcsolathoz.
cross-cluster-replication-configuration-name=Fürtközi replikálás
cross-cluster-replication-enabled=Read from Local Clusters (Automatic Copy)
cross-cluster-replication-enabled-help=A helyi fürt olvasási műveleteinek engedélyezése vagy letiltása. Ez a beállítás csak REMOTE műveleti mód esetén használt. A műveleti mód az Elasticsearch rendszerbeállításoknál van meghatározva.
cross-cluster-replication-local-cluster-connection-configurations=Local Cluster Configurations (Automatic Copy)
cross-cluster-replication-local-cluster-connection-configurations-help=Társítsa az egyes portálcímeket helyi (csak olvasható) Elasticsearch fürtcsatlakozás-azonosítókhoz. Kövesse a hostname:port,connectionId mintát. A csatlakozások az Fürtközi replikálás Elasticsearch csatlakozása rendszerbeállításainál vannak definiálva.
elasticsearch-connection-configuration-name=Fürtközi replikálás Elasticsearch csatlakozása
excluded-indexes=Kizárt indexek
excluded-indexes-help=Enter the index names that will be excluded from cross-cluster replication. Indexes starting with a period (.) will always be excluded. By default, all indexes in the remote cluster will be replicated to the local cluster. This setting is ignored if Automatic Replication is not enabled. (Automatic Copy)
network-host-address=Hálózati állomás címe
network-host-address-help=Állítsa be a távoli HTTP-állomást, amelyhez csatlakozni kíván.
password-help=Ha a Hitelesítés engedélyezve mező be van jelölve, a jelszó kötelező.
please-set-a-connection-id=Állítsa be a csatlakozás azonosítót.
please-set-a-hostname-and-connection-id=Állítson be egy állomásnevet vagy csatlakozás azonosítót.
please-set-the-network-host-address=Állítsa be a hálózati állomáscímet.
remote-cluster-alias=Távoli fürt alias neve
remote-cluster-alias-help=Adja meg az aliast, amelyet a távoli fürt azonosításához kell használni a távoli és helyi fürt közötti kapcsolat létesítése során.
remote-cluster-seed-node-transport-address=Távoli fürt magcsomópontjának szállítási címe
remote-cluster-seed-node-transport-address-help=Adja meg a távoli fürt egy csomópontjának szállítási címét, amelynek segítségével létrehozható a kapcsolat a távoli és a helyi fürt között.
ssl-certificate-authorities-paths=SSL hitelesítésszolgáltatók
ssl-certificate-authorities-paths-help=Adja meg a megbízható PEM-kódolású tanúsítványfájlokhoz vezető útvonalak listáját.
ssl-certificate-path=SSL-tanúsítvány
ssl-certificate-path-help=Adjon meg egy tanúsítványt (vagy tanúsítványláncot) tartalmazó PEM-kódolású fájl útvonalát, amely csatlakozáskor megjelenik az ügyfelek előtt.
ssl-key-path=SSL kulcs
ssl-key-path-help=Adja meg a privát kulcsot tartalmazó PEM-kódolású fájl útvonalát.
ssl-keystore-password=SSL Keystore jelszó
ssl-keystore-password-help=Adja meg a PKCS#12 fájl jelszavát.
ssl-keystore-path=SSL Keystore elérési útvonala
ssl-keystore-path-help=Adja meg a privát kulcsot és a tanúsítványt tartalmazó kulcstár útvonalát.
ssl-truststore-password=SSL Truststore jelszó
ssl-truststore-password-help=Adja meg a Truststore jelszavát.
ssl-truststore-path=SSL Truststore elérési útvonala
ssl-truststore-path-help=Adja meg a Truststore fájl útvonalát.
the-connection-id-cannot-be-changed=A kapcsolat azonosítója nem módosítható.
the-id-you-entered-is-reserved-x=A megadott azonosító foglalt: {0}.
there-is-already-a-connection-with-the-id-x=Már létezik kapcsolat ilyen azonosítóval: {0}.
transport-addresses=Szállítási címek
transport-addresses-help=Állítsa be a távoli csomópontok címét, amelyekhez csatlakozni kíván.
transport-ssl-enabled=Transport SSL engedélyezve
transport-ssl-enabled-help=TLS/SSL engedélyezése vagy letiltása. Ez a beállítás csak akkor alkalmazható, ha a Hitelesítés engedélyezve mező be van jelölve.
transport-ssl-verification-mode=Transport SSL hitelesítési mód
transport-ssl-verification-mode-help=Adja meg a hitelesítés típusát (nincs, tanúsítvány vagy teljes) az LDAP használata esetére közbeékelődéses támadás és tanúsítványhamisítás elleni védelemhez.
username=Felhasználónév
username-help=Ha a Hitelesítés szükséges lehetőség engedélyezve van, be kell állítani az Elasticsearch hitelesítéshez használt felhasználónevet.